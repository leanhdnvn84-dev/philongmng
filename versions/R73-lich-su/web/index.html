<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c62828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PHI LONG HR">
  <title>PHI LONG HR — Phi Long Technology</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=5">
  <link rel="manifest" href="./site.webmanifest?v=5">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; font: 14px Roboto, Arial, sans-serif; }
    .webapp { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #fff; color: #444; transition: opacity .3s; z-index: 2; }
    .splash img { width: 120px; height: 120px; }
    .splash .bar { width: 160px; height: 3px; border-radius: 3px; background: #f1d2d2; overflow: hidden; }
    .splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #e31b23; animation: run 1.1s ease-in-out infinite; }
    .splash a { display: none; color: #c62828; font-weight: 700; }
    .splash.slow a { display: inline; }
    .splash.done { opacity: 0; pointer-events: none; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <main class="webapp">
    <div class="splash" id="splash">
      <img src="./favicon-192.png?v=5" alt="Phi Long Technology">
      <div class="bar"></div>
      <span>Đang tải PHI LONG HR…</span>
      <a id="direct" target="_blank" rel="noopener">Tải lâu? Mở trực tiếp ứng dụng ↗</a>
    </div>
    <iframe id="app"
      title="PHI LONG HR — Hệ thống quản lý nhân sự"
      allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </main>
  <script>
    // Đổi URL triển khai Apps Script (…/exec) tại đây khi tạo bản triển khai mới.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzQ00DtTN-kLZgJLFhsAX4X06vzRVqwp4KBmMyxexxIwxQ5f7A7BJUstHL16DsO6uWfoQ/exec';
    var BUILD = 'r73';
    var splash = document.getElementById('splash');
    var frame = document.getElementById('app');
    document.getElementById('direct').href = APP_URL;
    frame.addEventListener('load', function () { splash.classList.add('done'); });
    setTimeout(function () { splash.classList.add('slow'); }, 12000);
    frame.src = APP_URL + '?build=' + BUILD;
  </script>
</body>
</html>
