<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:16px;line-height:1.6;color:#22213A;background:#fff}
html{overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}main,section.view,footer.g{max-width:100%;overflow-x:clip}
@media(max-width:760px){body .p-ev .yr{font-size:min(52px,13vw)}}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fd1;outline-offset:2px}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.92);font-size:38px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.auto{aspect-ratio:auto!important;min-height:120px}.ph.auto img{position:static;height:auto}
.view{display:none}.view.on{display:block;flex:1 0 auto}
body{display:flex;flex-direction:column;min-height:100vh}main{flex:1 0 auto;display:flex;flex-direction:column}
.empty{opacity:.75;padding:20px 0}

/* ===== HEADER CHUNG ===== */
body{--hbg:#fff;--hfg:#22213A;--hac:#C8102E;--hline:#F0E6E6}
body[data-p=classes]{--hbg:#FBFBFE;--hfg:#22213A;--hac:#D62839;--hline:#4A2C8F}
body[data-p=events]{--hbg:#0B2545;--hfg:#fff;--hac:#FFB400;--hline:#0B2545}
body[data-p=yearbook]{--hbg:#4A3426;--hfg:#FAF6EE;--hac:#E8C9A0;--hline:#4A3426}
body[data-p=gallery]{--hbg:#1F3A2E;--hfg:#F2F1E8;--hac:#F6D86B;--hline:#8B5E3C}
body[data-p=connect]{--hbg:#141414;--hfg:#fff;--hac:#FFD23F;--hline:#D7261E}
body[data-p=admin]{--hbg:#fff;--hfg:#22213A;--hac:#4A2C8F;--hline:#E4DFF7}
header.g{position:sticky;top:0;z-index:40;background:var(--hbg);color:var(--hfg);border-bottom:3px solid var(--hline);transition:background .25s}
.g .in{display:flex;align-items:center;gap:14px;padding:10px 32px}
.g .brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left}
.g .brand img{width:46px;height:46px;flex:none;display:block}
.g .brand b{display:block;font-family:'Playfair Display',serif;font-size:20px;line-height:1.1}
.g .brand span{font-size:12.5px;opacity:.75}
.g nav{margin-left:auto;display:flex;gap:2px}
.g nav button{background:none;border:0;color:inherit;padding:8px 13px;font-size:14.5px;font-weight:500;opacity:.85}
.g nav button:hover{opacity:1}
.g nav button.on{opacity:1;color:var(--hac);box-shadow:inset 0 -3px 0 var(--hac)}
nav.bot{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--hbg);border-top:3px solid var(--hline)}
nav.bot button{flex:1;background:none;border:0;padding:6px 0 8px;font-size:10.5px;color:var(--hfg);opacity:.75;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bot svg{width:21px;height:21px}
nav.bot button.on{opacity:1;color:var(--hac);font-weight:700}
footer.g{padding:10px 32px;font-size:13px;line-height:1.55;align-items:center;color:#6E6A85;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;background:#fff}
footer.g a{color:#4A2C8F}
footer.g .lg{display:flex;gap:12px;align-items:center}footer.g .lg img{width:44px;height:44px;flex:none}
footer.g .ft-r{text-align:right}footer.g .ft-b{max-width:440px}footer.g .ft-b b{color:#22213A}footer.g .ft-b a{text-decoration:none;font-weight:600}footer.g .ft-r b{color:#22213A}footer.g .ft-r a{text-decoration:none;font-weight:600}footer.g .ft-r a:hover{text-decoration:underline}
@media(max-width:760px){footer.g .ft-r{text-align:left}}
.p-home .k img{width:30px;height:30px;vertical-align:middle;margin-right:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1b2e;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;display:none;z-index:200;max-width:90vw;text-align:center}
.toast.err{background:#C8102E}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:180}
.loader.on{display:grid}
.loader .ld-dau,.loader .ld-roi{display:none}
.loader.dau{background:radial-gradient(circle at 50% 38%,#FFF7EF 0%,#FDEAE1 58%,#F6D3C8 100%)}
.loader.dau .ld-thuong{display:none}
.loader.dau .ld-dau{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;position:relative;z-index:1}
.loader.dau .ld-roi{display:block;position:fixed;inset:0;overflow:hidden;pointer-events:none}
.ld-roi i{position:absolute;top:-30px;width:12px;height:8px;border-radius:70% 0 70% 0;opacity:.75;animation:roi2 linear infinite}
.ld-dau img{width:116px;height:116px;animation:ldTho 2.8s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(200,16,46,.18))}
@keyframes ldTho{50%{transform:scale(1.06)}}
.ld-ten{margin-top:18px;font-family:'Playfair Display',serif;font-weight:600;font-size:24px;line-height:1.1;color:#2B2A33}
.ld-kh{margin-top:4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8A6F6A}
.ld-cau{margin-top:18px;font-family:'Charm',cursive;font-size:24px;line-height:1.3;color:#8A3B2E;min-height:1.4em;transition:opacity .35s}
.ld-cau.an{opacity:0}
.ld-vach{margin-top:16px;width:150px;height:3px;border-radius:3px;background:rgba(200,16,46,.14);overflow:hidden}
.ld-vach i{display:block;height:100%;width:40%;border-radius:3px;background:#C8102E;animation:ldChay 1.6s ease-in-out infinite}
@keyframes ldChay{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.loader.tan{opacity:0;transition:opacity .7s ease}
@media (prefers-reduced-motion:reduce){.ld-roi{display:none!important}.ld-dau img,.ld-vach i{animation:none}}
.loader div{text-align:center;color:#4A2C8F;font-weight:600;font-size:14px}
.spin{width:40px;height:40px;border:4px solid #E4DFF7;border-top-color:#4A2C8F;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.lb{position:fixed;inset:0;z-index:150;background:rgba(15,15,25,.92);display:none;place-items:center;padding:20px}
.lb.on{display:grid}
.lb .x{position:absolute;top:10px;right:18px;background:none;border:0;color:#fff;font-size:38px}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%}
.lb .pv{left:12px}.lb .nx{right:12px}
.lb figure{background:#F2F1E8;padding:12px 12px 14px;max-width:980px;text-align:center}
.lb img{max-width:100%;max-height:76vh;display:block;margin:auto}
.lb figcaption{font-family:'Pangolin',cursive;font-size:21px;color:#1F3A2E;margin-top:8px}
.lb figcaption small{display:block;font-family:'Be Vietnam Pro';font-size:13px;opacity:.7}
.tchieu{position:fixed;inset:0;z-index:160;background:#0B0B10;display:none;overflow:hidden;color:#fff;font-family:'Be Vietnam Pro';touch-action:pan-y;user-select:none}
.tchieu.on{display:block}.tchieu.an{cursor:none}
.tchieu .lop{position:absolute;inset:0;display:grid;place-items:center;padding:2vh 2vw;box-sizing:border-box;opacity:0;transition:opacity 1.2s ease}
.tchieu .lop.hien{opacity:1}
.tchieu .lop .nen{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.1)}
.tchieu .lop img{position:relative;max-width:96vw;max-height:96vh;max-height:96dvh;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 50px rgba(0,0,0,.6)}
.tchieu .lop.hien img{animation:tcKb var(--t,5s) linear forwards}
@keyframes tcKb{from{transform:scale(.93) translate(var(--x,0),var(--y,0))}to{transform:none}}
.tchieu .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 76px;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:center;transition:opacity .5s}

/* ===== CÁC LỚP · VỞ Ô LY ===== */

 background-color:#FBFBFE;background-image:linear-gradient(var(--ly) 1px,transparent 1px),linear-gradient(90deg,var(--ly) 1px,transparent 1px);background-size:32px 32px;padding:14px 32px 18px;min-height:0}
.p-cls h2{font-family:'Patrick Hand',cursive;font-weight:400;color:var(--muc);font-size:34px;line-height:1.05}
.p-cls .sub{color:var(--mo);margin:2px 0 12px}
.p-cls .search{max-width:520px;width:100%;border:1.5px solid var(--vien);border-radius:8px;padding:10px 13px;margin-bottom:18px;background:#fff}
.p-cls .top-cls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.p-cls .top-cls .nhoai{flex:1 1 520px;margin:0}.p-cls .top-cls .search{flex:0 1 400px;margin:0}
.p-cls .labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
@media(min-width:1100px){.p-cls .labels{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}}
.nhan{background:#fff;border:2px solid var(--muc);border-radius:18px;padding:10px 14px 8px;cursor:pointer;text-align:left;width:100%;color:inherit;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--c);transition:transform .15s}

.nhan .t{font-size:11px;color:var(--mo);text-align:center}

.nhan .ln{display:flex;gap:8px;font-size:13px;border-bottom:1.5px dotted var(--vien);padding:2px 0;min-width:0}
.nhan .ln span{color:var(--mo);flex:none}
.nhan .ln em{font-style:normal;font-family:'Patrick Hand',cursive;font-size:17px;color:var(--muc);line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhan .hit{font-size:13px;color:var(--phuong);margin-top:6px}
.p-cls .back{background:none;border:0;color:var(--muc);font-weight:600;margin-bottom:16px}
.p-cls .head{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
.p-cls .head .nhan{cursor:default}.p-cls .head .nhan:hover{transform:none}
.p-cls .head p{white-space:pre-line}
.p-cls .tabs{display:flex;gap:4px;border-bottom:2px solid var(--vien);margin:30px 0 18px;overflow-x:auto}
.p-cls .tabs button{background:none;border:0;padding:10px 16px;color:var(--mo);white-space:nowrap;margin-bottom:-2px;border-bottom:3px solid transparent}
.p-cls .tabs button.on{color:var(--muc);border-color:var(--muc);font-weight:600}
.roster{background:#fff;border:1.5px solid var(--vien);border-radius:10px;overflow:auto}
.roster table{width:100%;border-collapse:collapse}
.roster th{text-align:left;font-size:13px;color:var(--mo);font-weight:600;padding:10px 14px;background:var(--ly2)}
.roster td{padding:9px 14px;border-top:1px solid var(--ly)}
.roster td.n{font-family:'Patrick Hand',cursive;font-size:20px;color:var(--muc)}
.cv{font-size:12px;font-weight:600;color:var(--phuong);background:#FBE3E5;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-cls .mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p-cls .mini .ph{aspect-ratio:4/3;border:8px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
.p-cls .lb-note{font-family:'Patrick Hand';font-size:22px;color:var(--muc);margin-bottom:14px;white-space:pre-line}
.p-cls .lb-note small{font-family:'Be Vietnam Pro';font-size:13px;color:var(--mo)}

/* ===== NGOẠI KHOÁ · SÔNG HÀN ===== */
.p-ev{--toi:#0B2545;--troi:#E9F4FC;--cat:#F5E6C8;--nang:#FFB400;--mo:#5C6B80;color:var(--toi)}

.p-ev .hero .w{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;padding:44px 32px 200px}
.p-ev .nk{justify-self:end;width:100%;max-width:540px}
.p-ev .mt{position:absolute;right:20%;bottom:58px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#FFE08A,#FFB400 70%);opacity:.92;z-index:0;box-shadow:0 0 60px rgba(255,180,0,.45)}
.p-ev .ey{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#FFD25E;font-weight:700;margin-bottom:8px}
.p-ev .nam{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.p-ev .nam button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:7px 15px;font-weight:700;font-size:14px}
.p-ev .nam button:hover{background:rgba(255,255,255,.24)}
.p-ev .nk{background:rgba(11,37,69,.38);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px 18px 8px;box-shadow:0 18px 40px rgba(5,20,45,.25)}
.p-ev .nk h2{font-family:'Charm',cursive;font-weight:700;font-size:30px;line-height:1.1;color:#FFD25E;margin-bottom:4px}
.p-ev .nk button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px dashed rgba(255,255,255,.22);color:#fff;padding:9px 4px;border-radius:0}
.p-ev .nk button:first-of-type{border-top:0}
.p-ev .nk button:hover b{color:#FFD25E}
.p-ev .nk i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.p-ev .nk b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.p-ev .nk small{opacity:.75;font-size:12.5px}
.p-ev .year{scroll-margin-top:90px}
.p-ev .yr{white-space:nowrap;font-weight:900;font-size:clamp(52px,7vw,108px);line-height:.9;letter-spacing:-.04em;background:linear-gradient(180deg,#FFD25E,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.p-ev h1{font-weight:800;font-size:clamp(26px,3vw,42px);line-height:1.15;margin:14px 0 12px;max-width:20ch;text-wrap:balance}
.p-ev .hero p{max-width:52ch;opacity:.9;font-size:17px}
.p-ev svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px}
.p-ev .years{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:56px 32px 0}
.p-ev .year h3{font-weight:900;font-size:40px;letter-spacing:-.02em;line-height:1;color:var(--c)}
.p-ev .year .yy{color:var(--mo);font-size:14px;margin:4px 0 16px}
.p-ev .ev{background:var(--troi);border-radius:18px;overflow:hidden;margin-bottom:16px}
.p-ev .ev .ph{aspect-ratio:16/8;font-size:36px}
.p-ev .ev .ph i{position:absolute;left:12px;top:10px;font-style:normal;font-size:12.5px;font-weight:700;background:rgba(11,37,69,.6);padding:3px 10px;border-radius:99px;z-index:1}
.p-ev .ev .b{padding:14px 16px 16px}
.p-ev .ev b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.p-ev .ev p{font-size:14.5px;color:#3D4C61;margin-top:2px;white-space:pre-line}
.p-ev .ev button{margin-top:8px;background:none;border:0;color:#0E5BA8;font-weight:700;padding:0}
.p-ev .band{margin:56px 32px 70px;background:var(--cat);border-radius:22px;padding:40px;display:grid;grid-template-columns:1fr 2fr;gap:30px;align-items:center}
.p-ev .band h3{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.p-ev .band .n{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p-ev .band .n div{background:#fff;border-radius:14px;padding:16px}
.p-ev .band .n small{display:block;color:var(--mo);font-size:13px}
.p-ev .band .n button{margin-top:8px;border:0;background:var(--nang);color:var(--toi);font-weight:700;border-radius:99px;padding:6px 14px;font-size:13px}

/* ===== KỶ YẾU · ALBUM KRAFT ===== */
.p-yb{--kraft:#C9A27A;--giay:#FAF6EE;--nau:#4A3426;--do:#A33B2B;--mo:#7B6455;
 background:var(--kraft);color:var(--nau);padding:36px 32px 70px;min-height:80vh;
 background-image:radial-gradient(rgba(74,52,38,.10) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.p-yb .book{max-width:1180px;margin:auto;background:var(--giay);position:relative;box-shadow:0 20px 40px rgba(74,52,38,.25);padding:44px 52px 50px}
.p-yb .book:before{content:"";position:absolute;left:-14px;top:30px;bottom:30px;width:14px;background:repeating-linear-gradient(var(--nau) 0 10px,transparent 10px 22px);border-radius:3px 0 0 3px}
.p-yb h2{font-family:'Charm',cursive;font-size:clamp(46px,5.5vw,76px);font-weight:700;color:var(--do);line-height:1}
@media(max-width:760px){.p-yb h2.tyb{text-align:center;margin-bottom:10px}.p-yb h2.tyb .t1{display:block;font-size:min(68px,18vw);line-height:1.1;padding-bottom:.18em}.p-yb h2.tyb .t2{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px;font-family:'Be Vietnam Pro',sans-serif;font-size:min(15px,4vw);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--nau);white-space:nowrap}.p-yb h2.tyb .t2:before,.p-yb h2.tyb .t2:after{content:"";flex:0 1 38px;height:1.5px;background:currentColor;opacity:.55}.p-yb .book>.sub{text-align:center}}
.p-yb .sub{color:var(--mo);margin:6px 0 24px;max-width:62ch}
.p-yb .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.p-yb .tabs button{background:none;border:1.5px solid var(--nau);color:var(--nau);border-radius:3px;padding:7px 14px;font-weight:600;font-size:14px}
.p-yb .tabs button.on{background:var(--nau);color:var(--giay)}
.p-yb .teachers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:30px 20px}
.p-yb .tc{background:#fff;padding:10px 10px 12px;box-shadow:0 6px 14px rgba(74,52,38,.2);transform:rotate(var(--r));position:relative;text-align:center}
.p-yb .tc .ph{aspect-ratio:4/5;font-family:'Charm';font-size:56px}
.p-yb .tc b{display:block;font-family:'Patrick Hand';font-weight:400;font-size:21px;line-height:1.15;margin-top:6px}
.p-yb .tc small{font-size:12.5px;color:var(--mo)}
.corner{position:absolute;width:26px;height:26px;background:var(--nau);clip-path:polygon(0 0,100% 0,0 100%);z-index:2}
.corner.tl{left:-5px;top:-5px}.corner.br{right:-5px;bottom:-5px;transform:rotate(180deg)}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(250,246,238,.85);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.p-yb .notes{columns:300px;column-gap:26px}
.p-yb .notes .ticket{break-inside:avoid;display:inline-block;width:100%;box-sizing:border-box;margin:0 0 26px;padding:30px 22px 16px 22px}
.p-yb .notes .ticket:before{content:'“';position:absolute;left:12px;top:-6px;font:700 64px/1 'Playfair Display',serif;color:#C9A24A;opacity:.55}
.p-yb .notes .ticket .nd{max-height:calc(1.35em * 11);overflow:hidden;position:relative;transition:max-height .4s ease}
.p-yb .notes .ticket.dai:not(.mo) .nd:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(rgba(255,255,255,0),#fff)}
.p-yb .notes .ticket.mo .nd{max-height:none}
.p-yb .notes .ticket .nd p{margin:0}.p-yb .notes .ticket .nd p+p{margin-top:.55em}
.p-yb .notes .ticket .xem{display:none;margin-top:6px;background:none;border:0;padding:4px 0;font:700 13.5px 'Be Vietnam Pro';color:#8A3B2E;cursor:pointer}
.p-yb .notes .ticket.dai .xem{display:inline-block}
.p-yb .notes .ticket small{text-align:right;border-top:1px dashed #E2CDB3;padding-top:8px;margin-top:10px}
.p-yb .notes .ticket small b{font-weight:700;color:#5B4636}
.p-yb .ticket{border:1.5px dashed #B98F64;background:#fff;padding:18px 20px;font-family:'Patrick Hand';font-size:22px;line-height:1.35;position:relative;white-space:pre-line;word-break:break-word}
.p-yb .ticket small{display:block;font-family:'Be Vietnam Pro';font-size:13px;color:var(--mo);margin-top:8px;white-space:normal}
.p-yb .pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:34px}
.p-yb .pair h4{font-family:'Charm';font-weight:700;font-size:34px;color:var(--do);line-height:1;margin-bottom:12px}
.p-yb .pair .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.p-yb .pair figure{background:#fff;padding:8px 8px 10px;box-shadow:0 6px 14px rgba(74,52,38,.2);cursor:pointer}
.p-yb .pair figure:first-child{transform:rotate(-2deg)}.p-yb .pair figure:last-child{transform:rotate(2deg)}
.p-yb .pair .ph{aspect-ratio:1;font-size:34px}
.p-yb .pair figcaption{font-family:'Patrick Hand';font-size:19px;text-align:center}
.p-yb .write{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.p-yb label{display:block;font-size:14px;color:var(--mo);margin:12px 0 5px}
.p-yb input,.p-yb select,.p-yb textarea{width:100%;border:1.5px solid #D9C4A8;background:#fff;border-radius:3px;padding:10px 12px;color:var(--nau)}
.p-yb .btn{background:var(--nau);color:var(--giay);border:0;padding:11px 20px;border-radius:3px;font-weight:600;margin-top:14px}
.p-yb .pv{transform:rotate(1deg);min-height:220px}

/* ===== HÌNH ẢNH · BẢNG ĐEN ===== */
.p-gal{--bang:#1F3A2E;--phan:#F2F1E8;--vang:#F6D86B;
 background:var(--bang);color:var(--phan);font-family:'Pangolin',cursive;padding:40px 32px 70px;min-height:80vh;
 background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.06),transparent 50%),radial-gradient(ellipse at 80% 60%,rgba(255,255,255,.05),transparent 45%)}
.p-gal h2{font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1}
.p-gal .sub{font-family:'Be Vietnam Pro';opacity:.8;margin:8px 0 24px;max-width:60ch}
.p-gal .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.p-gal .chips button{background:none;border:2px solid rgba(242,241,232,.5);color:var(--phan);border-radius:10px 14px 9px 13px;padding:5px 14px;font-family:'Pangolin';font-size:18px}
.p-gal .chips button.on{border-color:var(--vang);color:var(--vang)}
.p-gal .chips.al button{font-size:16px;padding:3px 12px;border-style:dashed}

.p-gal .magnet{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--m);box-shadow:0 2px 3px rgba(0,0,0,.4);z-index:2}

/* ===== KẾT NỐI · BÁO TƯỜNG ===== */
.p-kn{--do:#D7261E;--vang:#FFD23F;--xanh:#1B4D9B;--giay:#FFFDF6;--den:#141414;background:#ECE7DA;color:var(--den);font-family:'Noto Serif',serif;padding-bottom:70px}
.p-kn .mast{background:var(--do);color:#fff;padding:22px 32px 18px;position:relative;overflow:hidden}
.p-kn .mast:after{content:"";position:absolute;right:30px;top:50%;width:110px;height:110px;margin-top:-55px;background:var(--vang);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.p-kn .mast .top{display:flex;justify-content:space-between;font-family:'Be Vietnam Pro';font-size:13px;opacity:.9;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:8px;max-width:calc(100% - 150px);gap:12px}

.p-kn .board{display:grid;grid-template-columns:repeat(12,1fr);gap:22px;padding:30px 32px 0}
.p-kn .card{background:var(--giay);padding:22px;box-shadow:2px 3px 0 rgba(0,0,0,.18);position:relative}
.p-kn .pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--do);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.p-kn h3{font-family:'Anton';font-weight:400;font-size:28px;line-height:1.05;margin-bottom:10px}
.p-kn .lead{grid-column:span 7;transform:rotate(-.4deg)}

.p-kn .facts b{display:block;font-family:'Anton';font-weight:400;font-size:24px}
.p-kn .reg{grid-column:span 5;background:var(--vang)!important;transform:rotate(.7deg)}
.p-kn label{display:block;font-family:'Be Vietnam Pro';font-size:13px;margin:10px 0 4px;font-weight:600}

.p-kn .res div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #bbb;padding:7px 0}
.p-kn .res b{font-family:'Noto Serif'}
.p-kn .where{grid-column:span 5;background:var(--xanh)!important;color:#fff;transform:rotate(-.6deg)}
.p-kn .bars div{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-family:'Be Vietnam Pro';font-size:14px;margin:7px 0}
.p-kn .bars i{display:block;height:12px;background:var(--vang)}

.thu .nut{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:linear-gradient(transparent,#FFFDF8 30%);padding:18px 0 18px;margin-top:6px}
.thu .nut label{font-size:13.5px;color:#7A747A;display:flex;gap:6px;align-items:center}
.thu .nut .bt{display:flex;gap:8px;flex-wrap:wrap}

const KH_MAC_DINH="# Mục đích\nTổ chức buổi gặp mặt cựu học sinh niên khóa 2000–2003 nhằm tạo dịp hội ngộ sau nhiều năm xa cách, cùng ôn lại kỷ niệm dưới mái trường Nguyễn Hiền, tri ân thầy cô và thắt chặt tình bạn, tình thầy trò.\n# Ý nghĩa\nGala là dịp để 12 tập thể lớp cùng kết nối, sẻ chia và vun đắp tình cảm của đại gia đình Nguyễn Hiền; lan tỏa truyền thống “Tôn sư trọng đạo – Gắn kết bạn bè – Hướng về mái trường xưa”, đồng thời chung tay đóng góp những giá trị tốt đẹp cho nhà trường và các thế hệ học sinh tiếp nối.\n# Thời gian – Địa điểm\n= Thời gian: {gio}, {ngay}\n= Địa điểm: {nhaHang} · {diaChi}\n= Hình thức: Gala gặp mặt, tri ân thầy cô và giao lưu cựu học sinh.\n# Thành phần tham dự\n- Toàn thể 12 thầy cô giáo chủ nhiệm các lớp 12, niên khóa 2000–2003.\n- Các thầy cô bộ môn do các lớp đề xuất và trân trọng mời tham dự.\n- Đại diện Ban Giám hiệu Trường Nguyễn Hiền.\n- Toàn thể cựu học sinh khối 12, niên khóa 2000–2003 thuộc 12 lớp.\n# Nội dung chương trình\n## Phần 1 | Lễ gặp mặt và tri ân\n- Tuyên bố lý do, giới thiệu đại biểu và thành phần tham dự.\n- Trình chiếu slide, ôn lại hành trình và những kỷ niệm đáng nhớ của niên khóa 2000–2003.\n- Tặng hoa, quà tri ân 12 thầy cô giáo chủ nhiệm. Các lớp có nhu cầu tặng quà riêng đăng ký trước với Ban Tổ chức để phối hợp thực hiện.\n- Phát biểu giao lưu, chia sẻ cảm xúc và chụp ảnh lưu niệm.\n## Phần 2 | Gala giao lưu – Kết nối\n- Dùng tiệc, giao lưu và kết nối các thành viên của 12 lớp.\n- Giao lưu văn nghệ, chia sẻ kỷ niệm và những câu chuyện sau ngày rời ghế nhà trường.\n- Tổ chức mini game có thưởng, tạo không khí vui tươi, gần gũi.\n- Bốc thăm trúng thưởng (nếu nguồn kinh phí chung cho phép).\n- Giao lưu tự do, chụp ảnh tập thể và khép lại chương trình trong không khí thân tình, đoàn kết.\n# Các công việc cần chuẩn bị\n+ Thành lập Ban Tổ chức: Mỗi lớp cử đầu mối chủ chốt tham gia phối hợp tổ chức và triển khai công việc.\n+ Kết nối 12 lớp: Tập hợp danh sách đầu mối, xây dựng nhóm liên lạc chung của niên khóa.\n+ Mời thầy cô: Tổng hợp danh sách 12 giáo viên chủ nhiệm, các thầy cô bộ môn và đại diện Ban Giám hiệu.\n+ Thu thập hình ảnh: Các lớp gửi ảnh tập thể, ảnh thầy cô và những khoảnh khắc đáng nhớ cho Ban Tổ chức hoặc qua ứng dụng chung của niên khóa để xây dựng slide kỷ niệm.\n+ Chốt danh sách và thu kinh phí: Hạn cuối ngày {han} để tổng hợp số lượng, đặt nhà hàng và chủ động công tác hậu cần.\n+ Đặt áo và quà lưu niệm: Thống nhất mẫu áo, số lượng, hoa và quà tri ân thầy cô.\n+ Chuẩn bị ghi hình: Liên hệ đơn vị chụp ảnh, quay phim trong đêm Gala.\n+ Xây dựng kịch bản: Hoàn thiện nội dung chương trình, phân công MC, phụ trách văn nghệ, trò chơi, hậu cần, tài chính và đón tiếp thầy cô.\n# Kinh phí dự kiến\nMức đóng góp dự kiến: **700.000 đồng/người**\n| Nội dung | Dự kiến/người\n| Áo kỷ niệm | 110.000 đồng\n| Suất ăn và nước uống | 300.000 đồng\n| Hoa, quà tri ân thầy cô | Từ phần còn lại\n| Chụp ảnh, quay phim | Từ phần còn lại\n| Quà tặng nhà trường nhân dịp kỷ niệm 30 năm | Từ phần còn lại\n| Quà trò chơi và chi phí tổ chức khác | Từ phần còn lại\n| Tổng dự kiến | 700.000 đồng\n! **Lưu ý về dự toán:** Sau khi trừ tiền áo và suất ăn, phần kinh phí còn lại là 290.000 đồng/người, dùng để chi cho các nội dung còn lại nêu trên. Ban Tổ chức sẽ thống nhất phương án phân bổ theo báo giá thực tế và khả năng đóng góp chung.\n! Toàn bộ khoản thu – chi sẽ được Ban Tổ chức tổng hợp, công khai minh bạch. Nếu kinh phí thực tế thiếu, Ban Tổ chức sẽ thông báo cụ thể để tập thể cùng trao đổi, thống nhất phương án bổ sung; nếu còn dư, sẽ công khai phương án sử dụng phần kinh phí còn lại.\n# Tổ chức thực hiện\nBan Tổ chức chịu trách nhiệm điều phối chung, xây dựng kế hoạch, quản lý kinh phí và triển khai các hoạt động. Các đầu mối 12 lớp phối hợp truyền thông, vận động bạn bè tham dự, thu thập hình ảnh, tổng hợp danh sách và kết nối các thành viên.\nMỗi cựu học sinh là một cầu nối góp phần tạo nên sự thành công của chương trình. Rất mong nhận được sự đồng hành, chia sẻ và chung tay của tất cả các lớp để đêm Gala diễn ra ấm áp, chu đáo và ý nghĩa.\n# Thông điệp Gala\n> Hai mươi ba năm – Một mái trường – / Mười hai tập thể – Một đại gia đình\nThời gian có thể đưa mỗi người đến những hành trình riêng, nhưng tình bạn, tình thầy trò và ký ức dưới mái trường Nguyễn Hiền vẫn luôn là sợi dây gắn kết chúng ta. Gala gặp mặt là dịp để cùng trở về, gặp lại thầy cô, tìm lại bạn bè và viết tiếp những kỷ niệm đẹp của niên khóa 2000–2003.\n**Trân trọng kính mời toàn thể thầy cô và các bạn cựu học sinh cùng tham gia, chung tay để ngày hội ngộ trở thành dấu ấn đáng nhớ trong hành trình trưởng thành của mỗi chúng ta!**\n# Đóng góp kinh phí\nMức đóng góp dự kiến **{dongGop}/người**, xác nhận và đóng góp trước **{han}** qua admin lớp hoặc chuyển khoản cho thủ quỹ.\n= Thủ quỹ: {thuQuy} · {nganHang} {soTK} ({chuTK})\n= Nội dung chuyển khoản: {cuPhap}\n@CK";
const THU0=JSON.parse(JSON.stringify(THU)),GM0=JSON.parse(JSON.stringify(GM));

function khInline(x){return esc(x).replace(/\{(\w+)\}/g,(m,k)=>k in GM?esc(GM[k]):m).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function khSo(v){const d=String(v).replace(/[^\d]/g,'');return /\d/.test(v)&&!/còn lại/i.test(v)?Number(d):null}
function khDung(txt){const secs=[];let sc=null,bk=null;const moi=(type,o)=>{bk=Object.assign({type,items:[]},o||{});(sc||(sc={title:'',bl:[]},secs.push(sc),sc)).bl.push(bk);return bk};
 String(txt||'').split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t)return;let m;
  if(m=t.match(/^#\s+(.*)/)&&!/^##/.test(t)){sc={title:t.replace(/^#\s+/,''),bl:[]};secs.push(sc);bk=null;return}
  if(/^##\s+/.test(t)){const p=t.replace(/^##\s+/,'').split('|');moi('phan',{so:p.length>1?p[0].trim():'',ten:(p.length>1?p.slice(1).join('|'):p[0]).trim()});return}
  const tag=t[0],rest=t.slice(1).trim();
  if(tag==='-'&&t[1]===' '){if(!bk||(bk.type!=='list'&&bk.type!=='phan'))moi('list');bk.items.push(rest);return}
  if(tag==='+'){if(!bk||bk.type!=='viec')moi('viec');const i=rest.indexOf(':');bk.items.push(i>0?[rest.slice(0,i),rest.slice(i+1).trim()]:[rest,'']);return}
  if(tag==='='){if(!bk||bk.type!=='dl')moi('dl');const i=rest.indexOf(':');bk.items.push(i>0?[rest.slice(0,i),rest.slice(i+1).trim()]:['',rest]);return}
  if(tag==='|'){if(!bk||bk.type!=='bang')moi('bang');bk.items.push(rest.split('|').map(x=>x.trim()));return}
  if(t==='@CK'){moi('ck');return}
  if(tag==='!'){moi('nho').items.push(rest);return}
  if(tag==='>'){moi('cau').items.push(rest);return}
  moi('p').items.push(t)});
 return secs}

   return bar+`<table>${dau?`<thead><tr>${dau.map(x=>`<th>${khInline(x)}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(r=>`<tr class="${r===tong?'tong':''}">${r.map(x=>`<td>${khInline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  return ''};
 let n=0;const html=secs.map(sc=>{const id=sc.title?'khm'+(n++):'';const cau=sc.bl.some(b=>b.type==='cau');return `<section ${id?`id="${id}"`:''} class="${cau?'kh-td':''}">${sc.title?`<h3><i>${LA[n-1]||n}</i>${khInline(sc.title)}</h3>`:''}${sc.bl.map(bl).join('')}</section>`}).join('');
 const muc=secs.filter(s=>s.title).map((s,i)=>`<button onclick="document.getElementById('khm${i}').scrollIntoView({behavior:'smooth',block:'start'})">${khInline(s.title)}</button>`).join('');

function chuanTim(v){return khongDau(v).toLowerCase().replace(/[^a-z0-9/ ]+/g,' ').replace(/\s+/g,' ').trim()}
function khopTim(q,t){const a=chuanTim(q).split(' ').filter(Boolean),h=' '+chuanTim(t)+' ';return a.length>0&&a.every(w=>h.includes(w))}
function chuHs(s,c){return Object.keys(s).filter(k=>!/^(id|lopId|thuTu)$/.test(k)).map(k=>s[k]).concat(c?['lop '+c.ten,'12/'+String(c.ten).replace(/^12[/]/,'')]:[]).join(' ')}
function soTKDep(v){const d=String(v||'').replace(/\D/g,'');return d.replace(/(\d{4})(\d{4})(\d+)/,'$1 $2 $3')}
function ndCK(ten,lop){const sau=(String(GM.cuPhap).split(':').slice(1).join(':').trim())||'tham gia gala';return (khongDau(ten)||'Ten')+' '+(lop?'12/'+String(lop).replace(/^12[/]/,''):'Lop')+' : '+sau}

 const evs=D.hoatDong.slice().sort((a,b)=>dk(a.ngay)-dk(b.ngay));const after=evs.filter(e=>yearOf(e.namHoc)<0);window.EVS=evs;
 const card=(e,k)=>{const j=evs.indexOf(e);return `<article class="ev"><div class="ph" style="background:${grad(k+j)}">${e.anhId?img(e.anhId,700):esc(e.icon||'🎪')}${e.ngay?`<i>${esc(e.ngay)}</i>`:''}</div><div class="b"><b>${esc(e.tieuDe)}</b>${e.moTa?`<p>${esc(e.moTa)}</p>`:''}${evAlbum(e)?`<button onclick="gF='';gA=EVS[${j}].tieuDe;go('gallery')">Xem ảnh hoạt động</button>`:''}</div></article>`};

  <div class="nam">${['Lớp 10','Lớp 11','Lớp 12'].map((t,k)=>`<button onclick="${toiNam(k)}">${t}</button>`).join('')}</div></div>
  ${trong.length?`<div class="nk"><h2>Nhật ký ngoại khoá</h2>${trong.slice(0,7).map(e=>`<button onclick="${toiNam(yearOf(e.namHoc))}"><i aria-hidden="true">${esc(e.icon||'🎪')}</i><span><b>${esc(e.tieuDe)}</b><small>${esc(e.ngay)}${e.namHoc?' · '+esc(e.namHoc):''}</small></span></button>`).join('')}</div>`:''}</div>

 <div class="years">${Y.map((y,k)=>{const l=evs.filter(e=>yearOf(e.namHoc)===k);return `<div class="year" id="nam${k}" style="--c:${y[2]}"><h3>${y[0]}</h3><div class="yy">${y[1]}</div><p class="cam">${y[3]}</p>${l.length?l.map(e=>card(e,k*2)).join(''):'<p class="empty" style="color:#5C6B80">Chưa có hoạt động.</p>'}</div>`}).join('')}</div>
 <div class="loi"><p>“Hồi đó cứ nghĩ ngày mai còn dài lắm. Đâu biết có những đêm lửa trại, những buổi tập văn nghệ dưới mưa, cả đời chỉ đến một lần.”</p><small>${evs.length} hoạt động · ba mùa phượng · một thời áo trắng</small></div>
 <div class="band"><h3>Sau ra trường</h3><div class="n">${after.map(e=>{const j=evs.indexOf(e);return `<div><b>${esc(e.tieuDe)}</b><small>${esc(e.ngay)}${e.moTa?', '+esc(String(e.moTa).slice(0,80)):''}</small>${evAlbum(e)?`<button onclick="gF='';gA=EVS[${j}].tieuDe;go('gallery')">Xem ảnh</button>`:''}</div>`}).join('')}
  <div><b>${lead?esc(lead.tieuDe):'Họp lớp sắp tới'}</b><small>${lead&&lead.ngay?esc(lead.ngay):'Theo dõi trang Kết nối'}</small><button onclick="go('connect')">Đăng ký</button></div></div></div>`}

/* ===================== KỶ YẾU ===================== */
let ybT=1,wLop='';
function goiY(){return ['Nhớ nhất là…','Cảm ơn…','Xin lỗi vì ngày ấy…','Nếu được quay lại năm '+(D.cfg.namRaTruong||'2003')+'…','Gửi tôi năm 18 tuổi…','Hẹn gặp lại ở…']}

/* Kỷ yếu → Lưu bút: xếp kiểu gạch (cột), bài dài thu gọn ~11 dòng + nút Đọc tiếp */

function renderYb(){const T=['Thầy cô','Lưu bút','Ngày ấy, bây giờ','Viết lưu bút'];let h='';const ny=new Date().getFullYear()-(Number(D.cfg.namRaTruong)||2003);
 const INTRO=['Những người đưa đò năm ấy. Có thầy cô giờ tóc đã bạc, có thầy cô đã đi xa. Một lời cảm ơn, muộn mấy cũng không thừa.','Ngày xưa viết vào sổ rồi chuyền tay, chưa kịp đi hết lớp thì đã ra trường. Giờ viết ở đây, để mấy chục năm nữa vẫn còn đọc lại được.','Cùng một lớp, cách nhau '+(ny>0?ny+' năm':'nhiều năm')+'. Tóc có thể khác, dáng có thể khác, nụ cười thì vẫn vậy.','Viết cho bạn bè, cho thầy cô, hay cho chính mình năm mười tám tuổi. Không cần hay, chỉ cần thật.'];
 if(ybT===0)h=D.thayCo.length?`<div class="teachers">${D.thayCo.map((t,i)=>`<figure class="tc" style="--r:${[-2,1.5,-1,2,-1.5,1][i%6]}deg"><span class="corner tl"></span><span class="corner br"></span><div class="ph" style="background:${grad(i)}">${esc(ini(t.hoTen))}${t.anhId?img(t.anhId,400):''}</div><b>${esc(t.hoTen)}</b><small>${esc(t.vaiTro)}</small></figure>`).join('')}</div>`:'<p class="empty">Ban liên lạc chưa cập nhật danh sách thầy cô.</p>';
 if(ybT===1)h=D.luuBut.length?`<div class="notes">${D.luuBut.map(n=>`<div class="ticket"><span class="tape"></span><div class="nd">${String(n.noiDung||'').trim().split(/\n\s*\n+/).map(d=>`<p>${esc(d.trim())}</p>`).join('')}</div><button class="xem" onclick="moLb(this)">Đọc tiếp ▾</button><small>— <b>${esc(n.tacGia)}</b>${n.lopId?', lớp '+esc(lopName(n.lopId)):', gửi cả khoá'}</small></div>`).join('')}</div>`:'<p class="empty">Chưa có lưu bút nào. Hãy là người viết đầu tiên.</p>';
 if(ybT===2){const rows=D.lop.map((c,i)=>{const t=D.anh.find(a=>a.lopId===c.id&&a.album==='Ngày ấy'),b=D.anh.find(a=>a.lopId===c.id&&a.album==='Bây giờ');if(!t&&!b)return '';
   const f=(p,ic,cap,k)=>`<figure ${p?`onclick="openLb([D.anh.find(a=>a.id==='${p.id}')],0)"`:''}><div class="ph" style="background:${grad(i+k)}">${p&&p.fileId?img(p.fileId,500):ic}</div><figcaption>${cap}</figcaption></figure>`;
   return `<div class="pair"><h4>Lớp ${esc(c.ten)}</h4><div class="two">${f(t,'🎓','Ngày ấy, '+esc(D.cfg.namRaTruong||''),0)}${f(b,'🥂','Bây giờ',3)}</div></div>`}).join('');
  h=rows?`<div class="pairs">${rows}</div>`:'<p class="empty">Admin lớp tải ảnh vào album “Ngày ấy” và “Bây giờ” để hiện ở đây.</p>'}
 if(ybT===3)h=`<div class="write"><div><label for="w1">Tên bạn</label><input id="w1" maxlength="60" placeholder="Ví dụ: Nguyễn Văn Hải" oninput="pv()"><label for="w2">Gửi cho</label><select id="w2" onchange="pv()"><option value="">Cả khoá</option>${D.lop.map(c=>`<option value="${c.id}" ${c.id===wLop?'selected':''}>Lớp ${esc(c.ten)}</option>`).join('')}</select><label for="w3">Lời lưu bút</label><textarea id="w3" rows="6" maxlength="1500" placeholder="Viết cho bạn bè, thầy cô, hay cho chính mình năm 18 tuổi" oninput="pv()"></textarea><div class="goiy" aria-label="Gợi ý mở đầu">${goiY().map((g,k)=>`<button type="button" onclick="themGoiY(${k})">${esc(g)}</button>`).join('')}</div>
  <button class="btn" onclick="sendNote()">Gửi lưu bút</button><p style="font-size:13px;color:#7B6455;margin-top:8px">Lưu bút gửi lớp do admin lớp duyệt, gửi cả khoá do Ban liên lạc duyệt.</p></div>
  <div><p style="font-size:13px;color:#7B6455;margin-bottom:10px">Xem trước trang lưu bút</p><div class="ticket pv" id="pvN"></div></div></div>`;
 $('v-yearbook').innerHTML=`<div class="book"><h2 class="tyb"><span class="t1">Kỷ yếu</span> <span class="t2">khoá ${esc(D.cfg.nienKhoa)}</span></h2><p class="sub">Cuốn album chung của cả khoá: thầy cô, lưu bút, ảnh ngày ấy và bây giờ.</p>
  <div class="tabs">${[1,0,2,3].map(i=>`<button class="${i===ybT?'on':''}" onclick="ybT=${i};renderYb()">${T[i]}</button>`).join('')}</div><p class="intro">${INTRO[ybT]}</p>${ybT===3&&VIET?'<p class="viet-gala">📱 Bạn đang viết lưu bút cho buổi Gala. Gửi xong, lời của bạn sẽ hiện trên màn hình lớn.</p>':''}${ybT<2&&(D.luuBut.length||D.thayCo.length)?`<button class="tcBtn" onclick="tcMoi(()=>tcMoKy())">▶ Trình chiếu kỷ yếu: lưu bút & thầy cô</button>`:''}${h}</div>`;if(ybT===3)pv();if(ybT===1)gonLb()}
function pv(){const s=$('w2');$('pvN').innerHTML=`<span class="tape"></span>${esc($('w3').value.trim()||'Viết gì đó đi, trang album đang chờ…')}<small>${esc($('w1').value.trim()||'Tên bạn')}, gửi ${esc(s.options[s.selectedIndex].text.toLowerCase())}</small>`}
async function sendNote(){const t=$('w1').value.trim(),l=$('w2').value,n=$('w3').value.trim();if(!t||!n)return toast('Vui lòng nhập tên và lời lưu bút',1);
 try{busy(1,'Đang gửi…');const tt=await api('submitNote',t,l,n);$('w3').value='';pv();toast(tt==='approved'?'Đã gửi! Lời lưu bút của bạn sẽ hiện trên màn hình lớn trong ít phút.':'Cảm ơn bạn đã viết tiếp trang lưu bút. Lời bạn sẽ hiện sau khi được duyệt.')}catch(e){err(e)}finally{busy(0)}}

 <p class="phan">Còn tấm ảnh cũ nào nằm trong hộc tủ?<small>Chụp lại gửi admin lớp, để bảng này có thêm một gương mặt thân quen.</small></p>`}

function contactLink(v){v=String(v||'').trim();if(!v)return '';if(/@/.test(v))return 'mailto:'+v;if(/^https?:[/][/]/i.test(v))return v;const d=v.replace(/[^\d+]/g,'');if(d.length>=9)return 'https:\/\/zalo.me/'+d.replace(/^\+84/,'0');return ''}

 const nLop=Object.keys(D.dangKy.theoLop||{}).length,yrs=new Date().getFullYear()-(Number(c.namRaTruong)||2003);

  return (S&&lac&&!l.lac?`<div class="nt" style="border-color:#F0B429;background:#FFF8E6"><b>Có ${lac} học sinh chưa thuộc lớp nào</b> (mã lớp trong Sheet không khớp lớp nào). <button class="btn2 sm" onclick="adLop='_lac';renderAdmin()">Xem và chuyển về đúng lớp</button></div>`:'')+lopSelect()+
  ph3(l.lac?`Học sinh chưa thuộc lớp nào (${l.hs.length})`:`Học sinh lớp ${esc(l.ten)} (${l.hs.length})`,l.lac?'':`<button class="btn2 sm" onclick="fStudent()">Thêm học sinh</button><button class="btn2 o sm" onclick="fImport()">Dán từ Excel</button>`)+
  (l.hs.length&&S?`<div class="form" style="max-width:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><span class="who">Chuyển các bạn đã tick sang</span><select id="mvTo" style="max-width:180px">${A.lop.filter(x=>x.id!==l.id).map(x=>`<option value="${x.id}">Lớp ${esc(x.ten)}</option>`).join('')}</select><button class="btn2 sm" onclick="moveHs()">Chuyển lớp</button></div>`:'')+
  (l.hs.length?`<div class="tw"><table><thead><tr>${S?'<th><input type="checkbox" aria-label="Chọn tất cả" onchange="document.querySelectorAll(\'.hsChk\').forEach(c=>c.checked=this.checked)"></th>':''}<th>STT</th><th>Họ tên</th><th>${l.lac?'Mã lớp đang ghi':'Chức vụ'}</th><th class="hide-m">Hiện ở</th><th class="hide-m">Điện thoại</th><th></th></tr></thead><tbody>${l.hs.map((s,k)=>`<tr>${S?`<td><input type="checkbox" class="hsChk" value="${esc(s.id)}" aria-label="Chọn ${esc(s.hoTen)}"></td>`:''}<td class="who">${esc(s.thuTu||k+1)}</td><td>${esc(s.hoTen)}</td><td>${l.lac?`<code>${esc(s.lopId||'(trống)')}</code>`:s.chucVu?`<span class="pill blue">${esc(s.chucVu)}</span>`:''}</td><td class="hide-m">${esc(s.hienO)}</td><td class="hide-m who" style="white-space:nowrap">${esc(s.sdt||'')}</td><td class="r">${l.lac?'':`<button class="btn2 o sm" onclick="fStudent('${s.id}')">Sửa</button> `}<button class="btn2 red sm" onclick="act(()=>api('deleteStudent',TOK,'${s.id}'),'Xoá học sinh này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có học sinh. Có thể dán nhanh cả danh sách từ Excel.</p>')},

 'Hoạt động':()=>{const pend=A.hoatDong.filter(e=>e.trangThai==='pending'),rest=A.hoatDong.filter(e=>e.trangThai!=='pending').sort((a,b)=>dk(a.ngay)-dk(b.ngay));
  return ph3('Hoạt động ngoại khoá',`<button class="btn2 sm" onclick="fEvent()">Thêm hoạt động</button>`)+
  (pend.length?`<p class="who" style="margin-bottom:8px">Đề xuất từ các lớp</p>${pend.map(e=>`<div class="nt"><p>${esc(e.tieuDe)}</p><div class="who">${esc(e.ngay)} ${e.namHoc?'· '+esc(e.namHoc):''} · lớp ${esc(lopName(e.lopDeXuat))}</div><div class="f"><span>${esc(e.moTa)}</span><span><button class="btn2 sm" onclick="act(()=>api('setEventStatus',TOK,'${e.id}','published'),'','Đã đăng')">Đăng lên trang</button> <button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Từ chối và xoá đề xuất này?','Đã xoá')">Từ chối</button></span></div></div>`).join('')}`:'')+
  (rest.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Thời gian</th><th>Hoạt động</th><th class="hide-m">Năm học</th><th></th></tr></thead><tbody>${rest.map(e=>`<tr><td class="who" style="white-space:nowrap">${esc(e.ngay)}</td><td>${esc(e.icon||'')} ${esc(e.tieuDe)} ${e.trangThai==='hidden'?st('hidden'):''}</td><td class="hide-m who">${esc(e.namHoc)}</td><td class="r"><button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 o sm" onclick="act(()=>api('setEventStatus',TOK,'${e.id}','${e.trangThai==='hidden'?'published':'hidden'}'),'','Đã cập nhật')">${e.trangThai==='hidden'?'Hiện':'Ẩn'}</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Xoá hoạt động này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có hoạt động. Năm học ghi “2000–2001”, “2001–2002”, “2002–2003” sẽ vào cột Lớp 10, 11, 12; ghi khác sẽ vào mục Sau ra trường.</p>')},

 'Đề xuất hoạt động':()=>ph3('Đề xuất hoạt động',`<button class="btn2 sm" onclick="fEvent()">Gửi đề xuất mới</button>`)+`<p class="who" style="margin-bottom:12px">Ban liên lạc duyệt xong mới đăng lên trang Ngoại khoá.</p>`+
  (A.hoatDong.length?`<table><tbody>${A.hoatDong.map(e=>`<tr><td><b>${esc(e.tieuDe)}</b><div class="who">${esc(e.ngay)}</div></td><td>${st(e.trangThai)}</td><td class="r">${e.trangThai==='pending'?`<button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Xoá đề xuất này?','Đã xoá')">Xoá</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="who">Lớp chưa đề xuất hoạt động nào.</p>'),

 'Thầy cô':()=>ph3('Thầy cô',`<button class="btn2 sm" onclick="fTeacher()">Thêm thầy cô</button>`)+
  (A.thayCo.length?`<div class="tw"><table><tbody>${A.thayCo.map(t=>`<tr><td>${esc(t.hoTen)}</td><td class="who">${esc(t.vaiTro)}</td><td class="who">${t.anhId?'Có ảnh':''}</td><td class="r"><button class="btn2 o sm" onclick="fTeacher('${t.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteTeacher',TOK,'${t.id}'),'Xoá thầy cô này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có thầy cô.</p>'),

 'Lưu bút':()=>{const c=s=>A.luuBut.filter(x=>x.trangThai===s).length,l=A.luuBut.filter(x=>x.trangThai===nbF);
  return `<h3>${isS()?'Lưu bút gửi cả khoá và các lớp':'Lưu bút gửi lớp '+esc(lopName(A.me.lopId))}</h3><div class="chips">${[['pending','Chờ duyệt'],['approved','Đã đăng'],['hidden','Đã ẩn']].map(([k,t])=>`<button class="${nbF===k?'on':''}" onclick="nbF='${k}';renderAdmin()">${t} (${c(k)})</button>`).join('')}</div>`+
  (l.length?l.map(n=>`<div class="nt"><p>“${esc(n.noiDung)}”</p><div class="f"><span class="who">${esc(n.tacGia)} · ${n.lopId?'lớp '+esc(lopName(n.lopId)):'gửi cả khoá'} · ${esc(n.taoLuc)}</span><span>${n.trangThai!=='approved'?`<button class="btn2 sm" onclick="act(()=>api('moderateNote',TOK,'${n.id}','approved'),'','Đã duyệt')">Duyệt</button> `:''}${n.trangThai!=='hidden'?`<button class="btn2 o sm" onclick="act(()=>api('moderateNote',TOK,'${n.id}','hidden'),'','Đã ẩn')">Ẩn</button> `:''}<button class="btn2 red sm" onclick="act(()=>api('deleteNote',TOK,'${n.id}'),'Xoá hẳn lưu bút này?','Đã xoá')">Xoá</button></span></div></div>`).join(''):'<p class="who">Không có lưu bút nào.</p>')},

 'Hình ảnh':()=>{const s=isS();const list=s&&apF?A.anh.filter(a=>apF==='_'?!a.lopId:a.lopId===apF):A.anh;window.APL=list;
  return `${s?`<div class="dbo"><div><h3 style="margin:0 0 4px">Ảnh từ thư mục Drive</h3><p class="who">Trong thư mục <b>ANH</b> trên Drive, mỗi lớp một thư mục tên là lớp (<b>12-1</b> … <b>12-12</b>), ảnh không thuộc lớp nào bỏ vào thư mục <b>Chung</b>, ảnh thầy cô bỏ vào <b>GVCN</b> (đặt tên có số lớp, ví dụ <b>12-4.jpg</b>). Bỏ ảnh vào rồi bấm nút; ảnh xoá khỏi thư mục cũng tự gỡ khỏi trang. Tên tệp có chữ “ngày ấy” / “bây giờ” sẽ vào mục Ngày ấy, bây giờ của Kỷ yếu.</p></div><button class="btn2" onclick="dongBoAnh()">Đồng bộ ảnh từ Drive</button></div>`:''}<h3>Tải ảnh lên${s?'':' lớp '+esc(lopName(A.me.lopId))}</h3><div class="form" style="max-width:none;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${s?`<label>Thuộc<select id="upL"><option value="">Ảnh chung cả khoá</option>${A.lop.map(l=>`<option value="${l.id}">Lớp ${esc(l.ten)}</option>`).join('')}</select></label>`:''}<label>Album<input id="upA" list="albumList" value="${s?'Giao lưu':'Ảnh tập thể'}"></label><label>Chú thích (tuỳ chọn)<input id="upC" maxlength="200"></label></div>
  <label class="drop" style="margin-top:12px"><b style="color:#4A2C8F">Chọn ảnh để tải lên</b> (chọn được nhiều ảnh)<br><span id="upN">Ảnh được thu nhỏ trước khi tải lên và lưu vào thư mục ANH trên Drive</span><input id="upF" type="file" accept="image/\*" multiple style="display:none" onchange="$('upN').textContent=this.files.length+' ảnh đã chọn'"></label>
  <div style="margin-top:10px"><button class="btn2" onclick="upPhotos()">Tải lên</button></div>
  <p class="who" style="margin-top:8px">Album “Ngày ấy” và “Bây giờ” hiện ở Kỷ yếu. Đặt tên album trùng tên hoạt động để hiện nút “Xem ảnh hoạt động” ở trang Ngoại khoá.</p>
  <div class="ph3" style="margin-top:22px"><h3>Ảnh đã có (${list.length})</h3>${s?`<select style="max-width:220px" onchange="apF=this.value;renderAdmin()" aria-label="Lọc ảnh"><option value="">Tất cả</option><option value="_" ${apF==='_'?'selected':''}>Ảnh chung</option>${A.lop.map(l=>`<option value="${l.id}" ${apF===l.id?'selected':''}>Lớp ${esc(l.ten)}</option>`).join('')}</select>`:''}</div>
  ${list.length?`<div class="pg">${list.map((p,i)=>`<div class="it"><button class="ed" title="Sửa thông tin ảnh" aria-label="Sửa thông tin ảnh" onclick="fPhoto('${p.id}')">✎</button><button class="del" title="Xoá ảnh" aria-label="Xoá ảnh" onclick="act(()=>api('deletePhoto',TOK,'${p.id}'),'Xoá ảnh này? Ảnh cũng được chuyển vào thùng rác Drive.','Đã xoá ảnh')">×</button><div class="ph" style="background:${grad(i)}" onclick="openLb(APL,${i})">${pic(p,300)}<span>${esc(p.album)}${s?' · '+esc(lopName(p.lopId)||'Chung'):''}</span></div></div>`).join('')}</div>`:'<p class="who">Chưa có ảnh.</p>'}`},

 'Kết nối':()=>ph3('Tin trên trang Kết nối',`<button class="btn2 sm" onclick="fNews()">Đăng tin mới</button>`)+`<p class="who" style="margin-bottom:12px">Tin nổi bật hiện to nhất ở đầu trang Kết nối (thường là tin họp lớp). Các tin khác hiện thành mẩu báo bên dưới.</p>`+
  (A.tinTuc.length?`<div class="tw"><table><tbody>${A.tinTuc.map(t=>`<tr><td><b>${esc(t.tieuDe)}</b><div class="who">${esc(t.loai)}${t.ngay?' · '+esc(t.ngay):''}</div></td><td>${t.noiBat==='1'?'<span class="pill blue">Nổi bật</span> ':''}${st(t.trangThai)}</td><td class="r"><button class="btn2 o sm" onclick="fNews('${t.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteNews',TOK,'${t.id}'),'Xoá tin này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có tin nào.</p>'),

 'Đăng ký họp lớp':()=>{const S=isS(),lopX=S?dkL:A.me.lopId,ds=A.dangKy.filter(x=>!lopX||x.lopId===lopX),c=s=>ds.filter(x=>x.trangThai===s).length;
  const dem=(id,st)=>A.dangKy.filter(x=>x.lopId===id&&(!st||x.trangThai===st)).length,l=ds.filter(x=>dkF==='all'||x.trangThai===dkF);
  const tong=S?`<div class="dk-lop">${[{id:'',ten:'Tất cả'}].concat(A.lop).map(L=>{const moi=L.id?dem(L.id,'cho'):A.dangKy.filter(x=>x.trangThai==='cho').length,xn=L.id?dem(L.id,'xacnhan'):A.dangKy.filter(x=>x.trangThai==='xacnhan').length;
   return `<button class="${dkL===L.id?'on':''}" onclick="dkL='${L.id}';renderAdmin()"><b>${L.id?'Lớp '+esc(L.ten):'Tất cả'}</b><span>${xn} xác nhận${moi?` · <i>${moi} mới</i>`:''}</span></button>`}).join('')}</div>`:'';
  const dong=d=>`<tr><td>${esc(d.hoTen)}<div class="who">${esc(d.taoLuc)}</div></td><td>${esc(d.lienHe)}</td><td class="hide-m who">${esc(d.ghiChu)}</td><td><span class="dk-tt ${d.trangThai}">${{cho:'Mới',xacnhan:'Đã xác nhận',huy:'Đã huỷ'}[d.trangThai]||esc(d.trangThai)}</span></td><td class="r">${d.trangThai!=='xacnhan'?`<button class="btn2 sm" onclick="act(()=>api('setRegistrationStatus',TOK,'${d.id}','xacnhan'),'','Đã xác nhận')">Xác nhận</button> `:''}${d.trangThai!=='huy'?`<button class="btn2 o sm" onclick="act(()=>api('setRegistrationStatus',TOK,'${d.id}','huy'),'','Đã huỷ')">Huỷ</button> `:''}<button class="btn2 red sm" onclick="act(()=>api('deleteRegistration',TOK,'${d.id}'),'Xoá đăng ký này?','Đã xoá')">Xoá</button></td></tr>`;
  const bang=rows=>`<div class="tw"><table><thead><tr><th>Họ tên</th><th>Liên hệ</th><th class="hide-m">Ghi chú</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(dong).join('')}</tbody></table></div>`;
  const nhom=S&&!dkL&&l.length?A.lop.map(L=>{const r=l.filter(x=>x.lopId===L.id);return r.length?`<h4 class="dk-nhom">Lớp ${esc(L.ten)} <span>${r.length} bạn</span></h4>${bang(r)}`:''}).join('')+(()=>{const r=l.filter(x=>!A.lop.some(L=>L.id===x.lopId));return r.length?`<h4 class="dk-nhom">Chưa rõ lớp <span>${r.length}</span></h4>${bang(r)}`:''})():'';
  return `<h3>Đăng ký họp lớp${S?(dkL?' · Lớp '+esc(lopName(dkL)):' · cả khoá'):' của lớp '+esc(lopName(A.me.lopId))}</h3>
  <p class="who" style="margin:-4px 0 12px">${S?'Mỗi bạn đăng ký tự vào đúng lớp đã chọn. Bấm vào một lớp để xem riêng lớp đó; admin lớp chỉ thấy lớp của mình.':'Các bạn chọn lớp '+esc(lopName(A.me.lopId))+' khi đăng ký sẽ hiện ở đây. Xác nhận sau khi đã liên lạc được với bạn.'}</p>${tong}
  <div class="chips">${[['cho','Mới đăng ký'],['xacnhan','Đã xác nhận'],['huy','Đã huỷ'],['all','Tất cả']].map(([k,t])=>`<button class="${dkF===k?'on':''}" onclick="dkF='${k}';renderAdmin()">${t} (${k==='all'?ds.length:c(k)})</button>`).join('')}${l.length?`<button onclick="chepDk()" title="Chép để dán vào Excel hoặc Zalo">Sao chép danh sách</button>`:''}</div>`+
  (l.length?(nhom||bang(l)):'<p class="who">Không có đăng ký nào'+(lopX?' của lớp này':'')+'.</p>')},

 'Thư ngỏ & Gala':()=>{apDungPopup();const T=THU,G=GM,hen=new Date(T.hen.getTime()-T.hen.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  const o=(id,l,v,ph)=>`<label>${l}<input id="${id}" value="${esc(v||'')}" placeholder="${esc(ph||'')}"></label>`,ta=(id,l,v,r,h)=>`<label>${l}<textarea id="${id}" rows="${r}">${esc(v||'')}</textarea>${h?`<small class="who">${h}</small>`:''}</label>`;
  return `<p class="who" style="max-width:70ch;margin-bottom:16px">Ba cửa sổ hiện khi mở trang: <b>Thư ngỏ</b> (tự mở), <b>Giấy mời</b> và <b>Kế hoạch</b> (nút trong thư). Sửa ở đây rồi bấm Lưu; “Xem thử” mở bản đang sửa mà chưa lưu. Để trống một ô thì dùng nội dung mặc định.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${o('pt_ey','Dòng nhỏ trên cùng',T.ey)}${o('pt_t1','Tiêu đề (chữ viết tay)',T.t1)}</div>
  ${o('pt_t2','Tiêu đề dòng 2',T.t2)}${o('pt_mo','Lời mở đầu',T.mo)}
  ${ta('pt_doan','Nội dung thư',T.doan.join('\n\n'),12,'Mỗi đoạn cách nhau một dòng trống. Một đoạn chỉ ghi <b>@HEN</b> là ô hẹn giờ màu đỏ (có đếm ngược). Đoạn bắt đầu bằng <b>*</b> là câu chữ viết tay nổi bật.')}
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><label>Ngày giờ hẹn (để đếm ngược)<input id="pt_hen" type="datetime-local" value="${hen}"></label>${o('pt_gio','Giờ hiển thị',T.gio)}${o('pt_ngay','Ngày hiển thị',T.ngay)}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${o('pt_ky','Lời chào cuối',T.ky)}${o('pt_kyTen','Người ký',T.kyTen)}</div>
  <label style="flex-direction:row;align-items:center;gap:8px;display:flex"><input type="checkbox" id="pt_lai" style="width:auto"> Hiện lại thư cho cả những người đã chọn “Không tự mở” (dùng khi đổi thư mới)</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2" onclick="luuPopup('thuNgo')">Lưu thư ngỏ</button><button class="btn2 o" onclick="xemPopup('thu')">Xem thử</button><button class="btn2 o" onclick="macDinhPopup('thuNgo')">Về mặc định</button></div></div>
  <h3 style="margin-top:28px">Giấy mời</h3><div class="form">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${o('pg_gio','Giờ',G.gio)}${o('pg_ngay','Ngày',G.ngay)}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${o('pg_nhaHang','Nhà hàng',G.nhaHang)}${o('pg_diaChi','Địa chỉ',G.diaChi)}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">${o('pg_dongGop','Đóng góp / người',G.dongGop)}${o('pg_han','Hạn xác nhận',G.han)}${o('pg_web','Trang web',G.web)}</div>

 const tt={cho:'Mới',xacnhan:'Đã xác nhận',huy:'Đã huỷ'};chep(['STT\tHọ tên\tLớp\tLiên hệ\tGhi chú\tTrạng thái'].concat(l.map((d,i)=>[i+1,d.hoTen,lopName(d.lopId),d.lienHe,d.ghiChu,tt[d.trangThai]||d.trangThai].join('\t'))).join('\n'),'Đã sao chép '+l.length+' bạn, dán vào Excel hoặc Zalo')}

async function changePw(){const o=$('pwO').value,n=$('pwN').value,r=$('pwR').value;if(n!==r)return toast('Mật khẩu nhập lại không khớp',1);if(n.length<6)return toast('Mật khẩu mới phải từ 6 ký tự',1);
 try{busy(1);await api('changePassword',TOK,o,n);toast('Đã đổi mật khẩu');['pwO','pwN','pwR'].forEach(i=>$(i).value='')}catch(e){err(e)}finally{busy(0)}}

/* ===================== ĐẾM LƯỢT XEM ===================== */
/* Chỉ khi chạy thật: gộp các lượt rồi gửi sau khi trang đã hiện, không làm chậm trang. Không lưu tên, SĐT, IP. */
const TK=(()=>{let k=store.get('nh_khach'),moi=0;if(!k||!/^[a-z0-9]{8,24}$/.test(k)){k=(Math.random().toString(36).slice(2,10)+Date.now().toString(36)).slice(0,20);store.set('nh_khach',k);moi=1}
 const ua=navigator.userAgent||'';return {k,moi,q:[],t:null,da:0,tb:/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?'iPhone/iPad':/Android/.test(ua)?'Android':'Máy tính',ng:/Zalo/i.test(ua)?'Zalo':/FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua)?'Facebook':'Trình duyệt'}})();
function tk(loai,giaTri){if(!LIVE)return;TK.q.push({loai,giaTri:String(giaTri||'')});if(!TK.t)TK.t=setTimeout(tkGui,TK.da?20000:7000)}
function tkGui(){clearTimeout(TK.t);TK.t=null;TK.da=1;if(!TK.q.length)return;api('ghiLuotXem',TK.k,TK.tb,TK.ng,TK.q.splice(0,30)).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&TK.q.length)tkGui()});

tk('vao',TK.moi?'1':'');
/* Trên Apps Script, doGet gửi sẵn dữ liệu (window.BOOT): không phải chờ server, màn khởi động chỉ đọc đủ 4 câu (~6 giây, chạm để bỏ qua). */
const BOOT_OK=!!(LIVE&&window.BOOT&&window.BOOT.cfg&&window.BOOT.lop);if(BOOT_OK){TM_J=JSON.stringify(window.BOOT);TM_T=Date.now()}
const VIET=!!((window.THAM&&window.THAM.viet)||/[?&]viet=1/.test(location.search));
function moViet(){ybT=3;go('yearbook');setTimeout(()=>{const w=$('w1');if(w)w.focus()},400)}
window._dangMo=LIVE?1:0;
buildNav();setD(BOOT_OK?window.BOOT:null);renderPublic();go('home');if(!LIVE)setTimeout(()=>VIET?moViet():moThu(1),VIET?300:1600);
if(BOOT_OK&&TOK)api('getAdminData',TOK).then(r=>{A=r;if(cur==='classes')renderClasses()}).catch(()=>{});
if(LIVE){window._dangMo=1;const L=$('loader'),CAU=['Đang lật lại trang lưu bút…','Đang gọi tên từng lớp…','Đang tìm lại những người bạn cũ…','Đang nhặt lại cánh phượng sân trường…'];let ci=0;
 $('ldLogo').src=$('hLogo').src;$('ldRoi').innerHTML=Array.from({length:14},(_,k)=>`<i style="left:${(k*41+7)%100}%;background:${k%3?'#C8102E':'#E8505B'};animation-duration:${8+k%5}s;animation-delay:-${(k*1.1).toFixed(1)}s"></i>`).join('');
 const xoayCau=setInterval(()=>{if(BOOT_OK&&ci>=CAU.length-1)return;const el=$('ldCau');el.classList.add('an');setTimeout(()=>{ci=(ci+1)%CAU.length;el.textContent=CAU[ci];el.classList.remove('an')},500)},BOOT_OK?1500:2000);
 L.classList.add('dau');busy(1,'Đang mở trang kỷ niệm…');
 (BOOT_OK?new Promise(r=>{const t=setTimeout(r,VIET?3000:6000);L.onclick=()=>{clearTimeout(t);r()}}).then(()=>{window._dangMo=0;renderPublic()}):loadPublic()).catch(err).finally(()=>{clearInterval(xoayCau);L.classList.add('tan');setTimeout(()=>{busy(0);L.classList.remove('dau','tan');$('ldRoi').innerHTML='';setTimeout(()=>VIET?moViet():moThu(1),VIET?100:900)},700)});if(TOK)api('getAdminData',TOK).then(r=>{A=r;if(cur==='classes')renderClasses()}).catch(()=>{})}
