<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:16px;line-height:1.6;color:#22213A;background:#fff;max-width:100%;overflow-x:clip;overscroll-behavior-x:none;display:flex;flex-direction:column;min-height:100vh;--hbg:#fff;--hfg:#22213A;--hac:#C8102E;--hline:#F0E6E6}
html{overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}main,section.view,footer.g{max-width:100%;overflow-x:clip}
@media(max-width:760px){body .p-ev .yr{font-size:min(64px,14vw)}}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fd1;outline-offset:2px}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.92);font-size:38px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.auto{aspect-ratio:auto!important;min-height:120px}.ph.auto img{position:static;height:auto}
.view{display:none}.view.on{display:block;flex:1 0 auto;animation:hien .6s ease both}
main{flex:1 0 auto;display:flex;flex-direction:column}
.empty{opacity:.75;padding:20px 0}

/* ===== HEADER CHUNG ===== */
body[data-p=classes]{--hbg:#FBFBFE;--hfg:#22213A;--hac:#D62839;--hline:#4A2C8F}
body[data-p=events]{--hbg:#FFF8EF;--hfg:#2B2420;--hac:#C8102E;--hline:#F0DCC8}
body[data-p=yearbook]{--hbg:#4A3426;--hfg:#FAF6EE;--hac:#E8C9A0;--hline:#4A3426}
body[data-p=gallery]{--hbg:#FAF7F2;--hfg:#1F1B18;--hac:#C8102E;--hline:#E8DFD3}
body[data-p=connect]{--hbg:#FFF8EF;--hfg:#2B2420;--hac:#C8102E;--hline:#F0DCC8}
body[data-p=admin]{--hbg:#fff;--hfg:#22213A;--hac:#4A2C8F;--hline:#E4DFF7}
header.g{position:sticky;top:0;z-index:40;background:var(--hbg);color:var(--hfg);border-bottom:3px solid var(--hline);transition:background .25s}
.g .in{display:flex;align-items:center;gap:14px;padding:10px 32px}
.g .brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left}
.g .brand img{width:46px;height:46px;flex:none;display:block}
.g .brand b{display:block;font-family:'Playfair Display',serif;font-size:20px;line-height:1.1}
.g .brand span{font-size:12.5px;opacity:.75}
.g nav{margin-left:auto;display:flex;gap:2px}
.g nav button{background:none;border:0;color:inherit;padding:8px 13px;font-size:14.5px;font-weight:500;opacity:.85}
.g nav button:hover{opacity:1}
.g nav button.on{opacity:1;color:var(--hac);box-shadow:inset 0 -3px 0 var(--hac)}
nav.bot{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--hbg);border-top:3px solid var(--hline)}
nav.bot button{flex:1;background:none;border:0;padding:6px 0 8px;font-size:10.5px;color:var(--hfg);opacity:.75;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bot svg{width:21px;height:21px}
nav.bot button.on{opacity:1;color:var(--hac);font-weight:700}
footer.g{padding:10px 32px;font-size:13px;line-height:1.55;align-items:center;color:#6E6A85;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;background:#fff}
footer.g a{color:#4A2C8F}
footer.g .lg{display:flex;gap:12px;align-items:center}
.ic-s{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
a.lhic{display:inline-flex;align-items:center;gap:.4em}a.lhic .ic-s{width:1.05em;height:1.05em;padding:.28em;box-sizing:content-box;border-radius:50%;background:rgba(200,16,46,.09);color:#C8102E}
footer.g .dcic{display:flex;align-items:flex-start;gap:.45em;margin-top:3px}footer.g .dcic .ic-s{margin-top:.18em;color:#C8102E}footer.g .ftlk{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end;margin-top:6px}@media(max-width:760px){footer.g .ftlk{justify-content:flex-start}}footer.g .lg img{width:44px;height:44px;flex:none}
footer.g .ft-r{text-align:right}footer.g .ft-b{max-width:440px}footer.g .ft-b b{color:#22213A}footer.g .ft-b a{text-decoration:none;font-weight:600}footer.g .ft-r b{color:#22213A}footer.g .ft-r a{text-decoration:none;font-weight:600}footer.g .ft-r a:hover{text-decoration:underline}
@media(max-width:760px){footer.g .ft-r{text-align:left}}
.p-home .k img{width:30px;height:30px;vertical-align:middle;margin-right:8px}

.p-kn .dt{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 10px 26px rgba(120,60,30,.12);display:flex;gap:14px;align-items:center;border-left:6px solid var(--do)}

.p-kn .tin{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}

 .p-kn .sodd>*{margin-left:18px}.p-kn .sodd input{margin-left:18px;width:calc(100% - 18px)}

 .p-kn .gogo{grid-template-columns:repeat(2,minmax(0,1fr));padding:22px 14px;gap:16px}.p-kn .td{margin-top:48px}}

.btn2{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:#4A2C8F;color:#fff}

.badge{background:#D62839;color:#fff;font-size:12px;border-radius:99px;padding:0 8px}

const KH_MAC_DINH="# Mục đích\nTổ chức buổi gặp mặt cựu học sinh niên khóa 2000–2003 nhằm tạo dịp hội ngộ sau nhiều năm xa cách, cùng ôn lại kỷ niệm dưới mái trường Nguyễn Hiền, tri ân thầy cô và thắt chặt tình bạn, tình thầy trò.\n# Ý nghĩa\nGala là dịp để 12 tập thể lớp cùng kết nối, sẻ chia và vun đắp tình cảm của đại gia đình Nguyễn Hiền; lan tỏa truyền thống “Tôn sư trọng đạo – Gắn kết bạn bè – Hướng về mái trường xưa”, đồng thời chung tay đóng góp những giá trị tốt đẹp cho nhà trường và các thế hệ học sinh tiếp nối.\n# Thời gian – Địa điểm\n= Thời gian: {gio}, {ngay}\n= Địa điểm: {nhaHang} · {diaChi}\n= Hình thức: Gala gặp mặt, tri ân thầy cô và giao lưu cựu học sinh.\n# Thành phần tham dự\n- Toàn thể 12 thầy cô giáo chủ nhiệm các lớp 12, niên khóa 2000–2003.\n- Các thầy cô bộ môn do các lớp đề xuất và trân trọng mời tham dự.\n- Đại diện Ban Giám hiệu Trường Nguyễn Hiền.\n- Toàn thể cựu học sinh khối 12, niên khóa 2000–2003 thuộc 12 lớp.\n# Nội dung chương trình\n## Phần 1 | Lễ gặp mặt và tri ân\n- Tuyên bố lý do, giới thiệu đại biểu và thành phần tham dự.\n- Trình chiếu slide, ôn lại hành trình và những kỷ niệm đáng nhớ của niên khóa 2000–2003.\n- Tặng hoa, quà tri ân 12 thầy cô giáo chủ nhiệm. Các lớp có nhu cầu tặng quà riêng đăng ký trước với Ban Tổ chức để phối hợp thực hiện.\n- Phát biểu giao lưu, chia sẻ cảm xúc và chụp ảnh lưu niệm.\n## Phần 2 | Gala giao lưu – Kết nối\n- Dùng tiệc, giao lưu và kết nối các thành viên của 12 lớp.\n- Giao lưu văn nghệ, chia sẻ kỷ niệm và những câu chuyện sau ngày rời ghế nhà trường.\n- Tổ chức mini game có thưởng, tạo không khí vui tươi, gần gũi.\n- Bốc thăm trúng thưởng (nếu nguồn kinh phí chung cho phép).\n- Giao lưu tự do, chụp ảnh tập thể và khép lại chương trình trong không khí thân tình, đoàn kết.\n# Các công việc cần chuẩn bị\n+ Thành lập Ban Tổ chức: Mỗi lớp cử đầu mối chủ chốt tham gia phối hợp tổ chức và triển khai công việc.\n+ Kết nối 12 lớp: Tập hợp danh sách đầu mối, xây dựng nhóm liên lạc chung của niên khóa.\n+ Mời thầy cô: Tổng hợp danh sách 12 giáo viên chủ nhiệm, các thầy cô bộ môn và đại diện Ban Giám hiệu.\n+ Thu thập hình ảnh: Các lớp gửi ảnh tập thể, ảnh thầy cô và những khoảnh khắc đáng nhớ cho Ban Tổ chức hoặc qua ứng dụng chung của niên khóa để xây dựng slide kỷ niệm.\n+ Chốt danh sách và thu kinh phí: Hạn cuối ngày {han} để tổng hợp số lượng, đặt nhà hàng và chủ động công tác hậu cần.\n+ Đặt áo và quà lưu niệm: Thống nhất mẫu áo, số lượng, hoa và quà tri ân thầy cô.\n+ Chuẩn bị ghi hình: Liên hệ đơn vị chụp ảnh, quay phim trong đêm Gala.\n+ Xây dựng kịch bản: Hoàn thiện nội dung chương trình, phân công MC, phụ trách văn nghệ, trò chơi, hậu cần, tài chính và đón tiếp thầy cô.\n# Kinh phí dự kiến\nMức đóng góp dự kiến: **700.000 đồng/người**\n| Nội dung | Dự kiến/người\n| Suất ăn và nước uống | 300.000 đồng\n| Hoa, quà tri ân thầy cô | Từ phần còn lại\n| Quà tặng nhà trường nhân dịp kỷ niệm 30 năm | Từ phần còn lại\n| Quà trò chơi và chi phí tổ chức khác | Từ phần còn lại\n| Tổng dự kiến | 700.000 đồng\n! **Lưu ý về dự toán:** Sau khi trừ suất ăn, phần kinh phí còn lại là 400.000 đồng/người, dùng để chi cho các nội dung còn lại nêu trên. Ban Tổ chức sẽ thống nhất phương án phân bổ theo báo giá thực tế và khả năng đóng góp chung.\n! Toàn bộ khoản thu – chi sẽ được Ban Tổ chức tổng hợp, công khai minh bạch. Nếu kinh phí thực tế thiếu, Ban Tổ chức sẽ thông báo cụ thể để tập thể cùng trao đổi, thống nhất phương án bổ sung; nếu còn dư, sẽ công khai phương án sử dụng phần kinh phí còn lại.\n# Tổ chức thực hiện\nBan Tổ chức chịu trách nhiệm điều phối chung, xây dựng kế hoạch, quản lý kinh phí và triển khai các hoạt động. Các đầu mối 12 lớp phối hợp truyền thông, vận động bạn bè tham dự, thu thập hình ảnh, tổng hợp danh sách và kết nối các thành viên.\nMỗi cựu học sinh là một cầu nối góp phần tạo nên sự thành công của chương trình. Rất mong nhận được sự đồng hành, chia sẻ và chung tay của tất cả các lớp để đêm Gala diễn ra ấm áp, chu đáo và ý nghĩa.\n# Thông điệp Gala\n> Hai mươi ba năm – Một mái trường – / Mười hai tập thể – Một đại gia đình\nThời gian có thể đưa mỗi người đến những hành trình riêng, nhưng tình bạn, tình thầy trò và ký ức dưới mái trường Nguyễn Hiền vẫn luôn là sợi dây gắn kết chúng ta. Gala gặp mặt là dịp để cùng trở về, gặp lại thầy cô, tìm lại bạn bè và viết tiếp những kỷ niệm đẹp của niên khóa 2000–2003.\n**Trân trọng kính mời toàn thể thầy cô và các bạn cựu học sinh cùng tham gia, chung tay để ngày hội ngộ trở thành dấu ấn đáng nhớ trong hành trình trưởng thành của mỗi chúng ta!**\n# Đóng góp kinh phí\nMức đóng góp dự kiến **{dongGop}/người**, xác nhận và đóng góp trước **{han}** qua admin lớp hoặc chuyển khoản cho thủ quỹ.\n= Thủ quỹ: {thuQuy} · {nganHang} {soTK} ({chuTK})\n= Nội dung chuyển khoản: {cuPhap}\n@CK";
const THU0=JSON.parse(JSON.stringify(THU)),GM0=JSON.parse(JSON.stringify(GM));
function apDungPopup(){const c=(D&&D.cfg)||{};const doc=k=>{try{return c[k]?JSON.parse(c[k]):null}catch(e){return null}};
 const t=doc('thuNgo');Object.assign(THU,THU0,{hen:new Date(2026,10,14,17,30)});if(t){Object.keys(t).forEach(k=>{if(t[k]!==''&&t[k]!=null&&k!=='hen'&&k!=='doan')THU[k]=t[k]});if(t.doan)THU.doan=String(t.doan).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);if(t.hen&&!isNaN(new Date(t.hen)))THU.hen=new Date(t.hen)}

function khInline(x){return esc(x).replace(/\{(\w+)\}/g,(m,k)=>k in GM?esc(GM[k]):m).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function khSo(v){const d=String(v).replace(/[^\d]/g,'');return /\d/.test(v)&&!/còn lại/i.test(v)?Number(d):null}
function khDung(txt){const secs=[];let sc=null,bk=null;const moi=(type,o)=>{bk=Object.assign({type,items:[]},o||{});(sc||(sc={title:'',bl:[]},secs.push(sc),sc)).bl.push(bk);return bk};
 String(txt||'').split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t)return;let m;
  if(m=t.match(/^#\s+(.*)/)&&!/^##/.test(t)){sc={title:t.replace(/^#\s+/,''),bl:[]};secs.push(sc);bk=null;return}
  if(/^##\s+/.test(t)){const p=t.replace(/^##\s+/,'').split('|');moi('phan',{so:p.length>1?p[0].trim():'',ten:(p.length>1?p.slice(1).join('|'):p[0]).trim()});return}
  const tag=t[0],rest=t.slice(1).trim();
  if(tag==='-'&&t[1]===' '){if(!bk||(bk.type!=='list'&&bk.type!=='phan'))moi('list');bk.items.push(rest);return}
  if(tag==='+'){if(!bk||bk.type!=='viec')moi('viec');const i=rest.indexOf(':');bk.items.push(i>0?[rest.slice(0,i),rest.slice(i+1).trim()]:[rest,'']);return}
  if(tag==='='){if(!bk||bk.type!=='dl')moi('dl');const i=rest.indexOf(':');bk.items.push(i>0?[rest.slice(0,i),rest.slice(i+1).trim()]:['',rest]);return}
  if(tag==='|'){if(!bk||bk.type!=='bang')moi('bang');bk.items.push(rest.split('|').map(x=>x.trim()));return}
  if(t==='@CK'){moi('ck');return}
  if(tag==='!'){moi('nho').items.push(rest);return}
  if(tag==='>'){moi('cau').items.push(rest);return}
  moi('p').items.push(t)});
 return secs}
function khHtml(txt){const secs=khDung(txt);
 const bl=b=>{const I=b.items;
  if(b.type==='p')return I.map(x=>`<p>${khInline(x)}</p>`).join('');
  if(b.type==='list')return `<ol>${I.map(x=>`<li>${khInline(x)}</li>`).join('')}</ol>`;
  if(b.type==='phan')return `<div class="kh-phan"><div class="nhan">${b.so?`<small>${khInline(b.so)}</small>`:''}<b>${khInline(b.ten)}</b></div><ol>${I.map(x=>`<li>${khInline(x)}</li>`).join('')}</ol></div>`;
  if(b.type==='viec')return `<div class="kh-viec">${I.map(([t,m],i)=>`<div><span>${i+1}</span><b>${khInline(t)}</b>${m?`<p>${khInline(m)}</p>`:''}</div>`).join('')}</div>`;
  if(b.type==='dl')return `<dl>${I.map(([t,m])=>`${t?`<dt>${khInline(t)}</dt>`:''}<dd>${khInline(m).replace(/ · $/,'')}</dd>`).join('')}</dl>`;
  if(b.type==='ck')return ckHtml();
  if(b.type==='nho')return `<p class="nho">${khInline(I[0])}</p>`;
  if(b.type==='cau')return `<blockquote>“${khInline(I[0]).replace(/ \/ /g,'<br>')}”</blockquote>`;
  if(b.type==='bang'){const dau=I.length>1&&!I[0].slice(1).some(x=>khSo(x)!=null)&&/nội dung|hạng mục|khoản/i.test(I[0][0])?I[0]:null,rows=dau?I.slice(1):I;
   const tong=rows.find(r=>/tổng/i.test(r[0])),tv=tong?khSo(tong[1]||''):null,so=rows.filter(r=>r!==tong&&khSo(r[1]||'')!=null);let bar='';
   if(tv&&so.length){const con=tv-so.reduce((a,r)=>a+khSo(r[1]),0);const seg=so.map(r=>[r[0].split(/\s+/).slice(0,2).join(' '),khSo(r[1])]).concat(con>0?[['Phần còn lại',con]]:[]);
    bar=`<div class="kh-thanh" role="img" aria-label="${esc(seg.map(x=>x[0]+' '+x[1].toLocaleString('vi-VN')+' đồng').join(', '))}">${seg.map((x,i)=>`<span${con>0&&i===seg.length-1?' class="con"':''} style="flex:${x[1]}">${esc(x[0])}<br>${x[1]>=1000?Math.round(x[1]/1000)+'k':x[1]}</span>`).join('')}</div>`}
   return bar+`<table>${dau?`<thead><tr>${dau.map(x=>`<th>${khInline(x)}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(r=>`<tr class="${r===tong?'tong':''}">${r.map(x=>`<td>${khInline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  return ''};
 let n=0;const html=secs.map(sc=>{const id=sc.title?'khm'+(n++):'';const cau=sc.bl.some(b=>b.type==='cau');return `<section ${id?`id="${id}"`:''} class="${cau?'kh-td':''}">${sc.title?`<h3><i>${LA[n-1]||n}</i>${khInline(sc.title)}</h3>`:''}${sc.bl.map(bl).join('')}</section>`}).join('');
 const muc=secs.filter(s=>s.title).map((s,i)=>`<button onclick="document.getElementById('khm${i}').scrollIntoView({behavior:'smooth',block:'start'})">${khInline(s.title)}</button>`).join('');

function khongDau(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/\s+/g,' ').trim()}
function chuanTim(v){return khongDau(v).toLowerCase().replace(/[^a-z0-9/ ]+/g,' ').replace(/\s+/g,' ').trim()}
function khopTim(q,t){const a=chuanTim(q).split(' ').filter(Boolean),h=' '+chuanTim(t)+' ';return a.length>0&&a.every(w=>h.includes(w))}

function ndCK(ten,lop){const sau=(String(GM.cuPhap).split(':').slice(1).join(':').trim())||'tham gia gala';return (khongDau(ten)||'Ten')+' '+(lop?'12/'+String(lop).replace(/^12[/]/,''):'Lop')+' : '+sau}
