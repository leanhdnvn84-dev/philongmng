<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.addEventListener('error',function(e){try{var d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#C8102E;color:#fff;padding:10px 16px;font:14px/1.4 sans-serif';d.textContent='Trang gặp lỗi: '+(e.message||'không rõ')+(e.lineno?' (dòng '+e.lineno+')':'')+'. Hãy chụp màn hình này gửi người quản trị trang.';(document.body||document.documentElement).appendChild(d)}catch(x){}});</script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Patrick+Hand&family=Pangolin&family=Charm:wght@400;700&family=Anton&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:16px;line-height:1.6;color:#22213A;background:#fff}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fd1;outline-offset:2px}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.92);font-size:38px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.auto{aspect-ratio:auto!important;min-height:120px}.ph.auto img{position:static;height:auto}
.view{display:none}.view.on{display:block}
.empty{opacity:.75;padding:20px 0}

/* ===== HEADER CHUNG ===== */
body{--hbg:#fff;--hfg:#22213A;--hac:#C8102E;--hline:#F0E6E6}
body[data-p=classes]{--hbg:#FBFBFE;--hfg:#22213A;--hac:#D62839;--hline:#4A2C8F}
body[data-p=events]{--hbg:#0B2545;--hfg:#fff;--hac:#FFB400;--hline:#0B2545}
body[data-p=yearbook]{--hbg:#4A3426;--hfg:#FAF6EE;--hac:#E8C9A0;--hline:#4A3426}
body[data-p=gallery]{--hbg:#1F3A2E;--hfg:#F2F1E8;--hac:#F6D86B;--hline:#8B5E3C}
body[data-p=connect]{--hbg:#141414;--hfg:#fff;--hac:#FFD23F;--hline:#D7261E}
body[data-p=admin]{--hbg:#fff;--hfg:#22213A;--hac:#4A2C8F;--hline:#E4DFF7}
header.g{position:sticky;top:0;z-index:40;background:var(--hbg);color:var(--hfg);border-bottom:3px solid var(--hline);transition:background .25s}
.g .in{display:flex;align-items:center;gap:14px;padding:10px 32px}
.g .brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left}
.g .brand svg{width:36px;height:36px;flex:none}
.g .brand b{display:block;font-family:'Playfair Display',serif;font-size:20px;line-height:1.1}
.g .brand span{font-size:12.5px;opacity:.75}
.g nav{margin-left:auto;display:flex;gap:2px}
.g nav button{background:none;border:0;color:inherit;padding:8px 13px;font-size:14.5px;font-weight:500;opacity:.85}
.g nav button:hover{opacity:1}
.g nav button.on{opacity:1;color:var(--hac);box-shadow:inset 0 -3px 0 var(--hac)}
nav.bot{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--hbg);border-top:3px solid var(--hline)}
nav.bot button{flex:1;background:none;border:0;padding:6px 0 8px;font-size:10.5px;color:var(--hfg);opacity:.75;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bot svg{width:21px;height:21px}
nav.bot button.on{opacity:1;color:var(--hac);font-weight:700}
footer.g{padding:30px 32px;font-size:14px;color:#6E6A85;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;background:#fff}
footer.g a{color:#4A2C8F}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1b2e;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;display:none;z-index:200;max-width:90vw;text-align:center}
.toast.err{background:#C8102E}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:180}
.loader.on{display:grid}
.loader div{text-align:center;color:#4A2C8F;font-weight:600;font-size:14px}
.spin{width:40px;height:40px;border:4px solid #E4DFF7;border-top-color:#4A2C8F;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.lb{position:fixed;inset:0;z-index:150;background:rgba(15,15,25,.92);display:none;place-items:center;padding:20px}
.lb.on{display:grid}
.lb .x{position:absolute;top:10px;right:18px;background:none;border:0;color:#fff;font-size:38px}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%}
.lb .pv{left:12px}.lb .nx{right:12px}
.lb figure{background:#F2F1E8;padding:12px 12px 14px;max-width:980px;text-align:center}
.lb img{max-width:100%;max-height:76vh;display:block;margin:auto}
.lb figcaption{font-family:'Pangolin',cursive;font-size:21px;color:#1F3A2E;margin-top:8px}
.lb figcaption small{display:block;font-family:'Be Vietnam Pro';font-size:13px;opacity:.7}

/* ===== TRANG CHỦ · PHƯỢNG VĨ ===== */
.p-home{--do:#C8102E;--lua:#FBF7F4;--muc:#2B2A33;--mo:#7A747A}
.p-home .hero{display:grid;grid-template-columns:1fr 1fr;min-height:600px;overflow:hidden}
.p-home .hero .l{padding:72px 32px 56px;display:flex;flex-direction:column;justify-content:center}
.p-home .k{color:var(--do);font-weight:600;font-size:15px;margin-bottom:10px}
.p-home h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(44px,5.4vw,84px);line-height:1.05;letter-spacing:-.01em;color:var(--muc)}
.p-home .hero p{max-width:46ch;color:#4C4750;font-size:18px;margin:22px 0 30px}
.p-home .btn{background:var(--do);color:#fff;border:0;border-radius:999px;padding:13px 26px;font-weight:600}
.p-home .btn.o{background:none;color:var(--do);border:1.5px solid var(--do);margin-left:10px}
.p-home .hero .r{position:relative;background:var(--lua)}
.p-home .hero .r svg{position:absolute;inset:0;width:100%;height:100%}
.petal{animation:roi 9s linear infinite}
@keyframes roi{0%{transform:translate(0,-40px) rotate(0)}100%{transform:translate(-60px,700px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal{animation:none}}
.p-home .sec{padding:72px 32px 0}
.p-home h2{font-family:'Playfair Display',serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--muc)}
.p-home .sub{color:var(--mo);margin:6px 0 26px}
.p-home .sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.p-home .more{background:none;border:0;color:var(--do);font-weight:600;text-decoration:underline;text-underline-offset:4px;margin-bottom:26px}
.p-home .cls{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #EEE3E3;border-left:1px solid #EEE3E3}
.p-home .cls button{background:#fff;border:0;border-right:1px solid #EEE3E3;border-bottom:1px solid #EEE3E3;padding:24px 18px;text-align:left;color:inherit}
.p-home .cls button:hover{background:var(--lua)}
.p-home .cls b{font-family:'Playfair Display',serif;font-size:34px;color:var(--do);font-weight:600;display:block;line-height:1}
.p-home .cls span{font-size:13.5px;color:var(--mo)}
.p-home .gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:210px 210px;gap:10px}
.p-home .gal .ph{border-radius:4px;cursor:pointer}
.p-home .gal .ph:first-child{grid-row:span 2}
.p-home .gal .ph span{position:absolute;left:10px;bottom:8px;font-size:13px;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:4px;z-index:1}
.p-home .three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.p-home .three article{border-top:3px solid var(--do);padding-top:14px}
.p-home .three b{display:block;font-family:'Playfair Display',serif;font-size:22px;line-height:1.2;margin-bottom:6px}
.p-home .three p{color:#4C4750;font-size:15px}
.p-home .three button{margin-top:10px;background:none;border:0;color:var(--do);font-weight:600;padding:0}
.p-home .quote{margin:80px 32px 72px;padding:56px 8%;background:var(--do);color:#fff;text-align:center;border-radius:4px}
.p-home .quote p{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(24px,3vw,36px);line-height:1.35;max-width:30ch;margin:auto}
.p-home .quote small{display:block;margin-top:16px;opacity:.85}

/* ===== CÁC LỚP · VỞ Ô LY ===== */
.p-cls{--ly:#E4DFF7;--ly2:#F1EEFB;--muc:#4A2C8F;--phuong:#D62839;--mo:#6E6A85;--vien:#D9D4EC;
 background-color:#FBFBFE;background-image:linear-gradient(var(--ly) 1px,transparent 1px),linear-gradient(90deg,var(--ly) 1px,transparent 1px);background-size:32px 32px;padding:40px 32px 70px;min-height:80vh}
.p-cls h2{font-family:'Patrick Hand',cursive;font-weight:400;color:var(--muc);font-size:46px;line-height:1.05}
.p-cls .sub{color:var(--mo);margin:4px 0 22px}
.p-cls .search{max-width:520px;width:100%;border:1.5px solid var(--vien);border-radius:8px;padding:11px 13px;margin-bottom:28px;background:#fff}
.p-cls .labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.nhan{background:#fff;border:2px solid var(--muc);border-radius:22px;padding:18px 18px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--c);transition:transform .15s}
.nhan:hover{transform:rotate(-1deg)}
.nhan .t{font-size:12px;color:var(--mo);text-align:center}
.nhan .lop{font-family:'Patrick Hand',cursive;font-size:44px;color:var(--c);text-align:center;line-height:1.05;margin:2px 0 8px}
.nhan .ln{display:flex;gap:8px;font-size:14px;border-bottom:1.5px dotted var(--vien);padding:4px 0}
.nhan .ln span{color:var(--mo);flex:none}
.nhan .ln em{font-style:normal;font-family:'Patrick Hand',cursive;font-size:19px;color:var(--muc);line-height:1.2}
.nhan .hit{font-size:13px;color:var(--phuong);margin-top:6px}
.p-cls .back{background:none;border:0;color:var(--muc);font-weight:600;margin-bottom:16px}
.p-cls .head{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
.p-cls .head .nhan{cursor:default}.p-cls .head .nhan:hover{transform:none}
.p-cls .head p{white-space:pre-line}
.p-cls .tabs{display:flex;gap:4px;border-bottom:2px solid var(--vien);margin:30px 0 18px;overflow-x:auto}
.p-cls .tabs button{background:none;border:0;padding:10px 16px;color:var(--mo);white-space:nowrap;margin-bottom:-2px;border-bottom:3px solid transparent}
.p-cls .tabs button.on{color:var(--muc);border-color:var(--muc);font-weight:600}
.roster{background:#fff;border:1.5px solid var(--vien);border-radius:10px;overflow:auto}
.roster table{width:100%;border-collapse:collapse}
.roster th{text-align:left;font-size:13px;color:var(--mo);font-weight:600;padding:10px 14px;background:var(--ly2)}
.roster td{padding:9px 14px;border-top:1px solid var(--ly)}
.roster td.n{font-family:'Patrick Hand',cursive;font-size:20px;color:var(--muc)}
.cv{font-size:12px;font-weight:600;color:var(--phuong);background:#FBE3E5;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-cls .mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p-cls .mini .ph{aspect-ratio:4/3;border:8px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
.p-cls .lb-note{font-family:'Patrick Hand';font-size:22px;color:var(--muc);margin-bottom:14px;white-space:pre-line}
.p-cls .lb-note small{font-family:'Be Vietnam Pro';font-size:13px;color:var(--mo)}

/* ===== NGOẠI KHOÁ · SÔNG HÀN ===== */
.p-ev{--toi:#0B2545;--troi:#E9F4FC;--cat:#F5E6C8;--nang:#FFB400;--mo:#5C6B80;color:var(--toi)}
.p-ev .hero{position:relative;background:linear-gradient(180deg,#0B2545 0%,#0E5BA8 55%,#5FB0EA 100%);color:#fff;overflow:hidden}
.p-ev .hero .c{position:relative;z-index:2;padding:56px 32px 210px;max-width:900px}
.p-ev .yr{font-weight:900;font-size:clamp(70px,11vw,170px);line-height:.85;letter-spacing:-.04em;background:linear-gradient(180deg,#FFD25E,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.p-ev h1{font-weight:800;font-size:clamp(26px,3vw,40px);line-height:1.15;margin:10px 0 12px}
.p-ev .hero p{max-width:52ch;opacity:.9;font-size:17px}
.p-ev svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px}
.p-ev .years{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:56px 32px 0}
.p-ev .year h3{font-weight:900;font-size:40px;letter-spacing:-.02em;line-height:1;color:var(--c)}
.p-ev .year .yy{color:var(--mo);font-size:14px;margin:4px 0 16px}
.p-ev .ev{background:var(--troi);border-radius:18px;overflow:hidden;margin-bottom:16px}
.p-ev .ev .ph{aspect-ratio:16/8;font-size:36px}
.p-ev .ev .ph i{position:absolute;left:12px;top:10px;font-style:normal;font-size:12.5px;font-weight:700;background:rgba(11,37,69,.6);padding:3px 10px;border-radius:99px;z-index:1}
.p-ev .ev .b{padding:14px 16px 16px}
.p-ev .ev b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.p-ev .ev p{font-size:14.5px;color:#3D4C61;margin-top:2px;white-space:pre-line}
.p-ev .ev button{margin-top:8px;background:none;border:0;color:#0E5BA8;font-weight:700;padding:0}
.p-ev .band{margin:56px 32px 70px;background:var(--cat);border-radius:22px;padding:40px;display:grid;grid-template-columns:1fr 2fr;gap:30px;align-items:center}
.p-ev .band h3{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.p-ev .band .n{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p-ev .band .n div{background:#fff;border-radius:14px;padding:16px}
.p-ev .band .n small{display:block;color:var(--mo);font-size:13px}
.p-ev .band .n button{margin-top:8px;border:0;background:var(--nang);color:var(--toi);font-weight:700;border-radius:99px;padding:6px 14px;font-size:13px}

/* ===== KỶ YẾU · ALBUM KRAFT ===== */
.p-yb{--kraft:#C9A27A;--giay:#FAF6EE;--nau:#4A3426;--do:#A33B2B;--mo:#7B6455;
 background:var(--kraft);color:var(--nau);padding:36px 32px 70px;min-height:80vh;
 background-image:radial-gradient(rgba(74,52,38,.10) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.p-yb .book{max-width:1180px;margin:auto;background:var(--giay);position:relative;box-shadow:0 20px 40px rgba(74,52,38,.25);padding:44px 52px 50px}
.p-yb .book:before{content:"";position:absolute;left:-14px;top:30px;bottom:30px;width:14px;background:repeating-linear-gradient(var(--nau) 0 10px,transparent 10px 22px);border-radius:3px 0 0 3px}
.p-yb h2{font-family:'Charm',cursive;font-size:clamp(46px,5.5vw,76px);font-weight:700;color:var(--do);line-height:1}
.p-yb .sub{color:var(--mo);margin:6px 0 24px;max-width:62ch}
.p-yb .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.p-yb .tabs button{background:none;border:1.5px solid var(--nau);color:var(--nau);border-radius:3px;padding:7px 14px;font-weight:600;font-size:14px}
.p-yb .tabs button.on{background:var(--nau);color:var(--giay)}
.p-yb .teachers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:30px 20px}
.p-yb .tc{background:#fff;padding:10px 10px 12px;box-shadow:0 6px 14px rgba(74,52,38,.2);transform:rotate(var(--r));position:relative;text-align:center}
.p-yb .tc .ph{aspect-ratio:4/5;font-family:'Charm';font-size:56px}
.p-yb .tc b{display:block;font-family:'Patrick Hand';font-weight:400;font-size:21px;line-height:1.15;margin-top:6px}
.p-yb .tc small{font-size:12.5px;color:var(--mo)}
.corner{position:absolute;width:26px;height:26px;background:var(--nau);clip-path:polygon(0 0,100% 0,0 100%);z-index:2}
.corner.tl{left:-5px;top:-5px}.corner.br{right:-5px;bottom:-5px;transform:rotate(180deg)}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(250,246,238,.85);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.p-yb .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}
.p-yb .ticket{border:1.5px dashed #B98F64;background:#fff;padding:18px 20px;font-family:'Patrick Hand';font-size:22px;line-height:1.35;position:relative;white-space:pre-line;word-break:break-word}
.p-yb .ticket small{display:block;font-family:'Be Vietnam Pro';font-size:13px;color:var(--mo);margin-top:8px;white-space:normal}
.p-yb .pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:34px}
.p-yb .pair h4{font-family:'Charm';font-weight:700;font-size:34px;color:var(--do);line-height:1;margin-bottom:12px}
.p-yb .pair .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.p-yb .pair figure{background:#fff;padding:8px 8px 10px;box-shadow:0 6px 14px rgba(74,52,38,.2);cursor:pointer}
.p-yb .pair figure:first-child{transform:rotate(-2deg)}.p-yb .pair figure:last-child{transform:rotate(2deg)}
.p-yb .pair .ph{aspect-ratio:1;font-size:34px}
.p-yb .pair figcaption{font-family:'Patrick Hand';font-size:19px;text-align:center}
.p-yb .write{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.p-yb label{display:block;font-size:14px;color:var(--mo);margin:12px 0 5px}
.p-yb input,.p-yb select,.p-yb textarea{width:100%;border:1.5px solid #D9C4A8;background:#fff;border-radius:3px;padding:10px 12px;color:var(--nau)}
.p-yb .btn{background:var(--nau);color:var(--giay);border:0;padding:11px 20px;border-radius:3px;font-weight:600;margin-top:14px}
.p-yb .pv{transform:rotate(1deg);min-height:220px}

/* ===== HÌNH ẢNH · BẢNG ĐEN ===== */
.p-gal{--bang:#1F3A2E;--phan:#F2F1E8;--vang:#F6D86B;
 background:var(--bang);color:var(--phan);font-family:'Pangolin',cursive;padding:40px 32px 70px;min-height:80vh;
 background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.06),transparent 50%),radial-gradient(ellipse at 80% 60%,rgba(255,255,255,.05),transparent 45%)}
.p-gal h2{font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1}
.p-gal .sub{font-family:'Be Vietnam Pro';opacity:.8;margin:8px 0 24px;max-width:60ch}
.p-gal .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.p-gal .chips button{background:none;border:2px solid rgba(242,241,232,.5);color:var(--phan);border-radius:10px 14px 9px 13px;padding:5px 14px;font-family:'Pangolin';font-size:18px}
.p-gal .chips button.on{border-color:var(--vang);color:var(--vang)}
.p-gal .chips.al button{font-size:16px;padding:3px 12px;border-style:dashed}
.p-gal .count{font-family:'Be Vietnam Pro';font-size:14px;opacity:.75;margin:10px 0 26px}
.p-gal .grid{columns:240px;column-gap:26px}
.p-gal figure{break-inside:avoid;margin-bottom:28px;background:var(--phan);padding:8px 8px 10px;transform:rotate(var(--r));box-shadow:0 8px 20px rgba(0,0,0,.35);cursor:pointer;position:relative}
.p-gal figure:hover{transform:rotate(0) scale(1.02)}
.p-gal figcaption{color:var(--bang);font-size:18px;text-align:center;margin-top:4px;line-height:1.2}
.p-gal figcaption small{display:block;font-family:'Be Vietnam Pro';font-size:12px;opacity:.7}
.p-gal .magnet{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--m);box-shadow:0 2px 3px rgba(0,0,0,.4);z-index:2}

/* ===== KẾT NỐI · BÁO TƯỜNG ===== */

function go(k){cur=k;document.body.dataset.p=k;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+k));
 document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.k===k;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
 if(k==='classes')renderClasses();if(k==='yearbook')renderYb();if(k==='gallery')renderGal();if(k==='admin')openAdmin();if(k==='home')countUp($('v-home'));scrollTo(0,0)}

 document.title=(c.tenTruong||'')+' · Khoá '+(c.nienKhoa||'');

 renderHome();renderClasses();renderEvents();renderYb();renderGal();renderConnect();fillAlbums()}
function fillAlbums(){const s=new Set(ALBUMS);D.hoatDong.forEach(e=>s.add(e.tieuDe));D.anh.forEach(a=>s.add(a.album));if(A)A.anh.forEach(a=>s.add(a.album));$('albumList').innerHTML=[...s].map(a=>`<option value="${esc(a)}">`).join('')}

let LB=[],lbI=0;
function openLb(list,i){LB=list.filter(Boolean);lbI=Math.min(i,LB.length-1);if(!LB.length)return;showLb();$('lb').classList.add('on')}
function showLb(){const p=LB[lbI];if(!p)return;$('lbImg').style.display=p.fileId?'':'none';$('lbPh').style.display=p.fileId?'none':'grid';if(p.fileId)$('lbImg').src=imgUrl(p.fileId,1600);else{$('lbPh').style.background=grad(lbI);$('lbPh').textContent=icFor(p)}$('lbCap').innerHTML=`${esc(p.chuThich||p.album||'')}<small>${[lopName(p.lopId)?'Lớp '+lopName(p.lopId):'Ảnh chung',p.album,p.nguoiDang?'đăng bởi '+p.nguoiDang:''].filter(Boolean).map(esc).join(', ')} · ${lbI+1}/${LB.length}</small>`;document.querySelectorAll('.lb .nv').forEach(b=>b.style.display=LB.length>1?'':'none')}
function stepLb(d){lbI=(lbI+d+LB.length)%LB.length;showLb()}
function closeLb(){$('lb').classList.remove('on');$('lbImg').src=''}
document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='ArrowRight')stepLb(1)});

  for(let k=0;k<4;k++){const cx=x+((i*37+k*29)%50)-25,cy=y+((i*23+k*41)%40)-20;f+=`<g transform="translate(${cx} ${cy})">${[0,72,144,216,288].map(r=>`<ellipse rx="7" ry="4" cx="6" cy="0" transform="rotate(${r})" fill="${k%2?'#E8505B':'#C8102E'}"/>`).join('')}<circle r="2.2" fill="#FFD23F"/></g>`}});

 return `<svg viewBox="0 0 600 620" preserveAspectRatio="xMidYMid slice"><path d="M640 40 C 520 80, 430 120, 360 210 S 250 330, 150 360" stroke="#5B3A2E" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M470 105 C 470 170, 520 210, 560 230" stroke="#5B3A2E" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M360 210 C 330 260, 340 300, 330 340" stroke="#5B3A2E" stroke-width="8" fill="none" stroke-linecap="round"/><g fill="#3E7B47" opacity=".9">${s}</g><g>${f}</g><g>${p}</g></svg>`}

let FORM=null;
function form(title,fields,v,onSave,label){v=v||{};FORM={fields,onSave};
 $('mBody').innerHTML=`<h3>${esc(title)}</h3>`+fields.map(f=>{const c=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:'');let inp;
  if(f.t==='textarea')inp=`<textarea id="f_${f.k}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(c)}</textarea>`;
  else if(f.t==='select')inp=`<select id="f_${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(c)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;

 `<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px"><button class="btn2 o" onclick="closeForm()">Huỷ</button><button class="btn2" onclick="submitForm()">${esc(label||'Lưu')}</button></div>`;

 'Lớp và admin lớp':()=>ph3('Các lớp, mỗi lớp một admin',`<button class="btn2 sm" onclick="fClass()">Thêm lớp</button>`)+
  `<div class="tw"><table><thead><tr><th>Lớp</th><th class="hide-m">Chủ nhiệm</th><th>Admin lớp</th><th></th></tr></thead><tbody>${A.lop.map(l=>`<tr><td><b>${esc(l.ten)}</b><div class="who">${l.hs.length} học sinh</div></td><td class="hide-m">${esc(l.gvcn)}</td><td>${l.adminUser?`${esc(l.admin)}<div class="who">${esc(l.adminUser)}</div>`:'<span class="pill off">Chưa có</span>'}</td>
  <td class="r"><button class="btn2 o sm" onclick="fAdmin('${l.id}')">${l.adminUser?'Đổi admin hoặc mật khẩu':'Gán admin'}</button> <button class="btn2 o sm" onclick="fClass('${l.id}')">Sửa</button> ${l.adminUser?`<button class="btn2 red sm" onclick="act(()=>api('removeClassAdmin',TOK,'${l.id}'),'Gỡ admin lớp này? Tài khoản sẽ không đăng nhập được nữa.','Đã gỡ admin')">Gỡ admin</button> `:''}<button class="btn2 red sm" onclick="act(()=>api('deleteClass',TOK,'${l.id}'),'Xoá lớp này? Chỉ xoá được khi lớp không còn học sinh và ảnh.','Đã xoá lớp')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`,

 'Thông tin lớp':()=>{const l=curAdLop();return `<h3>Thông tin lớp ${esc(l.ten)}</h3><div class="form"><label>Chủ nhiệm<input id="ciG" value="${esc(l.gvcn)}"></label><label>Ban<input id="ciB" value="${esc(l.ban)}" placeholder="Ví dụ: Ban A"></label><label>Giới thiệu lớp<textarea id="ciT" rows="4">${esc(l.gioiThieu)}</textarea></label><div><button class="btn2" onclick="act(()=>api('saveClass',TOK,{id:'${l.id}',gvcn:$('ciG').value,ban:$('ciB').value,gioiThieu:$('ciT').value}),'','Đã lưu thông tin lớp')">Lưu thông tin lớp</button></div></div>`},

 'Học sinh':()=>{const l=curAdLop();if(!l)return '<p class="who">Chưa có lớp nào.</p>';
  return lopSelect()+ph3(`Học sinh lớp ${esc(l.ten)} (${l.hs.length})`,`<button class="btn2 sm" onclick="fStudent()">Thêm học sinh</button><button class="btn2 o sm" onclick="fImport()">Dán từ Excel</button>`)+
  (l.hs.length?`<div class="tw"><table><thead><tr><th>STT</th><th>Họ tên</th><th>Chức vụ</th><th class="hide-m">Hiện ở</th><th></th></tr></thead><tbody>${l.hs.map((s,k)=>`<tr><td class="who">${esc(s.thuTu||k+1)}</td><td>${esc(s.hoTen)}</td><td>${s.chucVu?`<span class="pill blue">${esc(s.chucVu)}</span>`:''}</td><td class="hide-m">${esc(s.hienO)}</td><td class="r"><button class="btn2 o sm" onclick="fStudent('${s.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteStudent',TOK,'${s.id}'),'Xoá học sinh này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có học sinh. Có thể dán nhanh cả danh sách từ Excel.</p>')},

 'Hoạt động':()=>{const pend=A.hoatDong.filter(e=>e.trangThai==='pending'),rest=A.hoatDong.filter(e=>e.trangThai!=='pending').sort((a,b)=>dk(a.ngay)-dk(b.ngay));
  return ph3('Hoạt động ngoại khoá',`<button class="btn2 sm" onclick="fEvent()">Thêm hoạt động</button>`)+
  (pend.length?`<p class="who" style="margin-bottom:8px">Đề xuất từ các lớp</p>${pend.map(e=>`<div class="nt"><p>${esc(e.tieuDe)}</p><div class="who">${esc(e.ngay)} ${e.namHoc?'· '+esc(e.namHoc):''} · lớp ${esc(lopName(e.lopDeXuat))}</div><div class="f"><span>${esc(e.moTa)}</span><span><button class="btn2 sm" onclick="act(()=>api('setEventStatus',TOK,'${e.id}','published'),'','Đã đăng')">Đăng lên trang</button> <button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Từ chối và xoá đề xuất này?','Đã xoá')">Từ chối</button></span></div></div>`).join('')}`:'')+
  (rest.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Thời gian</th><th>Hoạt động</th><th class="hide-m">Năm học</th><th></th></tr></thead><tbody>${rest.map(e=>`<tr><td class="who" style="white-space:nowrap">${esc(e.ngay)}</td><td>${esc(e.icon||'')} ${esc(e.tieuDe)} ${e.trangThai==='hidden'?st('hidden'):''}</td><td class="hide-m who">${esc(e.namHoc)}</td><td class="r"><button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 o sm" onclick="act(()=>api('setEventStatus',TOK,'${e.id}','${e.trangThai==='hidden'?'published':'hidden'}'),'','Đã cập nhật')">${e.trangThai==='hidden'?'Hiện':'Ẩn'}</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Xoá hoạt động này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có hoạt động. Năm học ghi “2000–2001”, “2001–2002”, “2002–2003” sẽ vào cột Lớp 10, 11, 12; ghi khác sẽ vào mục Sau ra trường.</p>')},

 'Đề xuất hoạt động':()=>ph3('Đề xuất hoạt động',`<button class="btn2 sm" onclick="fEvent()">Gửi đề xuất mới</button>`)+`<p class="who" style="margin-bottom:12px">Ban liên lạc duyệt xong mới đăng lên trang Ngoại khoá.</p>`+
  (A.hoatDong.length?`<table><tbody>${A.hoatDong.map(e=>`<tr><td><b>${esc(e.tieuDe)}</b><div class="who">${esc(e.ngay)}</div></td><td>${st(e.trangThai)}</td><td class="r">${e.trangThai==='pending'?`<button class="btn2 o sm" onclick="fEvent('${e.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteEvent',TOK,'${e.id}'),'Xoá đề xuất này?','Đã xoá')">Xoá</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="who">Lớp chưa đề xuất hoạt động nào.</p>'),

 'Thầy cô':()=>ph3('Thầy cô',`<button class="btn2 sm" onclick="fTeacher()">Thêm thầy cô</button>`)+
  (A.thayCo.length?`<div class="tw"><table><tbody>${A.thayCo.map(t=>`<tr><td>${esc(t.hoTen)}</td><td class="who">${esc(t.vaiTro)}</td><td class="who">${t.anhId?'Có ảnh':''}</td><td class="r"><button class="btn2 o sm" onclick="fTeacher('${t.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteTeacher',TOK,'${t.id}'),'Xoá thầy cô này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có thầy cô.</p>'),

 'Lưu bút':()=>{const c=s=>A.luuBut.filter(x=>x.trangThai===s).length,l=A.luuBut.filter(x=>x.trangThai===nbF);
  return `<h3>${isS()?'Lưu bút gửi cả khoá và các lớp':'Lưu bút gửi lớp '+esc(lopName(A.me.lopId))}</h3><div class="chips">${[['pending','Chờ duyệt'],['approved','Đã đăng'],['hidden','Đã ẩn']].map(([k,t])=>`<button class="${nbF===k?'on':''}" onclick="nbF='${k}';renderAdmin()">${t} (${c(k)})</button>`).join('')}</div>`+
  (l.length?l.map(n=>`<div class="nt"><p>“${esc(n.noiDung)}”</p><div class="f"><span class="who">${esc(n.tacGia)} · ${n.lopId?'lớp '+esc(lopName(n.lopId)):'gửi cả khoá'} · ${esc(n.taoLuc)}</span><span>${n.trangThai!=='approved'?`<button class="btn2 sm" onclick="act(()=>api('moderateNote',TOK,'${n.id}','approved'),'','Đã duyệt')">Duyệt</button> `:''}${n.trangThai!=='hidden'?`<button class="btn2 o sm" onclick="act(()=>api('moderateNote',TOK,'${n.id}','hidden'),'','Đã ẩn')">Ẩn</button> `:''}<button class="btn2 red sm" onclick="act(()=>api('deleteNote',TOK,'${n.id}'),'Xoá hẳn lưu bút này?','Đã xoá')">Xoá</button></span></div></div>`).join(''):'<p class="who">Không có lưu bút nào.</p>')},

 'Hình ảnh':()=>{const s=isS();const list=s&&apF?A.anh.filter(a=>apF==='_'?!a.lopId:a.lopId===apF):A.anh;window.APL=list;
  return `<h3>Tải ảnh lên${s?'':' lớp '+esc(lopName(A.me.lopId))}</h3><div class="form" style="max-width:none;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${s?`<label>Thuộc<select id="upL"><option value="">Ảnh chung cả khoá</option>${A.lop.map(l=>`<option value="${l.id}">Lớp ${esc(l.ten)}</option>`).join('')}</select></label>`:''}<label>Album<input id="upA" list="albumList" value="${s?'Giao lưu':'Ảnh tập thể'}"></label><label>Chú thích (tuỳ chọn)<input id="upC" maxlength="200"></label></div>
  <label class="drop" style="margin-top:12px"><b style="color:#4A2C8F">Chọn ảnh để tải lên</b> (chọn được nhiều ảnh)<br><span id="upN">Ảnh được thu nhỏ trước khi tải lên và lưu vào thư mục ANH trên Drive</span><input id="upF" type="file" accept="image/*" multiple style="display:none" onchange="$('upN').textContent=this.files.length+' ảnh đã chọn'"></label>
  <div style="margin-top:10px"><button class="btn2" onclick="upPhotos()">Tải lên</button></div>
  <p class="who" style="margin-top:8px">Album “Ngày ấy” và “Bây giờ” hiện ở Kỷ yếu. Đặt tên album trùng tên hoạt động để hiện nút “Xem ảnh hoạt động” ở trang Ngoại khoá.</p>
  <div class="ph3" style="margin-top:22px"><h3>Ảnh đã có (${list.length})</h3>${s?`<select style="max-width:220px" onchange="apF=this.value;renderAdmin()" aria-label="Lọc ảnh"><option value="">Tất cả</option><option value="_" ${apF==='_'?'selected':''}>Ảnh chung</option>${A.lop.map(l=>`<option value="${l.id}" ${apF===l.id?'selected':''}>Lớp ${esc(l.ten)}</option>`).join('')}</select>`:''}</div>
  ${list.length?`<div class="pg">${list.map((p,i)=>`<div class="it"><button class="ed" title="Sửa thông tin ảnh" aria-label="Sửa thông tin ảnh" onclick="fPhoto('${p.id}')">✎</button><button class="del" title="Xoá ảnh" aria-label="Xoá ảnh" onclick="act(()=>api('deletePhoto',TOK,'${p.id}'),'Xoá ảnh này? Ảnh cũng được chuyển vào thùng rác Drive.','Đã xoá ảnh')">×</button><div class="ph" style="background:${grad(i)}" onclick="openLb(APL,${i})">${pic(p,300)}<span>${esc(p.album)}${s?' · '+esc(lopName(p.lopId)||'Chung'):''}</span></div></div>`).join('')}</div>`:'<p class="who">Chưa có ảnh.</p>'}`},

 'Kết nối':()=>ph3('Tin trên trang Kết nối',`<button class="btn2 sm" onclick="fNews()">Đăng tin mới</button>`)+`<p class="who" style="margin-bottom:12px">Tin nổi bật hiện to nhất ở đầu trang Kết nối (thường là tin họp lớp). Các tin khác hiện thành mẩu báo bên dưới.</p>`+
  (A.tinTuc.length?`<div class="tw"><table><tbody>${A.tinTuc.map(t=>`<tr><td><b>${esc(t.tieuDe)}</b><div class="who">${esc(t.loai)}${t.ngay?' · '+esc(t.ngay):''}</div></td><td>${t.noiBat==='1'?'<span class="pill blue">Nổi bật</span> ':''}${st(t.trangThai)}</td><td class="r"><button class="btn2 o sm" onclick="fNews('${t.id}')">Sửa</button> <button class="btn2 red sm" onclick="act(()=>api('deleteNews',TOK,'${t.id}'),'Xoá tin này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Chưa có tin nào.</p>'),

 'Đăng ký họp lớp':()=>{const c=s=>A.dangKy.filter(x=>x.trangThai===s).length,l=A.dangKy.filter(x=>x.trangThai===dkF);
  return `<h3>Đăng ký họp lớp${isS()?'':' của lớp '+esc(lopName(A.me.lopId))}</h3><div class="chips">${[['cho','Mới đăng ký'],['xacnhan','Đã xác nhận'],['huy','Đã huỷ']].map(([k,t])=>`<button class="${dkF===k?'on':''}" onclick="dkF='${k}';renderAdmin()">${t} (${c(k)})</button>`).join('')}</div>`+
  (l.length?`<div class="tw"><table><thead><tr><th>Họ tên</th>${isS()?'<th>Lớp</th>':''}<th>Liên hệ</th><th class="hide-m">Ghi chú</th><th></th></tr></thead><tbody>${l.map(d=>`<tr><td>${esc(d.hoTen)}<div class="who">${esc(d.taoLuc)}</div></td>${isS()?`<td>${esc(lopName(d.lopId))}</td>`:''}<td>${esc(d.lienHe)}</td><td class="hide-m who">${esc(d.ghiChu)}</td><td class="r">${d.trangThai!=='xacnhan'?`<button class="btn2 sm" onclick="act(()=>api('setRegistrationStatus',TOK,'${d.id}','xacnhan'),'','Đã xác nhận')">Xác nhận</button> `:''}${d.trangThai!=='huy'?`<button class="btn2 o sm" onclick="act(()=>api('setRegistrationStatus',TOK,'${d.id}','huy'),'','Đã huỷ')">Huỷ</button> `:''}<button class="btn2 red sm" onclick="act(()=>api('deleteRegistration',TOK,'${d.id}'),'Xoá đăng ký này?','Đã xoá')">Xoá</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="who">Không có đăng ký nào.</p>')},

 'Cài đặt':()=>{const c=A.cfg;return `<h3>Cài đặt chung</h3><div class="form">
  <label>Tên trường<input id="cf_tenTruong" value="${esc(c.tenTruong)}"></label><label>Địa chỉ<input id="cf_diaChi" value="${esc(c.diaChi)}"></label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>Niên khoá<input id="cf_nienKhoa" value="${esc(c.nienKhoa)}"></label><label>Năm ra trường<input id="cf_namRaTruong" value="${esc(c.namRaTruong)}" inputmode="numeric"></label></div>
  <label>Câu mở đầu trang chủ<input id="cf_cauMoDau" value="${esc(c.cauMoDau)}"></label>
  <label>Câu trích dẫn cuối trang chủ<textarea id="cf_trichDan" rows="2">${esc(c.trichDan)}</textarea></label><label>Người viết câu trích dẫn<input id="cf_trichDanTacGia" value="${esc(c.trichDanTacGia)}"></label>
  <label>Thư gửi bạn cũ (hiện ở trang chủ)<textarea id="cf_loiNgo" rows="5">${esc(c.loiNgo)}</textarea></label><label>Người ký thư<input id="cf_nguoiKy" value="${esc(c.nguoiKy)}"></label>
  <div><button class="btn2" onclick="saveCfg()">Lưu cài đặt</button></div></div>
  <h3 style="margin-top:28px">Dữ liệu mẫu</h3><p class="who" style="max-width:62ch;margin-bottom:12px">Nạp nội dung mẫu giống bản demo (chủ nhiệm, học sinh, hoạt động, thầy cô, lưu bút, tin họp lớp, ảnh minh hoạ) để xem trước trang. Khi có dữ liệu thật, bấm xoá dữ liệu mẫu; dữ liệu bạn tự nhập không bị ảnh hưởng.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2" onclick="demoData('seedDemo')">Nạp dữ liệu mẫu</button><button class="btn2 red" onclick="demoData('clearDemo')">Xoá dữ liệu mẫu</button></div>`},

 'Tài khoản của tôi':()=>`<h3>Liên hệ của bạn</h3><div class="form" style="max-width:420px"><label>Số điện thoại, Zalo hoặc email<input id="myC" value="${esc(A.me.lienHe)}" placeholder="Ví dụ: 0905 123 456"></label><p class="who">${isS()?'Dùng để các admin lớp liên hệ Ban liên lạc.':'Hiện ở danh bạ admin trên trang Kết nối, để các bạn trong lớp liên hệ. Để trống thì ẩn.'}</p><div><button class="btn2" onclick="act(()=>api('updateMyContact',TOK,$('myC').value),'','Đã lưu liên hệ')">Lưu liên hệ</button></div></div>
  <h3 style="margin-top:26px">Đổi mật khẩu</h3><div class="form" style="max-width:360px"><input id="pwO" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password" aria-label="Mật khẩu hiện tại"><input id="pwN" type="password" placeholder="Mật khẩu mới, từ 6 ký tự" autocomplete="new-password" aria-label="Mật khẩu mới"><input id="pwR" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" aria-label="Nhập lại mật khẩu mới"><div><button class="btn2" onclick="changePw()">Đổi mật khẩu</button></div></div>`
};

/* ---- biểu mẫu ---- */
function fClass(id){const l=id?A.lop.find(x=>x.id===id):{thuTu:String(A.lop.length+1)};
 form(id?'Sửa lớp '+l.ten:'Thêm lớp',[{k:'ten',l:'Tên lớp',req:1,ph:'Ví dụ: 12/1'},{k:'gvcn',l:'Chủ nhiệm',ph:'Ví dụ: Cô Nguyễn Thị Hoa'},{k:'ban',l:'Ban',ph:'Ví dụ: Ban A'},{k:'thuTu',l:'Thứ tự hiển thị',t:'number'},{k:'gioiThieu',l:'Giới thiệu lớp',t:'textarea',rows:3}],l,
 async o=>{o.id=id||'';await api('saveClass',TOK,o);toast('Đã lưu lớp')})}
function fAdmin(lopId){const l=A.lop.find(x=>x.id===lopId),has=!!l.adminUser;
 form('Admin lớp '+l.ten,[{k:'hoTen',l:'Họ tên admin',req:1,ph:'Ví dụ: Nguyễn Văn An'},{k:'user',l:'Tên đăng nhập',req:1,hint:'Chữ thường không dấu, số, dấu _ hoặc .'},{k:'pw',l:has?'Mật khẩu mới (để trống nếu giữ nguyên)':'Mật khẩu',req:!has,hint:'Từ 6 ký tự. Gửi cho admin lớp và nhắc họ đổi lại.'}],
 {hoTen:l.admin,user:l.adminUser||('admin_'+l.ten.toLowerCase().replace(/\//g,'_').replace(/[^a-z0-9_]/g,''))},
 async o=>{await api('setClassAdmin',TOK,lopId,o.user,o.hoTen,o.pw);toast('Đã gán admin lớp '+l.ten)})}
function fStudent(id){const l=curAdLop(),s=id?l.hs.find(x=>x.id===id):{thuTu:String(l.hs.length+1)};
 form(id?'Sửa học sinh':'Thêm học sinh lớp '+l.ten,[{k:'hoTen',l:'Họ tên',req:1},{k:'chucVu',l:'Chức vụ',ph:'Ví dụ: Lớp trưởng, Bí thư'},{k:'hienO',l:'Hiện ở',ph:'Ví dụ: Đà Nẵng, TP.HCM, Úc'},{k:'thuTu',l:'STT',t:'number'}],s,
 async o=>{o.id=id||'';o.lopId=l.id;await api('saveStudent',TOK,o);toast('Đã lưu')})}
function fImport(){const l=curAdLop();
 form('Dán danh sách lớp '+l.ten,[{k:'text',l:'Dữ liệu',t:'textarea',rows:10,req:1,ph:'Nguyễn Văn An\tLớp trưởng\tĐà Nẵng\nTrần Thị Bình\t\tTP.HCM',hint:'Copy 3 cột trong Excel theo thứ tự Họ tên, Chức vụ, Hiện ở rồi dán vào đây. Mỗi dòng một bạn. Có cột STT ở đầu cũng được.'}],{},
 async o=>{const n=await api('importStudents',TOK,l.id,o.text);toast('Đã thêm '+n+' học sinh')},'Nhập danh sách')}
function fEvent(id){const e=id?A.hoatDong.find(x=>x.id===id):{icon:'🎪'};
 form(id?'Sửa hoạt động':(isS()?'Thêm hoạt động':'Đề xuất hoạt động'),[{k:'tieuDe',l:'Tên hoạt động',req:1},{k:'ngay',l:'Thời gian',ph:'Ví dụ: 26/03/2001 hoặc 05/2003'},{k:'namHoc',l:'Năm học',list:'nhList',hint:'Chọn 2000–2001, 2001–2002, 2002–2003 hoặc Sau ra trường'},{k:'icon',l:'Biểu tượng khi chưa có ảnh',ph:'🎪'},{k:'moTa',l:'Mô tả',t:'textarea'},{k:'anh',l:id&&e.anhId?'Thay ảnh đại diện (tuỳ chọn)':'Ảnh đại diện (tuỳ chọn)',t:'file'}],e,
 async (o,f)=>{const du=f.anh[0]?await readImg(f.anh[0]):'';delete o.anh;o.id=id||'';await api('saveEvent',TOK,o,du);toast(isS()?'Đã lưu hoạt động':'Đã gửi đề xuất cho Ban liên lạc')})}
function fTeacher(id){const t=id?A.thayCo.find(x=>x.id===id):{thuTu:String(A.thayCo.length+1)};
 form(id?'Sửa thầy cô':'Thêm thầy cô',[{k:'hoTen',l:'Họ tên',req:1,ph:'Ví dụ: Thầy Nguyễn Văn Thành'},{k:'vaiTro',l:'Vai trò',ph:'Ví dụ: Hiệu trưởng, chủ nhiệm 12/1, giáo viên Văn'},{k:'thuTu',l:'Thứ tự',t:'number'},{k:'anh',l:'Ảnh (tuỳ chọn)',t:'file'}],t,
 async (o,f)=>{const du=f.anh[0]?await readImg(f.anh[0],700):'';delete o.anh;o.id=id||'';await api('saveTeacher',TOK,o,du);toast('Đã lưu')})}
function fNews(id){const t=id?A.tinTuc.find(x=>x.id===id):{loai:'Thông báo',noiBat:'0',trangThai:'published'};
 form(id?'Sửa tin':'Đăng tin mới',[{k:'tieuDe',l:'Tiêu đề',req:1,ph:'Ví dụ: Họp lớp toàn khoá 2026'},{k:'loai',l:'Loại tin',t:'select',o:[['Thông báo','Thông báo'],['Họp lớp','Họp lớp'],['Tìm người','Tìm người'],['Tri ân','Tri ân'],['Tin vui','Tin vui']]},{k:'ngay',l:'Thời gian (nếu có)',ph:'Ví dụ: 20/11/2026'},{k:'noiDung',l:'Nội dung',t:'textarea',rows:5},{k:'noiBat',l:'Hiện thành tin nổi bật đầu trang',t:'select',o:[['0','Không'],['1','Có']]},{k:'trangThai',l:'Trạng thái',t:'select',o:[['published','Hiện trên trang'],['hidden','Ẩn']]}],t,
 async o=>{o.id=id||'';await api('saveNews',TOK,o);toast('Đã lưu tin')})}
function fPhoto(id){const p=A.anh.find(x=>x.id===id);form('Sửa thông tin ảnh',[{k:'album',l:'Album',req:1,list:'albumList'},{k:'chuThich',l:'Chú thích'}],p,async o=>{await api('updatePhoto',TOK,id,o.album,o.chuThich);toast('Đã lưu')})}
async function upPhotos(){const files=[...$('upF').files];if(!files.length)return toast('Chọn ít nhất 1 ảnh',1);
 const album=$('upA').value.trim();if(!album)return toast('Nhập tên album',1);const lopId=isS()?$('upL').value:A.me.lopId,cap=$('upC').value.trim();let ok=0;
 try{busy(1);for(let i=0;i<files.length;i++){$('loadTxt').textContent=`Đang tải ảnh ${i+1}/${files.length}…`;const du=await readImg(files[i]);await api('uploadPhoto',TOK,{album,lopId,chuThich:cap,dataUrl:du,name:files[i].name});ok++}toast('Đã tải lên '+ok+' ảnh')}
 catch(e){err(e);if(ok)setTimeout(()=>toast('Đã tải '+ok+'/'+files.length+' ảnh trước khi gặp lỗi',1),4300)}
 finally{try{await refresh()}catch(e){}busy(0)}}
async function demoData(fn){if(fn==='clearDemo'&&!confirm('Xoá toàn bộ dữ liệu mẫu?'))return;try{busy(1,fn==='seedDemo'?'Đang nạp dữ liệu mẫu…':'Đang xoá dữ liệu mẫu…');const m=await api(fn,TOK);await refresh();toast(m)}catch(e){err(e)}finally{busy(0)}}
function saveCfg(){const o={};['tenTruong','diaChi','nienKhoa','namRaTruong','cauMoDau','trichDan','trichDanTacGia','loiNgo','nguoiKy'].forEach(k=>o[k]=$('cf_'+k).value);act(()=>api('saveConfig',TOK,o),'','Đã lưu cài đặt')}
async function changePw(){const o=$('pwO').value,n=$('pwN').value,r=$('pwR').value;if(n!==r)return toast('Mật khẩu nhập lại không khớp',1);if(n.length<6)return toast('Mật khẩu mới phải từ 6 ký tự',1);
 try{busy(1);await api('changePassword',TOK,o,n);toast('Đã đổi mật khẩu');['pwO','pwN','pwR'].forEach(i=>$(i).value='')}catch(e){err(e)}finally{busy(0)}}

/* ===================== INIT ===================== */
buildNav();setD(null);renderPublic();go('home');
if(window.google&&google.script&&google.script.run)loadPublic().catch(err);
</script>
