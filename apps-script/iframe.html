<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafef-RCG · Quản lý tài chính</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;border:0;width:100%;height:100vh;height:100dvh;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#475569;font-size:14px;background:#f5f7fb;transition:opacity .3s}
  #loading.hide{opacity:0;pointer-events:none}
  .spin{width:32px;height:32px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #loading a{color:#2563eb;text-decoration:none;font-weight:600}
  @media (prefers-color-scheme:dark){html,body,#loading{background:#0f172a;color:#cbd5e1}}
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div>Đang tải ứng dụng…</div>
  <a id="open" target="_blank" rel="noopener">Mở trong tab mới ↗</a>
</div>
<iframe id="app" title="Cafef-RCG · Quản lý tài chính"
  allow="clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxOpwD_8-JkHJkYvtBTEVC_80Vt7-zvUFS9PeqkJue4Gg2VVIWZpFa1G1vDe48w1O1_eQ/exec';
  var f = document.getElementById('app'), l = document.getElementById('loading');
  document.getElementById('open').href = APP_URL;
  f.addEventListener('load', function(){ l.classList.add('hide'); });
  f.src = APP_URL + location.search; // chuyển tiếp tham số (vd ?m=KHOAN_VAY) nếu có
</script>
</body>
</html>
