<!doctype html><html lang="vi"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QL_TC_2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">



<style>
/* ===== QL_TC_2026 v5.9.3 · CSS hợp nhất: mỗi thành phần khai báo 1 lần, không ghi đè chồng chéo =====
   Thứ tự: Biến · Khung · Nút & ô nhập · Phân hệ (desktop) · Ngân hàng · Chi tiết · Popup & form · Tạo tháng mới
           · Đồng bộ dư nợ & Nhập file · Lịch trả nợ theo tháng · Thông báo · Đáp ứng · MOBILE · Tải nhanh */
:root {
  --brand: #9f1239; --brand-dark: #7f0d2d; --brand-soft: #fff1f4;
  --ink: #14213a; --muted: #718096; --line: #e7ebf0; --bg: #f5f7fa; --soft: #f8fafc;
  --green: #138a55; --red: #d43c45; --amber: #d8890b; --blue: #2563b8;
  --shadow: 0 6px 20px #14213a0a; --r: 10px; --h: 34px;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { color: var(--ink); background: var(--bg); font: 400 13.5px/1.45 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
input::placeholder { color: #91a0b3; }
.hide { display: none !important; }
.sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
.req, .danger { color: var(--red); }
.green { color: var(--green); }
.brand-number { color: var(--brand) !important; }

/* ---------- Khung ---------- */
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.side { position: relative; z-index: 40; flex: 0 0 56px; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(100deg, var(--brand-dark), var(--brand) 68%, #ad1742); box-shadow: 0 4px 14px #5f0a2424; }
.logo { flex: 0 0 auto; font-size: 18px; font-weight: 700; white-space: nowrap; cursor: pointer; }
#nav { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 2px; }
.menu-drop summary { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: #fff5f7; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; list-style: none; cursor: pointer; }
.menu-drop summary::-webkit-details-marker { display: none; }
.menu-drop:hover summary, .menu-drop.active summary, .menu-drop[open] summary { color: #fff; background: #ffffff16; border-bottom-color: #ffffffd9; }
.menu-drop { position: relative; }
.menu-drop summary span { color: #ffd6df; font-size: 11px; transition: transform .18s; }
.menu-drop[open] summary span { transform: rotate(180deg); }
.drop-panel { position: absolute; left: 0; top: 46px; z-index: 80; min-width: 220px; display: grid; gap: 2px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 16px 40px #14213a24; }
.drop-panel button { position: relative; padding: 9px 12px; color: #253b53; background: none; border: 0; border-radius: 8px; text-align: left; white-space: nowrap; cursor: pointer; }
.drop-panel button:hover, .drop-panel button.active { color: var(--brand); background: var(--brand-soft); }
.drop-panel button.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--brand); }
.nav-account { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; color: var(--brand); background: #fff; border-radius: 50%; font-size: 12px; font-weight: 800; }
.user { font-size: 12px; line-height: 1.25; }
.user div { color: #ffdce4; font-size: 10px; }
.main { flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; }
.content { height: 100%; display: flex; flex-direction: column; padding: 12px; overflow: auto; }
.content.module-view { overflow: hidden; }
#workspace { flex: 1 1 auto; min-height: 0; }

/* ---------- Nút & ô nhập ---------- */
.btn, .select, .search { height: var(--h); background: #fff; border: 1px solid #dbe2e9; border-radius: 8px; }
.btn { padding: 0 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--soft); border-color: #cbd5df; }
.btn.icon { width: var(--h); padding: 0; }
.btn.primary { color: #fff; background: linear-gradient(135deg, var(--brand), #b91f49); border-color: var(--brand); }
.btn.ok { color: var(--green); border-color: #ccebdc; }
.btn.danger { color: var(--red); border-color: #f4ced2; }
.btn:disabled { opacity: .55; cursor: default; }
.select { padding: 0 8px; color: #53657a; }
.search { padding: 0 12px; outline: none; }
.search:focus, .select:focus, .field :is(input, select, textarea):focus { border-color: #c36b86; box-shadow: 0 0 0 3px #9f123912; outline: none; }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; color: #526170; background: #eef2f6; border-radius: 14px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.pill.good { color: #117747; background: #e8f7ef; }
.pill.warn { color: #9b6200; background: #fff4dc; }
.pill.bad { color: #b42b36; background: #fdebed; }
.pill.info { color: #245895; background: #edf5ff; }
.count-badge { padding: 3px 9px; color: var(--brand); background: var(--brand-soft); border-radius: 12px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.empty { padding: 48px 16px; color: var(--muted); text-align: center; }

/* ---------- Phân hệ (desktop) ---------- */
#workspace.module-workspace { display: flex; flex-direction: column; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.module-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.screen-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
.tools { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
.tools .search { flex: 0 1 260px; min-width: 160px; }
.module-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 24%); }
.module-body.empty-body { grid-template-columns: minmax(0, 1fr); }
.list-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.empty-body .list-pane { border-right: 0; }
.empty-body .empty { flex: 1 1 auto; display: grid; place-items: center; }
.table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
.table-wrap table { min-width: 900px; }
th, td { max-width: 300px; padding: 8px 10px; overflow: hidden; border-bottom: 1px solid #edf0f4; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 2; height: 38px; color: #5d6d82; background: #f7f9fc; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
td { height: 46px; font-size: 13px; font-variant-numeric: tabular-nums; }
th.num, td.num { text-align: right; }
td b { font-weight: 600; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: #fafbfc; }
tbody tr.selected td { background: #fff4f6; border-bottom-color: #f7dce3; }
tbody tr.selected td:first-child { box-shadow: inset 3px 0 var(--brand); }
.row-code-icon { display: inline-grid; width: 26px; height: 26px; margin-right: 7px; place-items: center; color: var(--blue); background: #eef4ff; border-radius: 7px; }
.table-footer { flex: 0 0 auto; min-height: 76px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; overflow-x: auto; background: #fdfefe; border-top: 1px solid var(--line); scrollbar-width: thin; }
.footer-summary { flex: 1 0 auto; display: flex; align-items: center; }
.footer-metric { min-width: 165px; padding: 2px 20px; border-right: 1px solid var(--line); line-height: 1.25; }
.footer-metric:first-child { padding-left: 2px; }
.footer-metric:last-child { border-right: 0; }
.footer-metric small { display: block; margin-bottom: 5px; color: #7d899a; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
.footer-metric b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pager { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
.page-btn { min-width: 30px; height: 30px; background: #fff; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.page-btn:hover:not(:disabled) { color: var(--brand); background: var(--brand-soft); border-color: #e9b9c6; }
.page-btn:disabled { color: #b8c1cc; background: var(--soft); cursor: default; }
.page-btn.active { color: #fff; background: var(--brand); border-color: var(--brand); }
.page-gap { min-width: 18px; color: #8490a2; text-align: center; }

/* ---------- Ngân hàng ---------- */
.bank-loan { display: flex; align-items: center; gap: 10px; }
.loan-cell { display: grid; gap: 1px; line-height: 1.25; }
.loan-cell span, .loan-cell small { color: #73829a; font-size: 11.5px; }
.bank-logo { flex: 0 0 34px; width: 34px; height: 34px; display: inline-grid; place-items: center; padding: 3px; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px #14213a10; vertical-align: middle; }
.bank-logo img, .bank-logo svg { width: 100%; height: 100%; display: block; object-fit: contain; }
.bank-logo.small { flex-basis: 22px; width: 22px; height: 22px; margin-right: 6px; padding: 2px; border-radius: 6px; }
.bank-name { vertical-align: middle; }
.bank-wordmark { display: block; max-width: 160px; max-height: 28px; margin: 0 0 5px; object-fit: contain; }

/* ---------- Chi tiết ---------- */
.detail-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.detail-hero { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: linear-gradient(145deg, #fff, #fff3f6); border-bottom: 1px solid var(--line); }
.detail-hero > .bank-logo, .detail-icon { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; }
.detail-hero > .bank-logo { padding: 6px; }
.detail-icon { display: grid; place-items: center; color: #1769da; background: #edf4ff; font-size: 21px; }
.record-id { color: var(--brand); font-size: 12px; font-weight: 700; }
.detail-hero h3 { margin: 3px 0 6px; font-size: 15px; font-weight: 700; }
.payment-total { margin: 12px 16px 0; padding: 10px 12px; background: linear-gradient(135deg, #fff2f5, #fff8fa); border: 1px solid #f7dfe5; border-radius: var(--r); }
.payment-total small { display: block; color: #76859b; font-size: 12px; }
.payment-total strong { display: block; margin-top: 3px; color: var(--brand); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.detail-section { padding: 8px 16px 12px; }
.detail-row { display: grid; grid-template-columns: 42% 58%; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #eef1f5; }
.detail-row:last-child { border-bottom: 0; }
.detail-row span { color: #8490a2; }
.detail-row b { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.detail-note { margin: 0 16px 12px; }
.detail-note small { color: #8793a5; font-weight: 700; }
.detail-note p { margin: 4px 0 0; padding: 10px; background: #f7f8fa; border: 1px solid var(--line); border-radius: 8px; }
.detail-actions { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; background: #fffffff2; border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
.detail-actions .btn { flex: 1 1 auto; }

/* ---------- Popup, form ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 100; display: grid; place-items: stretch end; background: #071d356e; backdrop-filter: blur(2px); }
.dialog-bg { place-items: center; padding: 16px; }
.modal { width: min(480px, 100%); height: 100vh; display: flex; flex-direction: column; background: #fff; border-radius: 16px 0 0 16px; box-shadow: -20px 0 55px #061c3335; animation: slideIn .2s ease-out; }
.modal-head, .modal-foot { display: flex; align-items: center; gap: 8px; padding: 14px 20px; }
.modal-head { justify-content: space-between; border-bottom: 1px solid var(--line); }
.modal-foot { flex-wrap: wrap; justify-content: flex-end; background: #fcfbf9; border-top: 1px solid var(--line); }
.modal-body { flex: 1 1 auto; overflow: auto; padding: 16px 20px; }
.drawer-id { color: var(--brand); font-size: 12px; font-weight: 700; }
.form-section { margin-bottom: 18px; }
.form-section:last-child { margin-bottom: 0; }
.form-section h4 { margin: 0 0 10px; padding-bottom: 6px; color: #7b8798; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.form-grid { display: grid; gap: 10px; }
.field label { display: block; margin-bottom: 4px; color: #546678; font-size: 12px; }
.field input, .field select, .field textarea { width: 100%; padding: 8px; background: #fff; border: 1px solid #cbd7e2; border-radius: 8px; }
.field input, .field select { height: 40px; }
.field textarea { height: 84px; resize: vertical; }
.action-dialog { width: min(470px, 100%); overflow: hidden; background: #fff; border-radius: 14px; box-shadow: 0 22px 70px #071d3550; }
.filter-dialog { width: min(720px, 100%); }
.dialog-body { padding: 16px 20px; }
.dialog-body p { margin: 0 0 14px; line-height: 1.6; }
.dialog-danger { color: #fff; background: #c6283d; border-color: #c6283d; }
.filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@keyframes slideIn { from { opacity: .5; transform: translateX(35px); } to { opacity: 1; transform: none; } }

/* ---------- Tạo dữ liệu tháng mới (Lịch trả nợ) ---------- */
.copy-dialog { width: min(1080px, 96vw); height: min(820px, 92vh); display: flex; flex-direction: column; overflow: hidden; background: #fff; border-radius: 14px; box-shadow: 0 24px 75px #14213a40; }
.copy-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; overflow: hidden; }
.copy-periods { display: grid; grid-template-columns: 1fr 32px 1fr auto; gap: 10px; align-items: end; }
.copy-periods .field input { height: 38px; }
.copy-arrow { padding-bottom: 8px; color: var(--blue); font-size: 22px; text-align: center; }
.copy-option { height: 38px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.copy-option input, .copy-check { accent-color: var(--brand); }
.copy-table-box { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); }
.copy-select-all { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: #fafbfc; border-bottom: 1px solid var(--line); font-weight: 600; }
.copy-table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
.copy-table { min-width: 900px; }
.copy-table th, .copy-table td { height: 40px; padding: 6px 9px; }
.copy-table th:first-child, .copy-table td:first-child { width: 54px; text-align: center; }
.copy-table tr.duplicate td { color: #9aa5b3; background: #fafbfc; }
.copy-loan { display: flex; align-items: center; gap: 8px; }
.copy-summary { min-height: 52px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #f7f9fc; border: 1px solid var(--line); border-radius: 8px; }
.copy-summary div { padding: 7px 12px; border-right: 1px solid var(--line); }
.copy-summary div:last-child { border-right: 0; }
.copy-summary small { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; }
.copy-summary b { display: block; margin-top: 2px; font-size: 13px; white-space: nowrap; }
.copy-warning { margin-right: auto; color: #9b6200; font-size: 11px; }

/* ---------- Thông báo ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; z-index: 120; display: none; max-width: calc(100% - 32px); padding: 10px 15px; color: #fff; background: #17212b; border-radius: 8px; transform: translateX(-50%); }
.busy { position: fixed; inset: 0; z-index: 130; display: grid; place-items: center; background: #f4f7fbd9; font-weight: 700; }


/* =====================================================================
   MOBILE · BỘ GIAO DIỆN ĐIỆN THOẠI DUY NHẤT (v5.8)
   Bật/tắt bằng một công tắc: body.is-mobile (do detectDevice() quyết định).
   Thứ tự: 1 Khung · 2 Thanh tiêu đề · 3 Danh sách · 4 Lịch trả nợ theo tháng
           5 Chi tiết (bottom sheet) · 6 Menu ☰ · 7 Bộ lọc · 8 Hộp thoại · 9 Hiệu ứng
   ===================================================================== */

/* 1 · Khung */
body.is-mobile .side { flex-basis: 52px; gap: 8px; padding: 0 10px; }
body.is-mobile .logo { font-size: 15px; }
body.is-mobile #nav, body.is-mobile .nav-account { display: none; }
body.is-mobile .content { padding: 0; }
body.is-mobile #workspace.mobile-workspace { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 92px; }

/* 2 · Thanh tiêu đề: logo + ô tìm kiếm */
.m-top { display: none; }
body.is-mobile .m-top { flex: 1; min-width: 0; height: 38px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; color: #fff; background: #ffffff1f; border: 1px solid #ffffff3d; border-radius: 999px; transition: background .15s; }
body.is-mobile .m-top:focus-within { color: var(--ink); background: #fff; border-color: #fff; }
.m-top-ico { font-size: 17px; opacity: .85; }
.m-top-input { flex: 1; min-width: 0; height: 100%; padding: 0 4px; color: inherit; background: none; border: 0; outline: none; font-size: 14px; }
.m-top-input::placeholder { color: #ffdbe4; }
.m-top:focus-within .m-top-input::placeholder { color: #91a0b3; }
.m-top-input::-webkit-search-cancel-button { display: none; }
.m-top-x { flex: 0 0 30px; height: 30px; display: grid; place-items: center; padding: 0; color: inherit; background: none; border: 0; border-radius: 50%; font-size: 19px; cursor: pointer; }

/* 3 · Danh sách thẻ */
.m-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; }
.m-title { flex: 1 1 auto; min-width: 0; overflow: hidden; font-size: 18px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.m-chips { display: flex; gap: 6px; margin: 0 -12px 10px; padding: 0 12px 2px; overflow-x: auto; scrollbar-width: none; }
.m-chips::-webkit-scrollbar { display: none; }
.m-chip { flex: 0 0 auto; height: 34px; padding: 0 12px; color: #53657a; background: #fff; border: 1px solid #dfe5ec; border-radius: 17px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.m-chip.active, .m-chip.brand { color: var(--brand); background: var(--brand-soft); border-color: #f2cad5; }
.m-fpill { display: inline-flex; align-items: center; gap: 5px; color: var(--brand); background: var(--brand-soft); border-color: #f4c7d3; }
.m-fpill svg { width: 13px; height: 13px; }
.m-fpill b { margin-left: 2px; font-size: 15px; }
.m-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.m-sum div { min-width: 0; padding: 8px 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.m-sum div:last-child:nth-child(odd) { grid-column: 1 / -1; }
.m-sum small, .m-sum b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-sum small { color: #7d899a; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.m-sum b { font-size: 14px; font-variant-numeric: tabular-nums; }
.m-list { display: grid; gap: 8px; }
.m-card { width: 100%; min-height: 68px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; text-align: left; cursor: pointer; }
.m-card:active, .m-card.selected { background: #fff4f6; border-color: #f2cad5; }
.m-card .bank-logo, .m-lead { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 11px; }
.m-card .bank-logo { padding: 5px; }
.m-lead { display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); font-size: 13px; font-weight: 800; }
.m-lead.in, .m-lead.out, .m-lead.mv { font-size: 18px; }
.m-lead.in { color: var(--green); background: #e8f7ef; }
.m-lead.out { color: var(--red); background: #fdebed; }
.m-lead.mv { color: var(--blue); background: #edf4ff; }
.m-lead.cash { color: #9b6200; background: #fff4dc; font-size: 17px; }
.m-lead.wallet { color: #a50064; background: #fdeaf4; }
.m-main { min-width: 0; display: grid; }
.m-main b, .m-main small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-main b { font-size: 14px; font-weight: 600; }
.m-main small { color: #73829a; font-size: 12px; }
.m-side { display: grid; gap: 4px; justify-items: end; text-align: right; }
.m-side b { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m-pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; color: #758296; }
.m-pager button { height: 44px; padding: 0 16px; background: #fff; border: 1px solid var(--line); border-radius: 11px; font-weight: 600; }
.m-pager button:disabled { color: #b8c1cc; background: var(--soft); }

const BANK_NAMES={VCB:'Vietcombank',BIDV:'BIDV',VTB:'VietinBank',AGR:'Agribank',MB:'MB Bank',TCB:'Techcombank',EIB:'Eximbank',VPB:'VPBank',IVB:'Indovina Bank'};
function bankLogo_(name,size='normal'){const k=bankKey_(name),L=BANK_LOGOS[k],alt=esc(BANK_NAMES[k]||name||'Ngân hàng');if(size==='full')return L?'<img class="bank-wordmark" src="'+L.f+'" alt="'+alt+'">':'';if(L)return'<span class="bank-logo '+(size==='small'?'small':'')+'" title="'+alt+'"><i class="bl bl-'+k+'" role="img" aria-label="'+alt+'"></i></span>';const logos={
 BIDV:'<svg viewBox="0 0 40 40"><path fill="#005baa" d="M20 2 38 20 20 38 2 20z"/><path fill="#e21f26" d="m20 9 11 11-11 11L9 20z"/><path fill="#fff" d="m20 14 6 6-6 6-6-6z"/></svg>',
 VCB:'<svg viewBox="0 0 40 40"><path fill="#087b3e" d="M3 8c7-5 27-5 34 0-4 14-10 23-17 29C13 31 7 22 3 8z"/><path fill="#fff" d="M10 10h7l3 9 3-9h7L20 29z"/></svg>',
 VTB:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#0068b5"/><circle cx="20" cy="20" r="10" fill="none" stroke="#e31e24" stroke-width="4"/><path stroke="#fff" stroke-width="3" d="M8 20h24"/></svg>',
 IVB:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#007b5e"/><path fill="#f7c844" d="M9 20 20 8l11 12-11 12z"/><circle cx="20" cy="20" r="6" fill="#fff"/></svg>',
 EIB:'<svg viewBox="0 0 40 40"><rect x="4" y="7" width="32" height="26" rx="7" fill="#1565a8"/><path stroke="#fff" stroke-width="4" d="M11 14h18M11 20h14M11 26h18"/></svg>',
 VPB:'<svg viewBox="0 0 40 40"><path fill="#d71920" d="M5 8h9l6 17 6-17h9L20 36z"/><path fill="#48a23f" d="M9 5h22l-4 7H13z"/></svg>',
 MB:'<svg viewBox="0 0 40 40"><path fill="#e11b22" d="m20 2 4 11 12-3-7 10 9 8-12-1-6 11-6-11-12 1 9-8-7-10 12 3z"/></svg>',
 AGR:'<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="5" fill="#a71930"/><path stroke="#f3d22b" stroke-width="4" d="M6 31 31 6"/><path stroke="#087b66" stroke-width="5" d="M10 36 36 10"/></svg>',
 TCB:'<svg viewBox="0 0 40 40"><path fill="#ed1c24" d="m3 20 9-10 9 10-9 10zm16 0 9-10 9 10-9 10z"/></svg>',
 BANK:'<svg viewBox="0 0 40 40"><path fill="#2b6cb0" d="M20 3 37 12v4H3v-4zM6 19h5v12H6zm12 0h5v12h-5zm11 0h5v12h-5zM3 34h34v4H3z"/></svg>'};return'<span class="bank-logo '+(size==='small'?'small':'')+'" title="'+esc(name||'Ngân hàng')+'">'+logos[k]+'</span>'}
const isNum_=k=>{const c=mod();return(c.amounts||[]).includes(k)||(c.percents||[]).includes(k)||k==='TONG_THANH_TOAN'};
function rowBank_(k,r){if(!r||!k)return'';if(k==='MA')return r.LOAI_DANH_MUC==='NGAN_HANG'?txt(r.MA):'';if(k==='MA_NGAN_HANG')return txt(r.MA_NGAN_HANG);return txt(r['_NH_'+k])}
function knownBank_(v){return!!v&&bankKey_(v)!=='BANK'}
function bankName_(v){return BANK_NAMES[bankKey_(v)]||txt(v)}
function refName_(k,r){if(k==='MA_NGAN_HANG')return bankName_(r[k]);if(k==='MA_KHOAN_VAY')return r._TEN_KHOAN_VAY||loanOf_(r[k],r).TEN_KHOAN_VAY||txt(r[k]);if(/^MA_TAI_KHOAN/.test(k))return r['_TEN_'+k]||txt(r[k]);return txt(r[k])}
function bankCell_(k,r){const code=rowBank_(k,r),name=refName_(k,r),raw=txt(r[k]);return'<div class="bank-loan">'+bankLogo_(code)+'<div class="loan-cell"><b>'+esc(name)+'</b>'+(name!==raw&&k!=='MA_NGAN_HANG'?'<span>'+esc(raw)+'</span>':'')+'</div></div>'}
function detailBank_(r){const lead=txt((((S.data.uiModules||{})[S.module]||{}).card||{}).lead),m=lead.match(/^bank:(.+)$/);return m?rowBank_(m[1],r):''}
function detailVal_(k,r){const b=rowBank_(k,r);if(knownBank_(b))return bankLogo_(b,'small')+'<span class="bank-name">'+esc(refName_(k,r))+'</span>';return format(k,r[k])}
const STATUS_LABELS={NHAP:'Nháp',CHO_DUYET:'Chờ duyệt',DA_DUYET:'Đã duyệt',DA_THUC_HIEN:'Đã thực hiện',HOAN_THANH:'Hoàn thành',HUY:'Hủy',HOAT_DONG:'Hoạt động',NGUNG_HOAT_DONG:'Ngừng hoạt động',DU_KIEN:'Dự kiến',GIAI_NGAN_MOT_PHAN:'Giải ngân một phần',DA_GIAI_NGAN:'Đã giải ngân',KHONG_THUC_HIEN:'Không thực hiện',DANG_VAY:'Đang vay',DA_TAT_TOAN:'Đã tất toán',TAM_DUNG:'Tạm dừng',DEN_HAN:'Đến hạn',DA_TRA_MOT_PHAN:'Đã trả một phần',DA_THANH_TOAN:'Đã thanh toán',QUA_HAN:'Quá hạn',MOI:'Mới',THANH_TOAN_MOT_PHAN:'Thanh toán một phần',APPROVE:'Duyệt',REJECT:'Từ chối',SUBMIT:'Trình duyệt',CREATE:'Tạo mới',UPDATE:'Cập nhật',HUY_BAN_GHI:'Hủy bản ghi',XOA:'Xóa'};
function statusLabel_(v){return STATUS_LABELS[txt(v)]||txt(v).replaceAll('_',' ')}
function pillClass_(v){v=txt(v);return/HUY|QUA_HAN|NGUNG|TAM_DUNG|KHONG_THUC_HIEN|REJECT|DELETE|^XOA/.test(v)?'bad':/MOT_PHAN|CHO_|DU_KIEN|DEN_HAN|^NHAP$|^MOI$|SUBMIT/.test(v)?'warn':/DA_|HOAN_THANH|HOAT_DONG|APPROVE/.test(v)?'good':/DANG_VAY|CREATE|UPDATE/.test(v)?'info':''}
function plain_(h){return txt(h).replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')}
function initials_(v){return txt(v).replace(/[_\-.@]/g,' ').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'•'}
function cell_(k,r){let value=r[k],body;if(S.module==='LICH_TRA_NO'&&k==='MA_LICH_TRA')body='<span class="row-code-icon">▤</span><b>'+esc(value)+'</b>';else if(S.module==='LICH_TRA_NO'&&k==='MA_KHOAN_VAY'){const l=loanOf_(value,r);body='<div class="bank-loan">'+bankLogo_(l.MA_NGAN_HANG)+'<div class="loan-cell"><b>'+esc(l.MA_NGAN_HANG?bankName_(l.MA_NGAN_HANG):'Khoản vay')+'</b><span>'+esc(l.TEN_KHOAN_VAY||value)+'</span><small>'+esc(l.SO_HOP_DONG||'Dữ liệu tạm')+'</small></div></div>'}else if(k==='TONG_THANH_TOAN')body='<b>'+money(dueTotal_(r))+' ₫</b>';else if(knownBank_(rowBank_(k,r)))body=bankCell_(k,r);else body=format(k,value);return'<td'+(isNum_(k)?' class="num"':'')+' title="'+esc(txt(value))+'">'+body+'</td>'}

/* ===== V5.7 · Lịch trả nợ: Đồng bộ dư nợ khoản vay + Nhập từ file ===== */
const vnd_=v=>money(v)+' ₫',sgn_=v=>(v>0?'+':v<0?'−':'')+money(Math.abs(v))+' ₫',neg_=v=>v?'−'+money(v)+' ₫':'0 ₫';
function loanCell_(bank,name,sub){return'<div class="copy-loan">'+bankLogo_(bank,'small')+'<span><b>'+esc(name)+'</b><br><small>'+esc(sub)+'</small></span></div>'}
function dlgShell_(id,title,sub,bodyHtml,footHtml,scroll){document.getElementById('modal').innerHTML='<div class="modal-bg dialog-bg"><form id="'+id+'" class="copy-dialog"><div class="modal-head"><div><b>'+title+'</b><div class="sub">'+sub+'</div></div><button type="button" class="btn icon" data-close>×</button></div><div class="copy-body'+(scroll?' scroll':'')+'">'+bodyHtml+'</div><div class="modal-foot">'+footHtml+'</div></form></div>';document.querySelectorAll('#modal [data-close]').forEach(b=>b.onclick=closeForm)}

/* ---------- Đồng bộ dư nợ (tháng chốt, theo gốc phải trả) ---------- */
const SY={period:'',months:[],latest:'',cutoff:'',rows:[],sel:{},done:null,loading:false};
function periodVi_(p){const x=String(p||'').split('-');return x.length===2?x[1]+'/'+x[0]:''}
function openDebtSync_(){SY.period='';SY.sel={};SY.done=null;loadDebtSync_()}
function loadDebtSync_(){SY.loading=true;drawDebtSync_();api('getDebtSyncPreview',[SY.period],r=>{SY.loading=false;SY.period=r.period;SY.months=r.months||[];SY.latest=r.latest;SY.cutoff=r.cutoff;SY.rows=r.rows||[];SY.rows.forEach(x=>{if(!(x.id in SY.sel))SY.sel[x.id]=!x.skip});drawDebtSync_()},()=>{SY.loading=false;drawDebtSync_()})}
function syPick_(){const s=SY.rows.filter(r=>!r.skip&&SY.sel[r.id]);return{s,n:s.length,b:s.reduce((n,r)=>n+r.current,0),a:s.reduce((n,r)=>n+r.newBalance,0)}}
function syWarn_(r){return r.skip?'<span class="pill">'+esc(r.skip)+'</span>':r.warnings.length?r.warnings.map(w=>'<span class="pill '+w[0]+'">'+esc(w[1])+'</span>').join(' '):'<span class="pill good">Đủ kỳ đã trả</span>'}
function syLast_(r){return r.lastId?esc(r.lastId)+' · '+viDate_(r.lastDate):'—'}
function drawDebtSync_(){
 const mob=S.device==='mobile',p=syPick_();let h;

function parseCsv_(text){const t=String(text||'').replace(/^\ufeff/,''),grid=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);grid.push(row);row=[];cur=''}else cur+=ch}if(cur!==''||row.length){row.push(cur);grid.push(row)}return grid}

 const match=(r,cond,neg)=>{if(!cond)return true;return Object.keys(cond).every(k=>{const want=[].concat(cond[k]).map(String),hit=want.indexOf(String(r[k]==null?'':r[k]))>=0;return neg?!hit:hit})};

  if(m.diff){value=(out[m.diff[0]]?out[m.diff[0]].value:0)-(out[m.diff[1]]?out[m.diff[1]].value:0);isMoney=!!(out[m.diff[0]]&&out[m.diff[0]].money)}
  else if(m.add){value=m.add.reduce((n,i)=>n+(out[i]?out[i].value:0),0);isMoney=m.add.some(i=>out[i]&&out[i].money)}
  else{const list=rows.filter(r=>match(r,m.where,false)&&(!m.not||match(r,m.not,true)));
   if(m.firstBy||m.lastBy){const o=m.firstBy||m.lastBy,last=!!m.lastBy,pick={};list.forEach(r=>{const g=String(r[o.group]==null?'':r[o.group]),k=String(r[o.order]==null?'':r[o.order]);if(!Object.prototype.hasOwnProperty.call(pick,g)||(last?k>=pick[g].k:k<pick[g].k))pick[g]={k:k,v:Number(r[o.field])||0}});value=Object.keys(pick).reduce((n,g)=>n+pick[g].v,0);isMoney=true}
   else if(m.sum){const fs=[].concat(m.sum);value=list.reduce((n,r)=>fs.reduce((x,f)=>x+(Number(r[f])||0),n),0);isMoney=true}else value=list.length}

/* --- Tải trước các phân hệ hay dùng + danh mục cho form (chạy ngầm, lần lượt) --- */
function startPrefetch_(){
 if(S.prefetchOn)return;S.prefetchOn=true;
 const queue=PREFETCH_ORDER.filter(k=>S.data.modules[k]&&isLocal_(k));
 const next=()=>{const k=queue.shift();if(!k){prefetchLookups_();return}if(S.store[k]){next();return}fetchModule_(k,false,true,()=>setTimeout(next,150))};
 setTimeout(next,600);
}
function prefetchLookups_(){google.script.run.withSuccessHandler(l=>{S.data.lookups=Object.assign(S.data.lookups||{},l||{});Object.keys(S.data.modules).forEach(k=>S.lookupLoaded[k]=true)}).withFailureHandler(()=>{}).getAllLookups()}

/* --- Ghi dữ liệu: 1 lần gọi, nhận luôn dữ liệu mới --- */
function mutate_(fn,args,ok,fail){const k=S.module;api('mutateAndFetch',[fn,args,isLocal_(k)?k:''],r=>{busy(false);markAllStale_();S.lookupLoaded={};if(r&&r.data)storePut_(k,r.data);setTimeout(prefetchLookups_,400);ok&&ok(r?r.result:null)},fail)}

function isPhone_(){const vw=Math.min(window.innerWidth||9999,document.documentElement.clientWidth||9999),sw=(window.screen&&screen.width)||9999,coarse=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);return vw<850||(coarse&&sw<850)}

/* --- Trang dữ liệu: tiêu đề · dải tháng (LTN) · tác vụ + nhãn lọc · KPI · thẻ --- */
function mobileCard_(r,i,c,card){
 const parts=txt(card.lead||'text:'+c.idField).split(':'),kind=parts[0],f=parts[1];let lead;
 if(kind==='bank'){const b=rowBank_(f,r)||(f==='MA_KHOAN_VAY'?txt(loanOf_(r.MA_KHOAN_VAY,r).MA_NGAN_HANG):'');lead=knownBank_(b)?bankLogo_(b):r.LOAI_TAI_KHOAN==='TIEN_MAT'?'<span class="m-lead cash">₫</span>':r.LOAI_TAI_KHOAN==='VI_DIEN_TU'?'<span class="m-lead wallet">◫</span>':'<span class="m-lead">'+esc(initials_(r[f]||c.title))+'</span>'}
 else if(kind==='type'){const v=txt(r[f]),cls=/CHUYEN|NOI_BO/.test(v)?'mv':/PHAI_TRA|^CHI$/.test(v)?'out':/THU/.test(v)?'in':'';lead='<span class="m-lead '+cls+'">'+({in:'↓',out:'↑',mv:'⇄'}[cls]||'•')+'</span>'}
 else lead='<span class="m-lead">'+esc(initials_(r[f]))+'</span>';
 const tk=card.title||c.idField,title=(knownBank_(rowBank_(tk,r))||tk==='MA_KHOAN_VAY'||/^MA_TAI_KHOAN/.test(tk)?refName_(tk,r):txt(r[tk]))||txt(r[c.idField]);
 const sub=(card.sub||[]).map(k=>{const v=r[k];if(v===''||v==null)return'';if(k==='MA_KHOAN_VAY'){const l=loanOf_(v,r);return[l.MA_NGAN_HANG?bankName_(l.MA_NGAN_HANG):'',l.SO_HOP_DONG||v].filter(Boolean).join(' · ')}if(/^MA_TAI_KHOAN/.test(k))return refName_(k,r);if(isNum_(k))return lab(k)+': '+plain_(format(k,v));return plain_(format(k,v)).replaceAll('_',' ')}).filter(x=>x&&x!=='—').join(' · ');
 const amount=card.amount==='TONG_THANH_TOAN'?money(dueTotal_(r))+' ₫':card.amount&&txt(r[card.amount])!==''?plain_(format(card.amount,r[card.amount])):'';
 const date=card.date&&txt(r[card.date])!==''?(((c.dates||[]).includes(card.date)?'📅 ':'')+plain_(format(card.date,r[card.date]))):'';
 const sk=card.status||'TRANG_THAI',status=txt(r[sk])?format('TRANG_THAI',r[sk]):'';
 return'<button type="button" class="m-card'+(S.detailSheet&&i===S.selected?' selected':'')+'" data-select="'+i+'">'+lead+'<span class="m-main"><b>'+esc(title)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+(date?'<small>'+esc(date)+'</small>':'')+'</span><span class="m-side">'+(amount?'<b>'+esc(amount)+'</b>':'')+status+'</span></button>';
}
function mLtnNav_(result){if(S.module!=='LICH_TRA_NO')return'';return S.q?'<div class="m-mnav"><span class="sub">Tìm “'+esc(S.q)+'” trên mọi tháng · '+(result.total||0)+' kỳ</span><button type="button" class="mnav-chip" data-clearq>× Xóa</button></div>':'<div class="m-mnav">'+ltnChips_(true)+'</div>'}
function renderMobileModule_(){
 if(ltnAutoJump_())return;
 mOn_();mTop_();
 const c=mod(),rs=records(),result=S.result||{total:rs.length,pages:1},card=uiOf_().card||{},p=S.data.permissions||{},pages=Math.max(1,result.pages||1),canWrite=p.write&&!c.readOnly,ltn=S.module==='LICH_TRA_NO';
 S.page=Math.min(Math.max(1,S.page),pages);S.selected=Math.min(Math.max(0,S.selected),Math.max(0,rs.length-1));
 const w=document.getElementById('workspace');document.querySelector('.content').classList.add('module-view');w.className='mobile-workspace';document.title=c.title+' · QL_TC_2026';
 const metrics=Array.isArray(result.metrics)?result.metrics:[];
 let h='<div class="m-head"><div class="m-title">'+esc(moduleTitle_(c))+'</div><span class="count-badge">'+(result.total||0)+' '+(ltn?'kỳ trả':'bản ghi')+'</span>'+(c.readOnly?'<span class="pill">Chỉ xem</span>':'')+'</div>';
 h+=mLtnNav_(result);
 const tools=(ltn&&p.write?'<button type="button" class="m-chip brand" id="copyMonthAction">▣ Tạo tháng mới</button><button type="button" class="m-chip brand" id="importAction">⇪ Nhập file</button><button type="button" class="m-chip brand" id="syncDebtAction">⟳ Đồng bộ dư nợ</button>':'')+mFilterPills_();

 if(metrics.length)h+='<div class="m-sum">'+metrics.map(m=>'<div><small>'+esc(m.label)+'</small><b>'+money(m.value)+(m.money?' ₫':'')+'</b></div>').join('')+'</div>';
 const items=rs.length?mListItems_(rs,c,card):[],first=items.slice(0,M_CHUNK).join('');
 h+=rs.length?'<div class="m-list">'+first+'</div>'+(items.length>M_CHUNK?'<div class="m-more" id="mMore">Đang hiện '+Math.min(M_CHUNK,items.length)+' / '+items.length+' mục…</div>':''):'<div class="empty">Chưa có dữ liệu phù hợp.</div>';
 if(pages>1)h+='<div class="m-pager"><button type="button" data-page="'+(S.page-1)+'"'+(S.page<=1?' disabled':'')+'>‹ Trước</button><span>'+S.page+' / '+pages+'</span><button type="button" data-page="'+(S.page+1)+'"'+(S.page>=pages?' disabled':'')+'>Sau ›</button></div>';
 w.innerHTML=h;bindCommon_(w);bindLtnNav_(w);mBindPills_(w);
 mBindCards_(w);mMoreWatch_(w,items);

/* --- Danh sách vẽ dần: 40 thẻ đầu, cuộn tới đâu vẽ thêm tới đó --- */
const M_CHUNK=40;
function mListItems_(rs,c,card){const out=[];if(S.module==='LICH_TRA_NO'&&S.q){const cnt={};rs.forEach(r=>{const p=String(r.NGAY_DEN_HAN||'').slice(0,7);cnt[p]=(cnt[p]||0)+1});let last='';rs.forEach((r,i)=>{const p=String(r.NGAY_DEN_HAN||'').slice(0,7);if(p!==last){out.push('<div class="m-group">Tháng '+periodVi_(p)+' · '+cnt[p]+' kỳ</div>');last=p}out.push(mobileCard_(r,i,c,card))})}else rs.forEach((r,i)=>out.push(mobileCard_(r,i,c,card)));return out}
function mBindCards_(scope){scope.querySelectorAll('[data-select]').forEach(b=>{if(!b._b){b._b=1;b.onclick=()=>mOpenSheet_(+b.dataset.select)}})}
function mMoreWatch_(w,items){if(w._io){w._io.disconnect();w._io=null}const more=document.getElementById('mMore');if(!more)return;let shown=M_CHUNK;const list=w.querySelector('.m-list');
 const step=()=>{if(shown>=items.length)return;list.insertAdjacentHTML('beforeend',items.slice(shown,shown+M_CHUNK).join(''));shown=Math.min(items.length,shown+M_CHUNK);mBindCards_(list);if(shown>=items.length){more.remove();if(w._io){w._io.disconnect();w._io=null}}else more.textContent='Đang hiện '+shown+' / '+items.length+' mục…'};
 if('IntersectionObserver' in window){w._io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))step()},{root:w,rootMargin:'600px'});w._io.observe(more)}else while(shown<items.length)step()}
/* --- Bảng chi tiết: mở/đóng mà không vẽ lại danh sách --- */

/* --- Đáy & mép màn hình: ☰ Menu (dưới trái) + tab Lọc (giữa mép trái) --- */

 if(sts.length)b+='<div class="m-fsec"><h5>Trạng thái</h5><div class="m-fchips">'+radio('status','ALL','Tất cả',!S.status||S.status==='ALL')+sts.map(x=>radio('status',x,statusLabel_(x),S.status===x)).join('')+'</div></div>';

 const m=document.getElementById('modal');
 m.innerHTML='<div class="modal-bg m-filter-bg"><form id="mFilterForm" class="m-filter-dialog"><div class="m-grab"></div><div class="m-fhead"><span class="m-fico">'+M_FUNNEL+'</span><div><b>Bộ lọc · '+esc(c.title)+'</b><div class="sub">Đang hiển thị '+total+' '+(ltn?'kỳ trả':'bản ghi')+'</div></div><button type="button" class="m-close" data-fclose aria-label="Đóng">×</button></div><div class="m-fbody">'+b+'</div><div class="m-ffoot"><button type="button" class="btn" id="mFilterClear">Xóa bộ lọc</button><button class="btn primary">Áp dụng</button></div></form></div>';
