# Bản dự phòng trên Cloudflare Workers (worker "philong"). Production vẫn chạy trên Vercel, file này không ảnh hưởng Vercel.
# Cần 2 secret trong GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN           token Cloudflare mẫu "Edit Cloudflare Workers"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  anon key Supabase (giống bên Vercel)
# Các khóa chạy (SUPABASE_SERVICE_ROLE_KEY, DRIVE_UPLOAD_URL, DRIVE_UPLOAD_TOKEN, CRON_SECRET, R2_*) nhập trong
# Cloudflare Dashboard → Workers → philong → Settings → Variables and Secrets (wrangler giữ nguyên nhờ keep_vars).
name: Deploy Cloudflare (philong)

on:
  push:
    branches: [claude/r2-storage]
  workflow_dispatch:

concurrency:
  group: cloudflare-philong
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 663a898141695ef68d7c25780e140c4d
      NEXT_PUBLIC_SUPABASE_URL: https://zycbzywgvpcdxqfvhwbp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Kiểm tra secret
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Chưa có secret CLOUDFLARE_API_TOKEN hoặc NEXT_PUBLIC_SUPABASE_ANON_KEY - bỏ qua deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.ok == 'true'
      - name: Build (OpenNext)
        if: steps.check.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: npx opennextjs-cloudflare deploy
