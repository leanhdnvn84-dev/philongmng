<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Thiệp mời Gala Nguyễn Hiền 2000 – 2003</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@700&family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Thiệp A5 dọc (148 × 210 mm) phong cách sang trọng: giấy ngà, khung vàng kiểu art-deco, xanh ngọc lục bảo của trường, nhành phượng nhỏ. 2 trang: mời bạn · mời Thầy/Cô */
@page{size:148mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#cfd8d3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
@media print{body{padding:0;gap:0;background:none}}
:root{--vang:#B08A3E;--vang2:#D8B76A;--xanh:#0E5A43;--xanh2:#2E9A6E;--chu:#2A3B33;--do:#A8402E}
.tr{font-variant-numeric:lining-nums;position:relative;width:148mm;height:210mm;overflow:hidden;color:var(--chu);font-family:'Cormorant Garamond',serif;break-after:page;
 background:radial-gradient(ellipse 90% 70% at 50% 35%,#FFFDF6 0%,#FBF5E6 60%,#F3EAD3 100%)}
.tr:last-child{break-after:auto}
.tr .dai{position:absolute;left:0;right:0;height:3.2mm;background:linear-gradient(90deg,#0E5A43,#2E9A6E 50%,#0E5A43)}
.tr .dai.t{top:0}.tr .dai.d{bottom:0}
.tr svg.khung{position:absolute;left:0;top:0;width:148mm;height:210mm}
.nd{position:absolute;inset:0;padding:15mm 17mm 13mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:13mm;height:13mm;border-radius:50%;background:#fff;padding:.9mm;box-shadow:0 0 0 .35mm var(--vang),0 0 0 1.1mm #FBF5E6,0 0 0 1.35mm var(--vang2)}
.logo img{width:100%;height:100%;display:block}
.truong{margin-top:3.2mm;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:2.35mm;letter-spacing:1.05mm;color:var(--xanh)}
.ke{display:flex;align-items:center;gap:2mm;margin-top:2.6mm;width:62mm}
.ke i{flex:1;height:.25mm;background:linear-gradient(90deg,transparent,var(--vang))}
.ke i:last-child{background:linear-gradient(270deg,transparent,var(--vang))}
.ke b{width:1.8mm;height:1.8mm;transform:rotate(45deg);background:var(--vang)}
.nho{margin-top:4mm;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:2.4mm;letter-spacing:1.2mm;color:var(--vang)}
h1{font-family:'Dancing Script',cursive;font-weight:700;font-size:15.5mm;line-height:1.05;margin-top:1mm;color:var(--xanh)}
.gala{margin-top:1.5mm;font-family:'Playfair Display',serif;font-weight:700;font-size:4.6mm;letter-spacing:1.1mm;color:var(--chu)}
.nk{margin-top:1.6mm;font-style:italic;font-weight:600;font-size:4.2mm;color:var(--vang)}
.moi{margin-top:6mm;width:100%}
.moi .l{font-style:italic;font-weight:500;font-size:4mm;color:var(--chu)}
.moi .ten{margin:1.5mm auto 0;width:84%;height:7.5mm;border-bottom:.3mm solid var(--vang2);position:relative}
.moi .ten::after{content:"";position:absolute;left:50%;bottom:-1.1mm;width:2mm;height:2mm;transform:translateX(-50%) rotate(45deg);background:#FBF5E6;border:.3mm solid var(--vang2)}
.moi .lop{margin-top:2.6mm;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:2.7mm;letter-spacing:.5mm;color:var(--xanh)}
.moi .lop span{display:inline-block;width:14mm;border-bottom:.3mm solid var(--vang2);height:4mm;vertical-align:bottom}
.loi{margin-top:5mm;font-style:italic;font-weight:500;font-size:4.05mm;line-height:1.55;color:#3A4A42;padding:0 1mm}
.tg{margin-top:6mm;width:100%;display:grid;grid-template-columns:1fr 1fr 1.3fr;align-items:start}
.tg>div{padding:0 2mm}
.tg>div+div{border-left:.25mm solid var(--vang2)}
.tg small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:2.15mm;letter-spacing:.8mm;color:var(--vang)}
.tg b{display:block;margin-top:1.2mm;font-family:'Playfair Display',serif;font-weight:700;font-size:6.2mm;line-height:1.05;color:var(--xanh)}
.tg span{display:block;margin-top:.8mm;font-size:3.4mm;font-weight:600;color:var(--chu)}
.tg .o{display:block;margin:2.2mm auto 0;width:92%;border-bottom:.25mm dotted #9AA79F;height:4.5mm}
.dg{margin-top:6mm;font-size:3.5mm;line-height:1.5;color:#3A4A42}
.dg b{font-family:'Playfair Display',serif;font-weight:700;color:var(--do);font-size:4.2mm}
.dg em{display:block;font-size:3.2mm;color:#5A6A62}
.cau{margin-top:6.5mm;font-style:italic;font-weight:600;font-size:4.4mm;line-height:1.45;color:var(--do)}
.chan{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;text-align:left}
.bll .t{font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:2.05mm;letter-spacing:.7mm;color:var(--vang);margin-bottom:1mm}
.bll div{font-size:3.25mm;line-height:1.45;color:var(--chu)}
.bll div b{font-weight:700;color:var(--xanh)}
.kyb{text-align:right}
.kyb span{display:block;font-family:'Dancing Script',cursive;font-size:5.6mm;color:var(--xanh);line-height:1}
.kyb b{display:block;margin-top:1.2mm;font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:2.15mm;letter-spacing:.7mm;color:var(--vang)}
</style></head>
<body>
<section class="tr" id="ban"></section>
<section class="tr" id="thay"></section>
<script>
const GM={gio:'17h00',thu:'Thứ Bảy',ngay:'14 . 11',nam:'2026',dongGop:'700.000đ',gom:'gồm áo kỷ niệm, suất tiệc, hoa và quà tri ân thầy cô',han:'25/10/2026',
 loiBan:'Mười hai lớp, một mái trường. Cùng về gặp lại thầy cô chủ nhiệm, tìm lại bạn bè và viết tiếp kỷ niệm của khoá mình nhé!',
 loiThay:'Hai mươi ba năm đã qua kể từ ngày chúng em rời mái trường Nguyễn Hiền. Ban liên lạc niên khoá 2000 – 2003 trân trọng kính mời Thầy/Cô về dự đêm Gala gặp mặt, để học trò được gặp lại, tri ân và ôn lại những kỷ niệm dưới mái trường xưa.'};
const BLL=[['Lê Trung Hiếu','0905 394 493'],['Hoàng Diệu Thúy','0905 865 867'],['Nguyễn Thị Tuyết Mai','0905 516 896']];
/* Nhà hàng chưa chốt → dòng chấm ghi tay; có tên thì điền NHA_HANG / DIA_CHI rồi xuất lại */
const NHA_HANG='',DIA_CHI='';
const W=559,H=794,V='#B08A3E',V2='#D8B76A';
function goc(sx,sy){const X=x=>sx<0?W-x:x,Y=y=>sy<0?H-y:y,t=(x,y)=>X(x)+' '+Y(y);return `
<path d="M${t(30,92)} L${t(30,44)} Q${t(30,30)} ${t(44,30)} L${t(92,30)}" stroke="${V}" stroke-width="1.6" fill="none"/>
<path d="M${t(37,74)} L${t(37,51)} Q${t(37,37)} ${t(51,37)} L${t(74,37)}" stroke="${V2}" stroke-width=".8" fill="none"/>
<circle cx="${X(44)}" cy="${Y(44)}" r="2.6" fill="${V}"/>
${[0,1,2].map(i=>`<circle cx="${X(100+i*7)}" cy="${Y(30)}" r="${1.5-i*.4}" fill="${V}"/><circle cx="${X(30)}" cy="${Y(100+i*7)}" r="${1.5-i*.4}" fill="${V}"/>`).join('')}`}
let s=11;const rd=()=>{s=(s*16807)%2147483647;return s/2147483647};
function hoa(x,y,k,r,mau){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${k})">`+[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-12" rx="7" ry="12" fill="${a===0?'#E9C46A':mau}" transform="rotate(${a})"/>`).join('')+`<circle r="3.4" fill="#F6DFA0"/></g>`}
function cuong(x1,y1,x2,y2,n,mau){let g=`<path d="M${x1} ${y1} Q ${(x1+x2)/2+10} ${(y1+y2)/2-12} ${x2} ${y2}" stroke="#6F7F5A" stroke-width="1.3" fill="none"/>`;
 for(let i=1;i<=n;i++){const t=i/(n+1),x=x1+(x2-x1)*t,y=y1+(y2-y1)*t-6;g+=`<ellipse cx="${x}" cy="${y-4}" rx="2.4" ry="5" fill="${mau}" transform="rotate(-35 ${x} ${y-4})"/><ellipse cx="${x}" cy="${y+4}" rx="2.4" ry="5" fill="${mau}" transform="rotate(35 ${x} ${y+4})"/>`}return g}
function nhanh(x,y,lat,quay){let g=`<g transform="translate(${x} ${y}) scale(${lat} 1) rotate(${quay})">`;
 g+=cuong(0,0,-120,26,9,'#5E9C6E')+cuong(-30,6,-90,-30,6,'#7DB287')+cuong(-60,14,-110,60,6,'#5E9C6E');
 [[-8,-4,1],[-22,8,.85],[-6,14,.7],[-34,-6,.65],[-18,-14,.6]].forEach(([a,b,k],i)=>g+=hoa(a,b,k,rd()*360,['#C8372D','#D9472F','#B8322A'][i%3]));
 return g+'</g>'}
const khung=()=>`<svg class="khung" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
<rect x="22" y="22" width="${W-44}" height="${H-44}" fill="none" stroke="${V}" stroke-width="1.1"/>
${goc(1,1)}${goc(-1,1)}${goc(1,-1)}${goc(-1,-1)}
${nhanh(W-40,64,1,8)}${nhanh(40,64,-1,8)}
</svg>`;
const bll=()=>BLL.map(x=>`<div><b>${x[0]}</b> · ${x[1]}</div>`).join('');
function trang(ban){return `<div class="dai t"></div><div class="dai d"></div>${khung()}<div class="nd">
 <div class="logo"><img src="logo-1600.png" alt=""></div>
 <div class="truong">TRƯỜNG THPT NGUYỄN HIỀN · ĐÀ NẴNG</div>
 <div class="ke"><i></i><b></b><i></i></div>
 <div class="nho">${ban?'THÂN MỜI BẠN VỀ DỰ':'TRÂN TRỌNG KÍNH MỜI'}</div>
 <h1>${ban?'Về đi bạn ơi!':'Thư mời'}</h1>
 <div class="gala">GALA GẶP MẶT CỰU HỌC SINH</div>
 <div class="nk">Niên khoá 2000 – 2003</div>
 <div class="moi"><div class="l">${ban?'Thân gửi bạn':'Kính gửi'}</div><div class="ten"></div>${ban?'<div class="lop">LỚP 12/<span></span></div>':''}</div>
 <p class="loi">${ban?GM.loiBan:GM.loiThay}</p>
 <div class="tg"><div><small>THỜI GIAN</small><b>${GM.gio}</b><span>chiều</span></div><div><small>NGÀY</small><b>${GM.ngay}</b><span>${GM.thu} · ${GM.nam}</span></div><div><small>ĐỊA ĐIỂM</small>${NHA_HANG?`<span>${NHA_HANG}</span><span>${DIA_CHI}</span>`:'<span class="o"></span><span class="o"></span>'}</div></div>
 ${ban?`<div class="dg">Đóng góp <b>${GM.dongGop}</b> / người<em>(${GM.gom}) · xác nhận trước ${GM.han}</em></div>`
 :`<div class="cau">“Hai mươi ba năm – Một mái trường –<br>Mười hai tập thể – Một đại gia đình”</div>`}
 <div class="chan"><div class="bll"><div class="t">${ban?'BAN LIÊN LẠC':'LIÊN HỆ BAN LIÊN LẠC'}</div>${bll()}</div><div class="kyb"><span>${ban?'Hẹn gặp cả khoá!':'Thay mặt Ban liên lạc'}</span><b>KHOÁ 2000 – 2003</b></div></div>
</div>`}
document.getElementById('ban').innerHTML=trang(true);document.getElementById('thay').innerHTML=trang(false);
</script>
</body></html>
