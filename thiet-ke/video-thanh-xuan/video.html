<!doctype html><html lang="vi"><head><meta charset="utf-8">
<title>Clip EDM – Thanh Xuân Không Có Tuổi</title>
<!-- Clip EDM 1920×1080 cho bài Suno "Nguyễn Hiền Quẩy Lên". ve(t) vẽ khung tại giây t (không CSS animation) để render.js chụp từng khung.
     loi.js = mốc lời theo giọng hát thật (canh-loi.py) · nhip.js = năng lượng trống/giữa/cao mỗi khung 1/25 giây (nhip.py) → đèn, sàn, cột sóng nháy theo nhạc. ?t=giây xem 1 khung. -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,600;0,800;0,900;1,900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07021A}
.k{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;background:radial-gradient(90% 70% at 50% 38%,#2A0B5E 0%,#12053A 45%,#07021A 100%)}
.ab{position:absolute}
#hao{inset:0;background:radial-gradient(60% 45% at 50% 40%,var(--c1),transparent 70%);mix-blend-mode:screen;opacity:.5}
/* tia laser */
#laser{inset:0;mix-blend-mode:screen}
#laser i{position:absolute;top:-40px;width:10px;height:1700px;transform-origin:50% 0;border-radius:6px;filter:blur(2px)}
/* sàn lưới neon */
#san{left:-600px;right:-600px;bottom:-40px;height:330px;perspective:600px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%)}
#san b{position:absolute;left:0;right:0;top:0;height:1400px;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(var(--c2) 3px,transparent 3px),linear-gradient(90deg,var(--c2) 3px,transparent 3px);background-size:120px 120px;opacity:.55}
#chantroi{left:0;right:0;bottom:285px;height:6px;background:var(--c2);box-shadow:0 0 30px 8px var(--c2);opacity:.8}
/* mặt trời neon sau logo */
#mt{left:50%;top:150px;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:linear-gradient(180deg,#FFD23F,#FF3EA5 55%,#7A2CFF);-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);opacity:.28;filter:blur(1px)}
/* cột sóng nhạc */
#eq{left:0;right:0;bottom:0;height:240px;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:0 60px}
#eq i{flex:1;max-width:26px;border-radius:6px 6px 0 0;background:linear-gradient(0deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--c2);opacity:.85}
/* cánh phượng neon */
#roi i{position:absolute;width:26px;height:20px;border-radius:60% 0 60% 0;background:radial-gradient(circle at 30% 30%,#FF8BC2,#FF2E7E);box-shadow:0 0 12px #FF2E7E;opacity:.9}
/* nháy theo trống */
#nay{inset:0;background:radial-gradient(70% 60% at 50% 45%,#fff,var(--c1) 40%,transparent 75%);mix-blend-mode:screen;opacity:0}
/* đầu trang */
#dau{left:0;right:0;top:28px;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff}
#dau img{width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 18px var(--c2)}
#dau{text-align:center}#dau p{font:800 24px 'Be Vietnam Pro';letter-spacing:.24em;text-shadow:0 0 14px var(--c2)}
#dau span{display:block;font:600 17px 'Be Vietnam Pro';letter-spacing:.2em;color:#FFD9F0;margin-top:3px}
/* logo trung tâm */
#vong{left:50%;top:175px;width:300px;height:300px;margin-left:-150px;border-radius:50%;border:8px solid var(--c2);box-shadow:0 0 40px var(--c2),inset 0 0 40px var(--c2)}
#vong2{left:50%;top:145px;width:360px;height:360px;margin-left:-180px;border-radius:50%;border:3px dashed var(--c1);opacity:.8}
#logo{left:50%;top:205px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(circle,#2A0B5E,#12053A);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 50px var(--c2),inset 0 0 30px var(--c1)}
#logo .t1{white-space:nowrap;font:italic 900 31px/1.15 'Be Vietnam Pro';color:#9CF6FF;text-shadow:0 0 12px #00E5FF;letter-spacing:.02em;padding-top:.2em}#logo .t2{font:800 20px/1.2 'Be Vietnam Pro';letter-spacing:.3em;color:#FFE6F6;margin-top:4px}
#logo b{font:italic 900 84px/1.15 'Be Vietnam Pro';padding-top:.12em;background:linear-gradient(180deg,#FFF,#00F0FF 45%,#FF3EA5);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px var(--c2));padding-right:.06em}

/* tiêu đề đầu / kết */
.tde{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0}
.tde .e{font:800 30px 'Be Vietnam Pro';letter-spacing:.4em;color:#9CF6FF;text-shadow:0 0 16px #00E5FF;margin-top:250px;margin-bottom:-10px}
.tde h1{font:italic 900 150px/1.25 'Be Vietnam Pro';padding:.32em 20px .12em;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;
 background:linear-gradient(90deg,#00F0FF,#FF3EA5,#FFD23F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,62,165,.7))}
.tde h1 small{display:block;font-size:.62em;line-height:1.2;margin-top:.22em}
.tde .p{font:700 30px 'Be Vietnam Pro';letter-spacing:.14em;color:#FFE6F6;margin-top:18px}
.tde .tg{margin-top:24px;font:700 30px 'Be Vietnam Pro';letter-spacing:.08em;color:#FFE27A;text-shadow:0 0 14px #FF8A00}
.tde .nk{display:inline-block;margin-top:18px;font:800 26px 'Be Vietnam Pro';letter-spacing:.16em;color:#12053A;background:linear-gradient(90deg,#00F0FF,#FFD23F);border-radius:40px;padding:10px 34px}
/* lời */
#loi{left:60px;right:60px;top:560px;text-align:center}
.dong{position:relative;display:inline-block;padding:0 .12em;font:italic 900 110px/1.3 'Be Vietnam Pro';text-transform:uppercase;white-space:nowrap;letter-spacing:.01em}
.dong .nen{color:rgba(255,255,255,.28);-webkit-text-stroke:2px rgba(255,255,255,.5)}
.dong .phu{position:absolute;left:.12em;top:0;background:linear-gradient(90deg,#00F0FF,#FF3EA5 60%,#FFD23F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,62,165,.8))}
#ke{margin-top:22px;font:800 40px/1.2 'Be Vietnam Pro';text-transform:uppercase;letter-spacing:.06em;color:rgba(200,240,255,.55);white-space:nowrap}
#tag{left:50%;top:505px;transform:translateX(-50%);font:900 22px 'Be Vietnam Pro';letter-spacing:.3em;text-transform:uppercase;color:#12053A;background:linear-gradient(90deg,#00F0FF,#FF3EA5);border-radius:30px;padding:8px 26px;box-shadow:0 0 22px #FF3EA5;white-space:nowrap}
.lang #san b{opacity:.2}
</style></head><body><div class="k" id="k">
<div class="ab" id="hao"></div><div class="ab" id="mt"></div><div class="ab" id="laser"></div>
<div class="ab" id="san"><b></b></div><div class="ab" id="chantroi"></div>
<div class="ab" id="eq"></div><div class="ab" id="roi"></div>
<div class="ab" id="vong2"></div><div class="ab" id="vong"></div><div class="ab" id="logo"><span class="t1">THANH XUÂN</span><span class="t2">KHÔNG CÓ</span><b>TUỔI</b></div>
<div class="ab" id="dau"><div><p>TRƯỜNG THPT NGUYỄN HIỀN</p><span>NIÊN KHOÁ 2000 – 2003 · GALA 14.11.2026</span></div></div>
<div class="ab tde" id="tieu"><p class="e">THPT NGUYỄN HIỀN · ĐÀ NẴNG</p><h1>Thanh xuân<small>không có tuổi!</small></h1><p class="p">GALA “NGÀY TRỞ VỀ” · NIÊN KHOÁ 2000 – 2003</p></div>
<div class="ab" id="tag"></div>
<div class="ab" id="loi"><div class="dong"><span class="nen" id="n"></span><span class="phu" id="f"></span></div><div id="ke"></div></div>
<div class="ab tde" id="ket"><p class="e">HẸN GẶP NHAU 14.11.2026</p><h1>Thanh xuân<small>không có tuổi!</small></h1><span class="nk">NIÊN KHOÁ 2000 – 2003</span><p class="tg" id="tg"></p></div>
<div class="ab" id="nay"></div>
</div>
<script src="loi.js"></script><script src="nhip.js"></script>
<script>
const SANG_TAC='Mr. Anh';
const L=window.LOI_T,N=window.NHIP;const T_KET=L[L.length-1].b,TONG=Math.max(window.TONG_NHAC||0,T_KET+8);
window.LOI=L;window.TONG=TONG;
const $=i=>document.getElementById(i),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),ss=x=>x*x*(3-2*x);
$('tg').innerHTML='Ý tưởng &amp; thực hiện: '+SANG_TAC;
/* bảng màu đổi theo đoạn */
const MAU=[['#FF2E9A','#00E5FF'],['#7A2CFF','#FF3EA5'],['#00C2FF','#FFD23F'],['#FF4D00','#FF2E9A'],['#00FFA3','#7A2CFF']];
const NE=48;$('eq').innerHTML='<i></i>'.repeat(NE);const EQ=[...$('eq').children];
const NL=8;$('laser').innerHTML='<i></i>'.repeat(NL);const LZ=[...$('laser').children];
const R=Array.from({length:30},(_,i)=>({x:(i*173+37)%1920,v:90+(i%5)*30,d:i*1.37,w:30+(i%4)*14,s:.6+(i%4)*.15,r:i*47}));
$('roi').innerHTML='<i></i>'.repeat(R.length);const RI=[...$('roi').children];
const nh=(a,t)=>{const f=t*N.fps,i=Math.floor(f),u=f-i;const x=a[i]||0,y=a[i+1]||x;return x+(y-x)*u};
/* độ nháy: giảm dần sau mỗi nhịp trống */
const KS=N.k.map(i=>i/N.fps);
function nayLuc(t){let lo=0,hi=KS.length-1,j=-1;while(lo<=hi){const m=(lo+hi)>>1;if(KS[m]<=t){j=m;lo=m+1}else hi=m-1}return j<0?0:Math.exp(-(t-KS[j])*7)}
function ve(t){
 const b=nh(N.b,t),m=nh(N.m,t),h=nh(N.h,t),k=nayLuc(t);
 const i=L.findIndex(x=>t>=x.a-.25&&t<x.b),l=L[i]||L.filter(x=>x.a<=t).pop()||L[0];
 const mau=MAU[(l?l.di:0)%MAU.length];$('k').style.setProperty('--c1',mau[0]);$('k').style.setProperty('--c2',mau[1]);
 const lang=l&&l.lang&&t>=l.a-1&&t<l.b+1;$('k').classList.toggle('lang',lang);const nl=lang?.35:1;
 $('hao').style.opacity=(.3+.5*b)*nl;
 $('mt').style.transform='translateY('+(8*Math.sin(t*.5))+'px) scale('+(1+.05*b)+')';
 LZ.forEach((e,j)=>{const ben=j<NL/2,goc=(ben?-1:1)*(18+j%4*11)+Math.sin(t*(.6+j*.13)+j)*22;
  e.style.left=(ben?120+j*60:1800-(j-NL/2)*60)+'px';e.style.transform='rotate('+goc+'deg)';
  e.style.background='linear-gradient(180deg,'+(j%2?mau[0]:mau[1])+',transparent 80%)';e.style.opacity=(.15+.75*h*(j%3===0?1:.6)+.4*k)*nl});
 $('san').querySelector('b').style.backgroundPosition='0 '+((t*240)%120)+'px';
 $('chantroi').style.opacity=.5+.5*b;
 EQ.forEach((e,j)=>{const c=Math.abs(j-NE/2)/(NE/2),v=j%3===0?b:j%3===1?m:h;
  const z=.5+.5*Math.sin(t*9+j*1.7)*Math.sin(t*3.1+j*.6);e.style.height=(12+220*cl(v*(1-.55*c)*(.55+.6*z),0,1)*nl)+'px'});
 RI.forEach((e,j)=>{const p=R[j],y=((t+p.d)*p.v)%1240-80;e.style.transform='translate('+(p.x+p.w*Math.sin((t+p.d)*.8))+'px,'+y+'px) rotate('+(p.r+t*90)+'deg) scale('+p.s+')'});
 const vz=1+.14*b+.08*k;$('vong').style.transform='scale('+vz+')';$('vong2').style.transform='rotate('+(t*25)+'deg) scale('+(1+.08*m)+')';$('logo').style.transform='scale('+(1+.05*b)+')';
 $('nay').style.opacity=lang?0:.32*k;
 /* tiêu đề đầu */
 const ti=t<L[0].a+3?ss(cl(t/1.2,0,1))*(1-ss(cl((t-L[0].a+1)/1,0,1))):0;$('tieu').style.opacity=ti;$('tieu').style.transform='scale('+(1+.03*k)+')';
 const kt=ss(cl((t-T_KET-.3)/1.2,0,1));$('ket').style.opacity=kt;$('ket').style.transform='scale('+(1+.03*k)+')';
 $('dau').style.opacity=(1-ti)*(1-kt);
 ['vong','vong2','logo','mt'].forEach(x=>$(x).style.opacity=x==='mt'?.28*(1-.6*kt):(1-.75*kt)*(1-.8*ti));
 /* lời */
 if(i<0||kt>.05){$('loi').style.opacity=0;$('tag').style.opacity=0;return}
 const vao=ss(cl((t-(l.a-.25))/.3,0,1)),ra=1-ss(cl((t-(l.b-.3))/.3,0,1));
 const pop=1+.18*(1-vao)+.04*k;$('loi').style.opacity=vao*ra;
 const dong=$('loi').querySelector('.dong');
 if($('n').textContent!==l.c){$('n').textContent=l.c;$('f').textContent=l.c;const n=L[i+1];$('ke').textContent=n&&n.di===l.di?n.c:'';
  dong.style.fontSize=(l.c.length<=16?150:l.c.length<=26?112:88)+'px'}
 const p=cl((t-l.a)/Math.max(.4,(l.b-l.a)*.8),0,1);$('f').style.clipPath='inset(0 '+(100-p*100)+'% 0 0)';
 const w=dong.scrollWidth,mx=1780,sc=w>mx?mx/w:1;const lac=(l.c.match(/!/g)||[]).length>=2?k*6:0;
 dong.style.transform='translate('+(lac*Math.sin(t*60))+'px,0) scale('+(sc*pop)+')';
 const dau=L.findIndex(x=>x.di===l.di);$('tag').textContent=l.g;$('tag').style.opacity=(i-dau<2?1:0)*vao*ra;
}
window.ve=ve;
const q=new URLSearchParams(location.search).get('t');document.fonts.ready.then(()=>ve(q?+q:0));
</script></body></html>
