<title>Demo màn khởi động</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif}

.logo{width:64px;height:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.vach{margin-top:22px;width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.vach:after{content:'';position:absolute;inset:0;width:40%;border-radius:3px;background:currentColor}
/* A – Lời chào lớn, cánh phượng rơi */
.A{background:radial-gradient(circle at 50% 30%,#FFF8F1,#FCE6DC 60%,#F5CDBF);color:#2B2420}
.A .chao{font-family:'Dancing Script',cursive;font-size:56px;line-height:1;color:#B3261E;margin-top:26px}
.A .ban{margin-top:14px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#7A5A52}
.A .ten{margin-top:6px;font-family:'Playfair Display',serif;font-size:24px}
.A .cau{margin-top:26px;font-family:'Charm',cursive;font-size:21px;color:#8A3B2E;max-width:300px}
.A .dem{margin-top:22px;display:flex;gap:10px}.A .dem div{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 6px 16px rgba(179,38,30,.12)}.A .dem b{display:block;font-size:24px;color:#B3261E}.A .dem small{font-size:11px;color:#8A6F6A;letter-spacing:.08em}
.A .vach{color:#C8102E;background:rgba(200,16,46,.14)}
.canh{position:absolute;width:13px;height:9px;border-radius:70% 0 70% 0;background:#E0412F;opacity:.7}
/* B – Bầu trời theo giờ */
.B{color:#fff}.B.sang{background:linear-gradient(#8FD3F4,#FCE9C8 70%,#FFF6E8)}.B.trua{background:linear-gradient(#5BB8F0,#BDE5FA 70%,#F4FBFF)}
.B.chieu{background:linear-gradient(#F7A35C,#F9C784 45%,#FCE3C3)}.B.toi{background:linear-gradient(#0F1B3D,#28376B 60%,#4A3F78)}
.B .mt{position:absolute;top:12%;right:16%;width:70px;height:70px;border-radius:50%}
.B.sang .mt{background:#FFE7A0;box-shadow:0 0 60px 20px rgba(255,220,130,.6)}.B.trua .mt{background:#FFF3B0;box-shadow:0 0 70px 26px rgba(255,240,170,.7);top:8%;right:42%}
.B.chieu .mt{background:#FF9E5E;box-shadow:0 0 70px 26px rgba(255,140,80,.6);top:auto;bottom:30%;right:18%}
.B.toi .mt{background:#F4F1DE;box-shadow:0 0 40px 10px rgba(240,236,210,.35)}
.sao{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8}
.B .the{position:relative;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);border-radius:26px;padding:26px 22px 22px;width:min(88vw,360px);box-shadow:0 18px 40px rgba(0,0,0,.15)}
.B.sang .the,.B.trua .the,.B.chieu .the{color:#3A2620}
.B .the .logo{width:56px;height:56px;margin-top:-54px}
.B .chao{margin-top:12px;font-family:'Playfair Display',serif;font-size:34px;line-height:1.15}
.B .ban{margin-top:8px;font-size:15px;opacity:.9}.B .ten{margin-top:4px;font-weight:700;font-size:17px}
.B .cau{margin-top:16px;font-style:italic;font-size:15px;opacity:.9}
.B .vach{margin:20px auto 0;color:currentColor}
.B .phuong{position:absolute;bottom:-10px;left:-30px;width:260px;opacity:.9}

.C{background:#F3E9DA;color:#3A2E2E}
.C .thu{position:relative;width:min(86vw,340px);background:#FFFDF8;border-radius:6px;box-shadow:0 22px 50px rgba(90,40,20,.18);padding:34px 26px 26px;background-image:repeating-linear-gradient(transparent 0 29px,#F1E4DD 29px 30px)}
.C .tem{position:absolute;top:14px;right:14px;width:58px;height:58px;border:2px dashed #C8102E;border-radius:6px;display:flex;align-items:center;justify-content:center;transform:rotate(6deg);background:#fff}
.C .tem img{width:42px;height:42px}
.C .gui{text-align:left;font-size:12.5px;letter-spacing:.14em;color:#B3261E;font-weight:700}
.C .chao{text-align:left;margin-top:14px;font-family:'Dancing Script',cursive;font-size:44px;line-height:1.05;color:#8A2A1F}
.C .ban{text-align:left;margin-top:10px;font-family:'Charm',cursive;font-size:22px;line-height:1.4}
.C .ky{text-align:right;margin-top:14px;font-family:'Dancing Script',cursive;font-size:22px;color:#B3261E}
.C .cau{margin-top:22px;font-size:14px;color:#7A5A52}
.C .vach{color:#C8102E;background:rgba(200,16,46,.14)}
