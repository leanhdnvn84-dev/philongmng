<!doctype html><html lang="vi"><head><meta charset="utf-8">
<title>Clip mở đầu 15 giây</title>
<!-- Clip mở đầu 15 giây cho video Gala "Ngày trở về". Khung 1920×1080; render-clip.js tua từng khung bằng Web Animations -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif:ital,wght@0,400;0,600;1,400;1,500&family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FBF3E4}
.k{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Noto Serif',serif;background:radial-gradient(80% 70% at 50% 25%,#FFFDF7 0%,#FBF0DC 55%,#F3DFC0 100%)}
.ab{position:absolute}
.tranh{position:absolute;left:0;right:0;bottom:0;height:640px;background:url(../../assets/giay-moi-nen.webp) no-repeat 0 100%/120% auto;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 45%);mask-image:linear-gradient(180deg,transparent 0,#000 45%)}
.canh{position:absolute;width:820px;height:560px;background:url(../ngoai-khoa/canh.webp) center/contain no-repeat}
.nang{position:absolute;inset:0;background:radial-gradient(45% 55% at 50% 30%,rgba(255,240,190,.75),transparent 70%)}
.tia{position:absolute;left:50%;top:-300px;width:2400px;height:2400px;margin-left:-1200px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,236,170,.18) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(closest-side,#000 20%,transparent 60%);mask-image:radial-gradient(closest-side,#000 20%,transparent 60%)}
.roi i{position:absolute;top:-40px;width:26px;height:20px;border-radius:60% 0 60% 0;background:radial-gradient(circle at 30% 30%,#ff7a62,#c8102e);opacity:.85}
.giua{position:absolute;left:0;right:0;text-align:center}
.logo{width:150px;height:150px;border-radius:50%;background:#fff;padding:12px;box-shadow:0 10px 34px rgba(120,60,30,.25)}
.ey{font:700 30px 'Be Vietnam Pro',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#9E1B22}
.td{font:400 225px/1.05 'Great Vibes',cursive;color:#B3261E;text-shadow:0 6px 24px rgba(179,38,30,.18)}
.gach{width:520px;height:3px;margin:0 auto;background:linear-gradient(90deg,transparent,#C9A24A,transparent)}
.phu{text-shadow:0 0 12px #FFF8EA,0 0 4px #FFF8EA;font:600 44px 'Noto Serif',serif;letter-spacing:.12em;color:#5B2A12}
.so{text-shadow:0 0 10px #FFF8EA;font:italic 500 40px 'Noto Serif',serif;color:#4A3A31}
.ngay{display:inline-block;font:700 46px 'Playfair Display',serif;font-variant-numeric:lining-nums;letter-spacing:.14em;color:#fff;background:linear-gradient(135deg,#C8102E,#9C1E2A);padding:14px 40px;border-radius:40px;box-shadow:0 10px 26px rgba(179,38,30,.35)}
@keyframes kb{from{transform:scale(1.12) translateY(40px)}to{transform:scale(1) translateY(0)}}
@keyframes vaoTrai{from{transform:translate(-320px,-220px) rotate(-6deg);opacity:0}to{transform:translate(0,0) rotate(8deg);opacity:1}}
@keyframes vaoPhai{from{transform:scaleX(-1) translate(-320px,-220px) rotate(-6deg);opacity:0}to{transform:scaleX(-1) translate(0,0) rotate(8deg);opacity:1}}
@keyframes lac{0%,100%{rotate:0deg}50%{rotate:1.6deg}}
@keyframes hien{from{opacity:0;transform:translateY(30px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes bat{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes viet{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -5% 0 0)}}
@keyframes gian{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes roi{from{transform:translate(0,0) rotate(0)}to{transform:translate(160px,1200px) rotate(620deg)}}
@keyframes xoay{from{transform:rotate(0)}to{transform:rotate(30deg)}}
@keyframes tho{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes den{from{opacity:1}to{opacity:0}}
@keyframes denRa{from{opacity:0}to{opacity:1}}
.tranh{animation:kb 15s cubic-bezier(.2,.6,.3,1) both}
.tia{animation:xoay 15s linear both}
.nang{animation:tho 4s ease-in-out infinite both}
.c1{left:-140px;top:-110px;animation:vaoTrai 2.4s cubic-bezier(.2,.7,.2,1) .3s both}
.c2{right:-140px;top:-110px;animation:vaoPhai 2.4s cubic-bezier(.2,.7,.2,1) .3s both}
.roi i{animation:roi linear infinite both}
.a-logo{animation:bat 1.2s cubic-bezier(.3,1.4,.5,1) 1s both}
.a-ey{animation:hien 1.2s ease 2.1s both}
.a-td{animation:viet 2.4s cubic-bezier(.45,.05,.3,1) 3s both}
.a-gach{animation:gian 1.2s ease 5.4s both}
.a-phu{animation:hien 1.3s ease 6s both}
.a-so{animation:hien 1.3s ease 7.6s both}
.a-ngay{animation:bat 1.1s cubic-bezier(.3,1.4,.5,1) 9.2s both}
.den1{position:absolute;inset:0;background:#fff;z-index:9;animation:den 1s ease both}
.den2{position:absolute;inset:0;background:#000;z-index:9;animation:denRa 1s ease 14s both}
</style></head><body><div class="k">
 <div class="tia"></div><div class="nang"></div>
 <div class="tranh"></div>
 <div class="ab" style="left:360px;right:360px;top:120px;height:880px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,250,238,.92) 0%,rgba(255,250,238,.75) 55%,transparent 100%)"></div>
 <div class="canh c1"></div><div class="canh c2"></div>
 <div class="roi" id="roi"></div>
 <div class="giua" style="top:110px">
  <img class="logo a-logo" src="../../assets/logo-nguyen-hien.png" alt="">
  <div class="ey a-ey" style="margin-top:26px">Trường THPT Nguyễn Hiền · Đà Nẵng</div>
  <div class="td a-td" style="margin-top:34px">Ngày trở về</div>
  <div class="gach a-gach" style="margin-top:40px"></div>
  <div class="phu a-phu" style="margin-top:26px">GALA GẶP MẶT NIÊN KHOÁ 2000 – 2003</div>
  <div class="so a-so" style="margin-top:16px">23 năm · 12 lớp · một mái trường</div>
  <div class="a-ngay" style="margin-top:34px"><span class="ngay">14 · 11 · 2026</span></div></div>
 <div class="den1"></div><div class="den2"></div>
</div>
<script>
document.getElementById('roi').innerHTML=Array.from({length:30},(_,i)=>`<i style="left:${(i*37+11)%100}%;animation-duration:${6+i%5}s;animation-delay:${-(i*0.71).toFixed(2)}s;scale:${(.55+(i%4)*.22).toFixed(2)}"></i>`).join('');
</script></body></html>
