<style>

 ${[[110,140,-8],[430,90,5],[230,520,4],[560,470,-6]].map(([x,y,g],i)=>`<div class="polaroid" style="left:${x}px;top:${y}px;width:330px;padding:16px 16px 60px;transform:rotate(${g}deg)"><div style="position:relative;width:298px;height:220px;overflow:hidden">${tranh('inset:0',['0 98%','30% 70%','0 0','70% 100%'][i],['135% auto','200% auto','280% auto','160% auto'][i],'','')}</div></div>`).join('')}

/* 4 – thời gian */ ()=>`<div class="k" style="background:linear-gradient(180deg,#BFE3F7 0%,#E8F4FA 45%,#FFF4E2 100%)">${Array.from({length:5},(_,i)=>`<div class="ab" style="left:${120+i*380}px;top:${60+(i%2)*90}px;width:${260+i%3*60}px;height:70px;border-radius:40px;background:#fff;opacity:.85;box-shadow:60px -20px 0 10px #fff,120px 0 0 0 #fff"></div>`).join('')}

 <div class="ab" style="left:560px;top:60px;width:800px;height:330px;border:16px solid #7A4A26;background:radial-gradient(120% 110% at 40% 30%,#2F4A3C,#1D2F26);box-shadow:0 20px 40px rgba(0,0,0,.35)"><div style="font:400 150px 'Patrick Hand',cursive;color:#F4F1E6;text-align:center;line-height:300px;opacity:.95">2003</div></div>

 <div class="ab" style="inset:0;background:radial-gradient(60% 50% at 70% 0%,rgba(255,250,220,.6),transparent 70%)"></div>
