<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết nối 2028 – demo</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
 --muc:#13294B;--muc2:#1E3A66;--bien:#0E8C8C;--bien2:#3CC4B5;--bac:#B7C1CD;--bac2:#E6EAF0;--bac3:#F3F5F8;
 --nen:#F7F6F2;--nang:#FFB547;--hong:#FF6F61;--chu:#22304A;--phu:#5D6B80}
*{box-sizing:border-box;margin:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--nen);color:var(--chu);font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3,.so{font-family:'Fraunces',serif}
.w{max-width:1180px;margin:0 auto;padding:0 24px}
/* đầu trang web */
.dau{background:#fff;border-bottom:1px solid var(--bac2);position:sticky;top:0;z-index:5}
.dau .w{display:flex;align-items:center;gap:14px;height:60px}
.dau .lg{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--bien),var(--muc),var(--bien));}
.dau b{font-size:15px}.dau nav{margin-left:auto;display:flex;gap:4px;font-size:14px}
.dau nav a{padding:7px 12px;border-radius:99px;color:var(--phu)}.dau nav a.on{background:var(--muc);color:#fff}
@media(max-width:900px){.dau nav{display:none}}
/* HERO */
.hero{position:relative;overflow:hidden;color:#fff;background:
 radial-gradient(120% 90% at 85% 10%,rgba(255,181,71,.35),transparent 55%),
 linear-gradient(180deg,#13294B 0%,#1A4A6E 55%,#0E8C8C 100%)}
.hero .song{position:absolute;left:0;right:0;bottom:-2px;height:120px}
.hero .w{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding-top:64px;padding-bottom:150px}
.ey{display:inline-flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--nang)}
.ey:before{content:'';width:28px;height:2px;background:currentColor}
.hero h1{font-size:clamp(44px,6vw,84px);line-height:1.02;font-weight:800;margin:14px 0 12px;letter-spacing:-.02em}
.hero h1 i{font-style:italic;font-weight:500;color:var(--bien2)}
.hero h1 .bac{background:linear-gradient(100deg,#fff 10%,#C9D3DF 40%,#fff 60%,#AEB9C7 90%);-webkit-background-clip:text;color:transparent}
.hero p.l{font-size:19px;max-width:560px;color:#DCE6F0}
.nut{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.b{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:99px;font-weight:700;font-size:15px;border:0;text-decoration:none}
.b.c{background:var(--hong);color:#fff;box-shadow:0 10px 24px -8px rgba(255,111,97,.7)}
.b.t{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.b.d{background:var(--muc);color:#fff}.b.v{background:#fff;color:var(--muc);border:1.5px solid var(--bac)}
.dem{display:flex;gap:10px;margin-top:30px}
.dem div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px 16px;min-width:84px;text-align:center;backdrop-filter:blur(6px)}
.dem b{display:block;font-family:'Fraunces';font-size:36px;line-height:1;font-variant-numeric:lining-nums}
.dem span{font-size:12px;color:#C8D6E4;letter-spacing:.08em;text-transform:uppercase}
/* vòng 12 lớp */
.vong{position:relative;aspect-ratio:1;max-width:420px;width:100%;justify-self:center}
.vong svg{width:100%;height:100%}
.vong .gi{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.vong .gi b{font-family:'Fraunces';font-size:92px;line-height:.9;background:linear-gradient(160deg,#fff,#B7C1CD 60%,#fff);-webkit-background-clip:text;color:transparent}
.vong .gi small{display:block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#CFE0EC}
.vong .gi em{display:block;font-style:normal;margin-top:8px;font-size:15px;color:var(--nang);font-weight:700}
/* phần */
.sec{padding:72px 0}.sec.tr{background:#fff}
.tt{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.tt .ey{color:var(--bien)}
.tt h2{font-size:clamp(32px,3.6vw,46px);line-height:1.08;color:var(--muc);margin-top:8px;font-weight:700}
.tt h2 i{color:var(--bien);font-weight:500}
.tt p{color:var(--phu);max-width:440px}
/* điểm danh */
.dd{display:grid;grid-template-columns:380px 1fr;gap:28px}
.the{background:#fff;border-radius:22px;border:1px solid var(--bac2);box-shadow:0 18px 40px -26px rgba(19,41,75,.35)}
.form{padding:26px}
.form h3{font-size:24px;color:var(--muc)}
.form label{display:block;font-size:13px;font-weight:600;color:var(--phu);margin:14px 0 6px}
.form .o{border:1.5px solid var(--bac2);border-radius:12px;padding:11px 14px;color:#98A3B3;background:var(--bac3)}
.chon{display:flex;gap:8px}.chon span{flex:1;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--bac2);font-weight:600;font-size:14px}
.chon span.on{background:#E2F6F3;border-color:var(--bien);color:var(--bien)}
.form .b{width:100%;justify-content:center;margin-top:18px}
.dua{padding:26px}
.dua .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.dua .h b{font-family:'Fraunces';font-size:22px;color:var(--muc)}.dua .h span{font-size:14px;color:var(--phu)}
.hang{display:grid;grid-template-columns:62px 1fr 56px;align-items:center;gap:12px;padding:7px 0}
.hang .l{font-weight:700;color:var(--muc)}
.hang .tr{height:14px;background:var(--bac3);border-radius:99px;overflow:hidden}
.hang .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bien),var(--bien2))}
.hang.n1 .tr i{background:linear-gradient(90deg,var(--nang),#FFD27F)}
.hang .s{text-align:right;font-weight:700;font-size:14px;color:var(--phu)}
.hang .l small{font-size:15px}
/* còn thiếu */
.thieu{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:26px}
.thieu div{background:var(--muc);color:#fff;border-radius:16px;padding:14px;position:relative;overflow:hidden}
.thieu div:after{content:'';position:absolute;right:-18px;bottom:-18px;width:60px;height:60px;border-radius:50%;border:10px solid rgba(255,255,255,.08)}
.thieu b{font-family:'Fraunces';font-size:26px}.thieu span{display:block;font-size:13px;color:#B9C8DA}
.thieu em{font-style:normal;font-size:13px;font-weight:700;color:var(--nang)}
/* bản đồ */
.bd{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.map{background:linear-gradient(180deg,#E8F4F6,#F5FAFB);border-radius:26px;padding:20px;position:relative;border:1px solid var(--bac2)}
.map svg{width:100%;height:auto;display:block}
.nn{display:flex;flex-wrap:wrap;gap:8px}
.nn span{background:#fff;border:1px solid var(--bac2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.nn span b{color:var(--hong);margin-left:4px}
.top3{display:grid;gap:12px;margin:18px 0}
.top3 div{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 18px;border:1px solid var(--bac2)}
.top3 i{font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bien);color:#fff;font-weight:800}
.top3 b{font-size:18px;color:var(--muc)}.top3 small{display:block;color:var(--phu);font-size:14px}
.top3 em{margin-left:auto;font-family:'Fraunces';font-size:28px;font-style:normal;color:var(--muc)}
/* góp tay */
.gt{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.viec{background:#fff;border-radius:20px;padding:22px;border:1px solid var(--bac2);position:relative}
.viec .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--bac3)}
.viec h3{font-size:21px;color:var(--muc);margin:14px 0 6px}
.viec p{color:var(--phu);font-size:15px}
.viec .ft{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.av{display:flex}.av i{width:30px;height:30px;border-radius:50%;border:2px solid #fff;margin-left:-8px;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;color:#fff}
.av i:first-child{margin-left:0}
.nhan{font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;background:#E2F6F3;color:var(--bien)}
.viec.can .nhan{background:#FFE9E6;color:var(--hong)}
.viec .so{position:absolute;right:20px;top:18px;font-size:44px;color:var(--bac2);font-weight:800}
/* thư 2028 */
.thu{background:linear-gradient(135deg,#13294B,#1E3A66);color:#fff;border-radius:28px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.thu h2{font-size:clamp(34px,3.8vw,50px);line-height:1.05}.thu h2 i{color:var(--nang);font-weight:500}
.thu p{color:#C9D6E6;margin:14px 0 22px;font-size:17px}
.bao{position:relative;height:280px}
.bao .p{position:absolute;width:240px;height:150px;border-radius:10px;background:linear-gradient(160deg,#F4F6F9,#C9D2DD);box-shadow:0 20px 40px -14px rgba(0,0,0,.55)}
.bao .p:before{content:'';position:absolute;inset:0;background:linear-gradient(155deg,transparent 49.5%,rgba(19,41,75,.18) 50%,transparent 51%),linear-gradient(-155deg,transparent 49.5%,rgba(19,41,75,.18) 50%,transparent 51%)}
.bao .p:after{content:'25';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8D7F,#D94A3D);color:#fff;font:800 18px 'Fraunces';display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.bao .p1{left:10%;top:70px;transform:rotate(-12deg)}.bao .p2{left:30%;top:20px;transform:rotate(6deg)}.bao .p3{left:20%;top:120px;transform:rotate(3deg)}
.bao .dem2{position:absolute;right:0;bottom:6px;text-align:right}
.bao .dem2 b{font-family:'Fraunces';font-size:64px;line-height:1;color:var(--nang)}.bao .dem2 span{display:block;color:#C9D6E6;font-size:14px}
/* bình chọn + bll */
.hai{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bc{padding:28px}.bc h3{font-size:24px;color:var(--muc);margin-bottom:16px}
.lc{position:relative;border:1.5px solid var(--bac2);border-radius:14px;padding:12px 16px;margin-bottom:10px;overflow:hidden;display:flex;justify-content:space-between;font-weight:600}
.lc i{position:absolute;inset:0;right:auto;background:#E2F6F3;z-index:0}.lc span,.lc b{position:relative}
.lc.top{border-color:var(--bien)}.lc.top i{background:linear-gradient(90deg,#CFF0EB,#E8F8F5)}
.bll{padding:28px}
.ng{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--bac2)}
.ng:last-of-type{border:0}
.ng .a{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--bac2),var(--bac));display:grid;place-items:center;font:700 20px 'Fraunces';color:var(--muc)}
.ng b{display:block;color:var(--muc)}.ng small{color:var(--phu)}
.ng .g{margin-left:auto;display:flex;gap:6px}.ng .g span{padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;background:var(--bien)}.ng .g span+span{background:#2F7BEF}
/* bảng tin */
.tin{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tin div{background:#fff;border-radius:18px;padding:20px;border-left:5px solid var(--bien)}
.tin div:nth-child(2){border-color:var(--nang)}.tin div:nth-child(3){border-color:var(--hong)}
.tin small{color:var(--phu);font-weight:600}.tin b{display:block;font-size:18px;color:var(--muc);margin:6px 0}
.tin p{font-size:15px;color:var(--phu)}
.ket{text-align:center;padding:70px 20px;background:linear-gradient(180deg,var(--nen),#E3EEF2)}
.ket h2{font-size:clamp(34px,4vw,54px);color:var(--muc)}.ket h2 i{color:var(--bien);font-weight:500}
.ket p{color:var(--phu);margin-top:10px}
/* bảng màu */
.pal{padding:60px 0}.pal .o3{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mau{border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--bac2)}
.mau .c{height:150px;display:flex;align-items:end;padding:14px;color:#fff;font-weight:700}
.mau .x{padding:14px 16px}.mau .x b{display:block;color:var(--muc);font-size:17px}.mau .x small{color:var(--phu);font-size:14px}
.so2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
.so2 .k{border-radius:20px;padding:28px;color:#fff}
.so2 .k h3{font-size:30px}.so2 .k p{opacity:.85;margin-top:6px}
.chu{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.chu div{background:#fff;border-radius:20px;padding:26px;border:1px solid var(--bac2)}
/* điện thoại */
@media(max-width:760px){
 .w{padding:0 16px}
 .hero .w{grid-template-columns:1fr;padding-top:36px;padding-bottom:110px;gap:10px}
 .hero h1{font-size:42px}.hero p.l{font-size:17px}
 .dem{gap:8px}.dem div{min-width:0;flex:1;padding:10px 6px}.dem b{font-size:28px}
 .vong{max-width:300px;order:-1}.vong .gi b{font-size:70px}
 .sec{padding:48px 0}
 .dd,.bd,.thu,.hai{grid-template-columns:1fr}
 .thieu{grid-template-columns:repeat(3,1fr)}
 .gt,.tin{grid-template-columns:1fr}
 .thu{padding:28px 22px}.bao{height:230px}.bao .p{width:190px;height:120px}
 .pal .o3{grid-template-columns:1fr 1fr}.so2,.chu{grid-template-columns:1fr}
}
