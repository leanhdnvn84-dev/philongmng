<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết nối 2028</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--dem:#0E1828;--dem2:#16233A;--muc:#1B2740;--ngoc:#F1EFEA;--trang:#FAF9F6;--bac:#C3C9D2;--bac2:#8D96A4;--vien:#D9DCE1;--chu:#2A3346;--phu:#6B7487;--sap:#7E6A4E}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;font-weight:300;background:var(--trang);color:var(--chu);font-size:16px;line-height:1.7;overflow-x:hidden}
.cg{font-family:'Cormorant Garamond',serif}
.w{max-width:1160px;margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
.foil{background:linear-gradient(115deg,#8E97A5 0%,#F4F6F8 22%,#A9B1BD 40%,#E9ECF0 58%,#8D96A4 78%,#DDE1E6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* menu */
.dau{position:absolute;top:0;left:0;right:0;z-index:4}
.dau .w{display:flex;align-items:center;height:76px;color:#D5DAE1;font-size:14px;gap:28px}
.dau .ten{font-family:'Cormorant Garamond';font-size:20px;color:#fff;letter-spacing:.02em}
.dau nav{margin-left:auto;display:flex;gap:26px;color:#8F9AAB}.dau nav a.on{color:#fff;border-bottom:1px solid var(--bac);padding-bottom:3px}
@media(max-width:960px){.dau nav{display:none}}
/* hero */
.hero{background:radial-gradient(90% 70% at 72% 45%,#1E2E4A 0%,var(--dem) 62%);color:#E9ECF0;position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;min-height:min(820px,100vh);padding-top:96px;padding-bottom:70px}
.hero .ngay{font-family:'Cormorant Garamond';font-style:italic;font-size:22px;color:var(--bac)}
.hero h1{font-family:'Cormorant Garamond';font-weight:300;font-size:clamp(52px,6.4vw,96px);line-height:.98;margin:18px 0 26px;letter-spacing:-.01em}
.hero p{max-width:440px;color:#AEB7C4;font-size:17px}
.hanh{display:flex;align-items:center;gap:28px;margin-top:40px;flex-wrap:wrap}
.nut{display:inline-block;padding:15px 34px;font-size:14px;font-weight:500;letter-spacing:.06em;background:linear-gradient(120deg,#D9DDE3,#F7F8FA 45%,#B9C0CA);color:var(--dem);border-radius:2px}
.lk{font-size:14px;color:#C9D0DA;border-bottom:1px solid #4A5870;padding-bottom:3px}
.con{margin-top:56px;display:flex;gap:40px;border-top:1px solid #2A3954;padding-top:22px;max-width:460px}
.con div{font-size:13px;color:#7F8B9E}.con b{display:block;font-family:'Cormorant Garamond';font-weight:400;font-size:40px;line-height:1.1;color:#E9ECF0;font-variant-numeric:lining-nums}
.mat{width:100%;max-width:520px;justify-self:end;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.mat svg{width:100%;height:auto;display:block}
/* phần sáng */
.sec{padding:120px 0}
.sec h2{font-family:'Cormorant Garamond';font-weight:300;font-size:clamp(40px,4.4vw,64px);line-height:1.04;color:var(--muc)}
.dan{color:var(--phu);max-width:520px;margin-top:18px;font-size:17px}
.hai{display:grid;grid-template-columns:5fr 7fr;gap:80px;align-items:start}
/* sổ điểm danh */
.so{border-top:1px solid var(--muc)}
.dong{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid var(--vien)}
.dong .l{font-family:'Cormorant Garamond';font-size:24px;color:var(--muc)}
.dong .t{height:2px;background:var(--vien);position:relative}
.dong .t i{position:absolute;left:0;top:-1px;height:4px;background:linear-gradient(90deg,#6E7889,#C9CED6)}
.dong .s{text-align:right;font-size:14px;color:var(--phu);font-variant-numeric:tabular-nums}
.dong.dau1 .l{font-style:italic}.dong.dau1 .t i{background:linear-gradient(90deg,var(--muc),#5B6A86)}
.dk{margin-top:44px;padding:34px;background:var(--ngoc)}
.dk h3{font-family:'Cormorant Garamond';font-weight:400;font-size:30px;color:var(--muc)}
.o{border:0;border-bottom:1px solid #B5BBC5;padding:12px 0;margin-top:14px;color:#9AA2B0;font-size:15px}
.ch{display:flex;gap:22px;margin:22px 0 26px;font-size:14px;color:var(--phu)}
.ch span:before{content:'';display:inline-block;width:12px;height:12px;border:1px solid var(--bac2);border-radius:50%;margin-right:8px;vertical-align:-1px}
.ch span.on{color:var(--muc)}.ch span.on:before{background:radial-gradient(circle,var(--muc) 45%,transparent 50%)}
.nut.toi{background:var(--muc);color:#F1F3F6}
.thieu{margin-top:30px;font-size:15px;color:var(--phu)}.thieu em{font-family:'Cormorant Garamond';font-size:20px;color:var(--muc)}
/* bản đồ */
.bd{background:var(--ngoc)}
.bd .hai{grid-template-columns:6fr 5fr;align-items:center}
.bd svg{width:100%;max-width:470px;height:auto;display:block;margin:auto}
.tp{margin-top:36px;border-top:1px solid var(--muc)}
.tp div{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--vien)}
.tp span{font-size:16px;color:var(--chu)}.tp b{font-family:'Cormorant Garamond';font-weight:400;font-size:32px;color:var(--muc);font-variant-numeric:lining-nums}
.xa{margin-top:22px;font-size:15px;color:var(--phu)}
/* thư */
.thu{background:var(--dem);color:#E6EAF0;text-align:center;padding:130px 0;position:relative;overflow:hidden}
.thu h2{font-family:'Cormorant Garamond';font-weight:300;font-size:clamp(40px,4.4vw,64px);line-height:1.04;color:#F1F3F6}.thu .dan{color:#9AA5B6;margin:20px auto 0}
.phong{width:min(420px,84vw);margin:56px auto 46px;aspect-ratio:1.6;position:relative;background:linear-gradient(150deg,#E9ECEF,#BFC6CF 55%,#DDE1E6);box-shadow:0 40px 70px -30px rgba(0,0,0,.8)}
.phong:before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.6%,rgba(14,24,40,.22) 50%,transparent 50.6%),linear-gradient(to bottom left,transparent 49.6%,rgba(14,24,40,.22) 50%,transparent 50.6%);clip-path:polygon(0 0,100% 0,50% 58%)}
.dau-sap{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4A5B7A,#1B2740 70%);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 0 0 5px rgba(255,255,255,.06)}
.dau-sap b{font-family:'Cormorant Garamond';font-size:30px;font-weight:500}
.dem-thu{font-family:'Cormorant Garamond';font-size:20px;color:var(--bac);font-style:italic;margin-bottom:28px}
.dem-thu b{font-style:normal;font-size:30px;color:#fff;font-weight:400}
/* góp tay = thực đơn */
.td{max-width:820px;margin:60px auto 0;border-top:1px solid var(--muc)}
.mon{display:grid;grid-template-columns:1fr auto;gap:8px 30px;padding:24px 0;border-bottom:1px solid var(--vien)}
.mon h3{font-family:'Cormorant Garamond';font-weight:400;font-size:28px;color:var(--muc);line-height:1.2}
.mon p{color:var(--phu);font-size:15px;grid-column:1}
.mon .ai{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:14px;color:var(--phu);white-space:nowrap}
.mon .ai a{display:block;margin-top:6px;color:var(--muc);font-weight:500;border-bottom:1px solid var(--muc);padding-bottom:2px;display:inline-block}
.mon .ai.trong{color:var(--sap)}
.giua{text-align:center}.giua .dan{margin-left:auto;margin-right:auto}
/* bình chọn + bll */
.bc .lc{padding:18px 0;border-bottom:1px solid var(--vien)}
.bc .lc div{display:flex;justify-content:space-between;font-size:16px}.bc .lc b{font-family:'Cormorant Garamond';font-size:24px;font-weight:400;color:var(--muc)}
.bc .lc i{display:block;height:2px;margin-top:10px;background:linear-gradient(90deg,#6E7889,#C9CED6)}
.bc .lc.dt i{background:var(--muc)}
.nho{font-size:14px;color:var(--phu);margin-top:16px}
.ng{padding:20px 0;border-bottom:1px solid var(--vien);display:flex;align-items:center;gap:20px}
.ng .a{width:56px;height:56px;border-radius:50%;border:1px solid var(--bac);display:grid;place-items:center;font-family:'Cormorant Garamond';font-size:24px;color:var(--muc);flex:none}
.ng b{font-family:'Cormorant Garamond';font-weight:500;font-size:23px;color:var(--muc);display:block;line-height:1.2}.ng small{font-size:14px;color:var(--phu)}
.ng .g{margin-left:auto;display:flex;gap:18px;font-size:14px}.ng .g a{border-bottom:1px solid var(--bac2);padding-bottom:2px}
/* tin */
.tin{display:grid;grid-template-columns:repeat(3,1fr);gap:50px;margin-top:56px}
.tin div{border-top:1px solid var(--muc);padding-top:20px}
.tin small{font-size:13px;color:var(--phu)}.tin h3{font-family:'Cormorant Garamond';font-weight:400;font-size:27px;line-height:1.2;color:var(--muc);margin:8px 0}
.tin p{color:var(--phu);font-size:15px}
.cuoi{background:var(--dem);color:#E6EAF0;text-align:center;padding:110px 0 90px}
.cuoi h2{font-family:'Cormorant Garamond';font-weight:300;font-size:clamp(44px,5vw,76px);line-height:1.05}
.cuoi p{color:#8F9AAB;margin-top:16px;font-family:'Cormorant Garamond';font-style:italic;font-size:22px}
/* bảng màu */
.pal{padding:80px 0;background:var(--trang)}
.pal .mau{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:46px;border:1px solid var(--vien)}
.pal .mau div{height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;font-size:13px}
.pal .mau b{font-family:'Cormorant Garamond';font-size:24px;font-weight:500;display:block}
.chu2{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:60px}
.chu2>div{border-top:1px solid var(--muc);padding-top:22px}
@media(max-width:820px){
 .w{padding:0 22px}
 .hero .w{grid-template-columns:1fr;min-height:0;padding-top:96px;gap:10px}
 .mat{order:-1;max-width:330px;justify-self:center}
 .hero h1{font-size:54px}
 .con{gap:26px}.con b{font-size:34px}
 .sec{padding:80px 0}.thu{padding:90px 0}
 .hai,.bd .hai{grid-template-columns:1fr;gap:50px}
 .dong{grid-template-columns:64px 1fr 56px;gap:14px}
 .tin{grid-template-columns:1fr;gap:34px}
 .mon h3{font-size:24px}
 .ng{flex-wrap:wrap}.ng .g{margin-left:76px}
 .pal .mau{grid-template-columns:repeat(2,1fr)}.pal .mau div{height:150px}.chu2{grid-template-columns:1fr}
}
</style></head><body><div id="app"></div>
<script>
var M=new URLSearchParams(location.search).get('m')||'pc';
var LOP=[['12/4',52],['12/2',41],['12/1',38],['12/7',36],['12/12',34],['12/5',33],['12/9',31],['12/11',30],['12/3',29],['12/6',27],['12/10',25],['12/8',22]];

function matDongHo(){var C=260,s='<svg viewBox="0 0 520 520"><defs>'+
 '<linearGradient id="vo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F5F7"/><stop offset=".3" stop-color="#9AA3B0"/><stop offset=".55" stop-color="#E6E9ED"/><stop offset=".8" stop-color="#7F8896"/><stop offset="1" stop-color="#D5DAE0"/></linearGradient>'+

 s+='<circle cx="260" cy="260" r="256" fill="url(#vo)"/><circle cx="260" cy="260" r="238" fill="#0B1322"/><circle cx="260" cy="260" r="234" fill="url(#mt)"/>';
 /* hoa văn guilloché */
 var g='';for(var i=0;i<72;i++){var a=i*5*Math.PI/180;g+='<circle cx="'+f(C+38*Math.cos(a))+'" cy="'+f(C+38*Math.sin(a))+'" r="120" fill="none" stroke="#9FB0C8" stroke-opacity=".13" stroke-width=".7"/>';}
 s+='<g>'+g+'</g>';
 var r='';for(var i=0;i<240;i++){var a=i*1.5*Math.PI/180;r+='<line x1="'+f(C+176*Math.cos(a))+'" y1="'+f(C+176*Math.sin(a))+'" x2="'+f(C+214*Math.cos(a))+'" y2="'+f(C+214*Math.sin(a))+'" stroke="#AEB9C9" stroke-opacity=".22" stroke-width=".6"/>';}
 s+=r+'<circle cx="260" cy="260" r="176" fill="none" stroke="#C3C9D2" stroke-opacity=".35"/><circle cx="260" cy="260" r="214" fill="none" stroke="#C3C9D2" stroke-opacity=".35"/>';
 /* vạch phút */
 for(var i=0;i<60;i++){if(i%5==0)continue;var a=(i*6-90)*Math.PI/180;s+='<line x1="'+f(C+222*Math.cos(a))+'" y1="'+f(C+222*Math.sin(a))+'" x2="'+f(C+229*Math.cos(a))+'" y2="'+f(C+229*Math.sin(a))+'" stroke="#C3C9D2" stroke-width="1"/>';}
 /* 12 lớp = 12 giờ */
 for(var i=1;i<=12;i++){var a=(i*30-90)*Math.PI/180;
  s+='<line x1="'+f(C+186*Math.cos(a))+'" y1="'+f(C+186*Math.sin(a))+'" x2="'+f(C+212*Math.cos(a))+'" y2="'+f(C+212*Math.sin(a))+'" stroke="url(#kim)" stroke-width="'+(i==8?5:3)+'" stroke-linecap="round"/>';

 /* kim chỉ số 8 = tháng 8 */
 var a=(8*30-90)*Math.PI/180;
 s+='<line x1="'+f(C-26*Math.cos(a))+'" y1="'+f(C-26*Math.sin(a))+'" x2="'+f(C+136*Math.cos(a))+'" y2="'+f(C+136*Math.sin(a))+'" stroke="url(#kim)" stroke-width="3" stroke-linecap="round"/>';
 var b=(-60)*Math.PI/180;s+='<line x1="260" y1="260" x2="'+f(C+118*Math.cos(b))+'" y2="'+f(C+118*Math.sin(b))+'" stroke="url(#kim)" stroke-width="5" stroke-linecap="round" opacity=".85"/>';
 s+='<circle cx="260" cy="260" r="74" fill="#15223A" stroke="#C3C9D2" stroke-opacity=".45"/><circle cx="260" cy="260" r="68" fill="none" stroke="#C3C9D2" stroke-opacity=".2"/>';
 s+='<text x="260" y="232" text-anchor="middle" font-family="Cormorant Garamond" font-size="15" letter-spacing="3" fill="#8F9AAB">2003</text>';
 s+='<text x="260" y="290" text-anchor="middle" font-family="Cormorant Garamond" font-weight="300" font-size="76" fill="url(#vo)">25</text>';
 s+='<text x="260" y="320" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-size="14" fill="#AEB7C4">tháng Tám, 2028</text>';
 s+='</svg>';return s;}

 var vn='M150 18 L178 30 L196 58 L214 72 L236 92 L222 110 L204 120 L196 146 L208 176 L226 206 L246 232 L262 256 L280 284 L296 316 L304 352 L300 390 L284 418 L258 438 L230 452 L202 472 L176 496 L150 512 L132 500 L146 476 L172 456 L200 436 L230 410 L246 380 L250 346 L240 312 L222 284 L204 258 L184 232 L166 206 L150 176 L138 150 L124 124 L104 100 L80 82 L66 60 L92 46 L122 36Z';

 var s='<svg viewBox="40 0 420 530"><path d="'+vn+'" fill="none" stroke="#1B2740" stroke-width="1.1" stroke-linejoin="round"/>';
 dd.forEach(function(d){var r=Math.max(3,Math.sqrt(d[2])*1.6);s+='<circle cx="'+d[0]+'" cy="'+d[1]+'" r="'+f(r)+'" fill="#1B2740" fill-opacity="'+(d[3]?'.9':'.5')+'"/>'+(d[2]>50?'<circle cx="'+d[0]+'" cy="'+d[1]+'" r="'+f(r+7)+'" fill="none" stroke="#1B2740" stroke-opacity=".35"/>':'');

 return s+'</svg>';}
var VIEC=[['Gom ảnh thời đi học','Quét ảnh cũ, gửi về kho ảnh chung của khoá.',4],['Phim "Hai mươi lăm năm"','Dựng một phim ngắn từ ảnh xưa và ảnh nay.',2],['Xin buổi chào cờ','Làm việc với nhà trường cho sáng thứ Hai tháng Tám.',1],['Trồng một cây phượng','Chọn chỗ, chọn cây, đặt biển khắc tên khoá.',0],['Tìm những bạn còn thiếu','Mỗi lớp nhận tìm ba người chưa liên lạc được.',5],['Sổ vàng viết tay','Mỗi người một trang, đóng thành một cuốn.',0]];
function pc(){var h='';
h+='<header class="dau"><div class="w"><span class="ten">Nguyễn Hiền 2000 – 2003</span><nav><a>Trang chủ</a><a>Các lớp</a><a>Kỷ yếu</a><a>Hình ảnh</a><a>Hoạt động</a><a class="on">Kết nối</a></nav></div></header>';
h+='<section class="hero"><div class="w"><div><div class="ngay">Sáng thứ Hai, tháng Tám năm 2028</div><h1 class="foil">Hai mươi lăm năm, một buổi chào cờ.</h1>'+

h+='<section class="sec"><div class="w hai"><div><h2>Sổ điểm danh hai nghìn không trăm hai mươi tám</h2><p class="dan">Chưa cần chắc chắn. Bạn cứ hẹn trước, gần ngày Ban liên lạc sẽ hỏi lại.</p>'+
 '<div class="dk"><h3>Mình sẽ về</h3><div class="o">Họ và tên</div><div class="o">Lớp</div><div class="ch"><span class="on">Chắc chắn</span><span>Có thể</span><span>Ở xa, sẽ cố</span></div><a class="nut toi">Ghi tên vào sổ</a></div></div>'+
 '<div><div class="so">';
