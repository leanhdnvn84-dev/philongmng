<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết nối 2028 – Tán cây</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--la:#2F8F4E;--la2:#5DB860;--non:#A9D86E;--troi:#BDE7F7;--troi2:#E9F7FD;--nang:#FFD34E;--cam:#FF9F43;--tim:#9B7FD4;--hong:#FF8FA3;--go:#7A5236;--dat:#F3FAEE;--chu:#1F3B2D;--phu:#557063}
*{box-sizing:border-box;margin:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--dat);color:var(--chu);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.bl{font-family:'Baloo 2',sans-serif}
.w{max-width:1180px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
.dau{position:absolute;inset:0 0 auto;z-index:5}.dau .w{display:flex;align-items:center;height:72px;gap:12px}
.dau .ten{font-family:'Baloo 2';font-weight:700;font-size:20px;color:var(--la)}
.dau nav{margin-left:auto;display:flex;gap:6px;font-size:14px;font-weight:500}
.dau nav a{padding:7px 14px;border-radius:99px;color:#33584A}.dau nav a.on{background:var(--la);color:#fff}
@media(max-width:960px){.dau nav{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#9FDCF3 0%,#CBEFFB 45%,#EAF8FC 70%)}
.hero .w{position:relative;z-index:2;display:grid;grid-template-columns:.95fr 1.05fr;align-items:end;min-height:min(800px,100vh);padding-top:100px}
.chu-hero{padding-bottom:150px}
.nhan{display:inline-block;background:#fff;color:var(--la);font-weight:700;font-size:14px;padding:6px 14px;border-radius:99px;box-shadow:0 4px 0 #D6EED8}
.hero h1{font-size:clamp(50px,6.4vw,92px);line-height:1;font-weight:800;color:#17462E;margin:18px 0 16px;letter-spacing:-.01em}
.hero h1 span{color:var(--la2)}
.hero p{font-size:18px;color:#2E5444;max-width:470px}
.nuts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.n{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:16px;font-weight:700;font-size:16px}
.n.xanh{background:var(--la);color:#fff;box-shadow:0 5px 0 #1E6A37}
.n.vang{background:var(--nang);color:#5A4300;box-shadow:0 5px 0 #D9A91F}
.n.trang{background:#fff;color:var(--la);box-shadow:0 5px 0 #CFE6D3}
.so3{display:flex;gap:12px;margin-top:30px}
.so3 div{background:rgba(255,255,255,.75);border-radius:18px;padding:10px 16px;font-size:13px;color:var(--phu);font-weight:500}
.so3 b{display:block;font-family:'Baloo 2';font-size:32px;line-height:1.1;color:#17462E}
.so3 div:nth-child(1) b{color:var(--cam)}.so3 div:nth-child(2) b{color:var(--la)}.so3 div:nth-child(3) b{color:var(--tim)}
.cay{position:relative;align-self:end;margin-bottom:-6px}
.cay svg{width:100%;height:auto;max-height:calc(100vh - 96px);display:block;margin:0 auto}
.doi{position:absolute;left:0;right:0;bottom:0;z-index:1;height:230px}
.doi svg{width:100%;height:100%;display:block}
.may{position:absolute;z-index:1;background:#fff;border-radius:99px;opacity:.9}
.may:before,.may:after{content:'';position:absolute;background:#fff;border-radius:50%}
.m1{width:150px;height:40px;top:130px;left:46%}.m1:before{width:60px;height:60px;left:22px;top:-30px}.m1:after{width:46px;height:46px;left:70px;top:-20px}
.m2{width:110px;height:30px;top:300px;left:52%;opacity:.7}.m2:before{width:44px;height:44px;left:18px;top:-22px}.m2:after{width:34px;height:34px;left:54px;top:-14px}
.mt{position:absolute;right:7%;top:96px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#FFF4B8 0,#FFD34E 55%,rgba(255,211,78,0) 72%);z-index:1}
/* phần */
.sec{padding:96px 0;position:relative}
.td{text-align:center;max-width:680px;margin:0 auto 46px}
.td .nhan{box-shadow:none;background:#E1F3DF}
.td h2{font-size:clamp(36px,4vw,54px);line-height:1.05;color:#17462E;margin:12px 0 10px;font-weight:800}
.td p{color:var(--phu);font-size:17px}
/* điểm danh: vườn 12 lớp */
.vuon{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;align-items:end}
.chau{text-align:center}
.chau .ca{position:relative;height:200px;display:flex;align-items:flex-end;justify-content:center}
.chau svg{width:100%;height:100%;overflow:visible}
.chau b{display:block;font-family:'Baloo 2';font-size:22px;color:#17462E;margin-top:6px;line-height:1}
.chau small{color:var(--phu);font-weight:600}
.dk{margin:50px auto 0;max-width:900px;background:#fff;border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:center;box-shadow:0 8px 0 #DDEFD9}
.dk .o{background:var(--dat);border-radius:14px;padding:14px 16px;color:#8AA597;font-weight:500}
.chip{display:flex;gap:8px;grid-column:1/3}.chip span{padding:8px 14px;border-radius:99px;background:var(--dat);font-weight:600;font-size:14px;color:var(--phu)}
.chip span.on{background:#DFF3D6;color:var(--la)}
.dk .n{grid-row:1/3;grid-column:3}
.thieu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
.thieu span{background:#FFF1D2;color:#8A5B00;border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px}
/* bản đồ */
.bd{background:linear-gradient(180deg,#E6F6FC,#D4EFF8)}
.bd .w{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.bd svg{width:100%;max-width:460px;display:block;margin:auto}
.bd .td{text-align:left;margin:0 0 26px}
.tp{display:grid;gap:12px}
.tp div{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 18px}
.tp i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px}
.tp b{font-family:'Baloo 2';font-size:28px;margin-left:auto;color:#17462E}
.tp span{font-weight:600}
.xa{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.xa span{background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:#2E5A7A}
/* việc */
.viec{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.v{border-radius:26px;padding:24px;position:relative;overflow:hidden}
.v .ic{font-size:34px}
.v h3{font-size:24px;line-height:1.15;margin:10px 0 6px;color:#17462E}
.v p{font-size:15px;color:#3D5A4C}
.v .ft{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700;font-size:14px}
.v .ft a{background:#fff;padding:8px 16px;border-radius:99px}
.v:after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:0 60% 0 60%;background:rgba(255,255,255,.35);transform:rotate(20deg)}
/* thư */
.thu{background:linear-gradient(180deg,#FFF7DA,#FFEDB8)}
.thu .w{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.thu .td{text-align:left;margin:0}
.phong{position:relative;width:min(400px,80vw);aspect-ratio:1.55;margin:auto;background:#fff;border-radius:16px;box-shadow:0 18px 0 -6px #F3D98A,0 30px 50px -20px rgba(140,100,0,.35);transform:rotate(-4deg)}
.phong:before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(to bottom right,transparent 49.5%,#EADFB8 50%,transparent 50.8%),linear-gradient(to bottom left,transparent 49.5%,#EADFB8 50%,transparent 50.8%);clip-path:polygon(0 0,100% 0,50% 60%)}
.phong .tem{position:absolute;right:16px;top:14px;width:62px;height:74px;background:var(--la2);border:4px dotted #fff;outline:2px solid var(--la2);display:grid;place-items:center;color:#fff;font:800 22px 'Baloo 2'}
.phong .la{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%)}
.dem{font-family:'Baloo 2';font-size:22px;color:#7A5A00;margin:16px 0 22px}.dem b{font-size:44px;color:var(--cam)}
/* hai cột */
.hai{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.khung{background:#fff;border-radius:28px;padding:30px;box-shadow:0 8px 0 #DDEFD9}
.khung h2{font-size:32px;color:#17462E;margin-bottom:16px}
.lc{border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;background:var(--dat);display:flex;justify-content:space-between;font-weight:600}
.lc i{position:absolute;inset:0 auto 0 0}.lc span,.lc b{position:relative}
.ng{display:flex;gap:14px;align-items:center;padding:12px 0}
.ng .a{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font:800 24px 'Baloo 2';color:#fff}
.ng b{display:block;font-size:17px}.ng small{color:var(--phu)}
.ng .g{margin-left:auto;display:flex;gap:6px}.ng .g a{padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;background:#DFF3D6;color:var(--la)}.ng .g a+a{background:#DCEBFF;color:#1F67D2}
/* tin */
.tin{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tin div{background:#fff;border-radius:24px;padding:22px;border-top:8px solid var(--la2)}
.tin div:nth-child(2){border-color:var(--nang)}.tin div:nth-child(3){border-color:var(--tim)}
.tin small{color:var(--phu);font-weight:600}.tin h3{font-size:22px;line-height:1.2;margin:6px 0;color:#17462E}.tin p{color:var(--phu);font-size:15px}
.cuoi{position:relative;background:linear-gradient(180deg,var(--dat),#CFEBC5);text-align:center;padding:90px 0 0;overflow:hidden}
.cuoi h2{font-size:clamp(38px,4.6vw,64px);color:#17462E;font-weight:800;line-height:1.05}
.cuoi p{color:var(--phu);margin-top:8px;font-size:18px}
.cuoi svg{display:block;width:100%;height:auto;margin-top:30px}
/* bảng màu */
.pal .mau{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pal .mau div{border-radius:24px;height:170px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;font-weight:600}
.pal .mau b{font-family:'Baloo 2';font-size:22px}
@media(max-width:820px){
 .w{padding:0 18px}
 .hero .w{grid-template-columns:1fr;padding-top:84px;min-height:0}
 .chu-hero{padding-bottom:10px}.hero h1{font-size:54px}.cay svg{max-height:none}
 .cay{margin:0 -18px -6px}.may{display:none}.mt{width:80px;height:80px;top:14px;right:4%}
 .doi{height:120px}
 .so3{gap:8px}.so3 div{flex:1;padding:8px 10px}.so3 b{font-size:26px}
 .sec{padding:64px 0}
 .vuon{grid-template-columns:repeat(4,1fr);gap:10px}.chau .ca{height:140px}.chau b{font-size:18px}
 .dk{grid-template-columns:1fr}.chip,.dk .n{grid-column:auto;grid-row:auto;flex-wrap:wrap}.dk .n{justify-content:center}
 .bd .w,.thu .w,.hai{grid-template-columns:1fr}
 .viec,.tin{grid-template-columns:1fr}
 .ng{flex-wrap:wrap}.ng .g{margin-left:68px}
 .pal .mau{grid-template-columns:1fr 1fr}
}

.hero2{position:relative;min-height:min(820px,100vh);overflow:hidden;background:#F7EFE2}
.hero2 .anh{position:absolute;inset:0;background:url(san-truong.jpg) left bottom/cover no-repeat}
.hero2 .anh:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,239,226,0) 30%,rgba(247,239,226,.55) 52%,rgba(247,239,226,.92) 66%),linear-gradient(0deg,var(--dat) 0,rgba(243,250,238,0) 16%)}
.hero2 .w{position:relative;z-index:2;min-height:min(820px,100vh);display:flex;justify-content:flex-end;align-items:center;padding-top:80px}
.chu2{width:min(520px,46%)}
.hero2 h1{font-size:clamp(50px,6vw,88px);line-height:1;font-weight:800;color:#17462E;margin:16px 0 14px}
.hero2 h1 span{color:var(--la)}
.hero2 p{font-size:18px;color:#3A4F44}
.pol{position:absolute;background:#fff;padding:10px 10px 34px;box-shadow:0 18px 30px -12px rgba(40,50,30,.45);z-index:3}
.pol img{display:block;width:100%;aspect-ratio:1.4;object-fit:cover}
.pol span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Baloo 2';font-weight:600;color:#3A4F44;font-size:15px}
.p1{width:220px;left:14%;bottom:110px;transform:rotate(-6deg)}
.p2{width:190px;left:30%;bottom:50px;transform:rotate(5deg)}
.dau .ten{background:rgba(255,255,255,.88);padding:4px 14px;border-radius:99px}
@media(max-width:1100px){.pol{display:none}}
@media(max-width:820px){
 .hero2 .anh{height:340px;bottom:auto;background-position:30% 100%}
 .hero2 .anh:after{background:linear-gradient(0deg,#F7EFE2 0,rgba(247,239,226,0) 40%)}
 .hero2 .w{display:block;padding-top:300px;padding-bottom:40px;min-height:0}
 .chu2{width:auto}.hero2 h1{font-size:52px}
}
