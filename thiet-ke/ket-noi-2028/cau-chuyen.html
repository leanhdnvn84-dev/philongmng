<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câu chuyện của mình</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Charm:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--la:#2F8F4E;--la2:#5DB860;--nang:#FFD34E;--cam:#FF9F43;--tim:#9B7FD4;--hong:#FF8FA3;--do:#D93A2B;--chu:#1F3B2D;--phu:#557063;--dat:#F3FAEE}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;color:var(--chu);line-height:1.65;overflow-x:hidden;background:#FFFDF7}
h1,h2,h3,.nam{font-family:'Baloo 2',sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1160px;margin:0 auto;padding:0 28px}
/* menu */
.dau{position:fixed;inset:0 0 auto;z-index:20;background:rgba(255,253,247,.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(47,143,78,.12)}
.dau .w{display:flex;align-items:center;height:62px;gap:14px}
.dau .ten{font-family:'Baloo 2';font-weight:700;font-size:19px;color:var(--la)}
.dau nav{margin-left:auto;display:flex;gap:4px;font-size:14px;font-weight:500}.dau nav a{padding:6px 12px;border-radius:99px;color:#33584A}.dau nav a.on{background:var(--la);color:#fff}
@media(max-width:960px){.dau nav{display:none}}
/* thanh năm bên trái */
.ray{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:14px}
.ray a{display:flex;align-items:center;gap:10px;font:700 13px 'Baloo 2';color:#7A9488}
.ray a i{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid currentColor}
.ray a.on{color:var(--la)}.ray a.on i{background:var(--la)}
@media(max-width:1300px){.ray{display:none}}
/* chương */
.ch{position:relative;padding:120px 0;overflow:hidden}
.mo{display:flex;align-items:baseline;gap:18px;margin-bottom:10px}
.nam{font-size:clamp(70px,10vw,150px);line-height:.85;font-weight:800;letter-spacing:-.02em}
.mo span:not(.nam){font:700 16px 'Be Vietnam Pro';padding:6px 14px;border-radius:99px;background:#fff}
.ch h2{font-size:clamp(36px,4.4vw,60px);line-height:1.05;font-weight:800;margin:6px 0 18px}
.ch p.k{font-size:19px;max-width:560px}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.viet{font-family:'Charm';font-size:26px;line-height:1.4}
/* 0 mở đầu */
.mo0{min-height:100vh;display:flex;align-items:center;background:linear-gradient(180deg,#FFF8E6 0%,#FFFDF7 100%);padding-top:62px}
.mo0 .w{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.mo0 h1{font-size:clamp(48px,6vw,86px);line-height:1.02;font-weight:800;color:#17462E}
.mo0 h1 em{font-style:normal;color:var(--cam)}.mo0 h1 b{color:var(--la)}
.mo0 p{font-size:19px;color:var(--phu);margin:18px 0 26px;max-width:520px}
.cuon{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--la)}
.cuon i{width:34px;height:34px;border-radius:50%;background:var(--la);color:#fff;display:grid;place-items:center;font-style:normal}
.dong-nam{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px}
.dong-nam a{font:700 15px 'Baloo 2';padding:7px 14px;border-radius:12px;color:#fff}
.chong{position:relative;height:460px}
.pol{position:absolute;background:#fff;padding:10px 10px 38px;box-shadow:0 20px 34px -14px rgba(60,40,10,.45)}
.pol img{display:block;width:100%;aspect-ratio:1.35;object-fit:cover}
.pol span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:'Charm';font-size:20px;color:#444}
/* 2000 */
.c2000{background:#FFF8E6}
.c2000 .nam{color:var(--cam)}
.so4{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.so4 div{background:#fff;border-radius:20px;padding:16px;text-align:center;box-shadow:0 6px 0 #F5E3B8}
.so4 b{display:block;font:800 40px 'Baloo 2';color:var(--cam);line-height:1.1}.so4 span{color:var(--phu);font-weight:600;font-size:14px}
.nho3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nho3 div{background:#fff;border-radius:22px;padding:20px;transform:rotate(var(--r));box-shadow:0 10px 24px -14px rgba(120,80,0,.4)}
.nho3 b{font:700 20px 'Baloo 2';display:block;color:#7A4A00}.nho3 p{font-size:15px;color:#6B5A3E}
.nho3 i{font-size:30px;font-style:normal}
/* 2003 */
.c2003{background:linear-gradient(180deg,#FFEDE6,#FFF6F0);}
.c2003 .nam{color:var(--do)}
.c2003 .tranh{border-radius:28px;min-height:440px;background:url(san-truong-phuong.jpg) center/cover;box-shadow:0 30px 50px -30px rgba(150,40,20,.5)}
.lb{background:#fff;border-radius:6px;padding:22px 26px;margin-top:24px;box-shadow:0 12px 26px -14px rgba(150,40,20,.4);transform:rotate(-1.5deg);background-image:repeating-linear-gradient(#fff 0 33px,#F3D6CF 33px 34px);max-width:520px}
.lb .viet{color:#7A2418}.lb small{display:block;text-align:right;font-weight:600;color:#9A5A4E;margin-top:6px}
/* xa cách */
.cxa{background:linear-gradient(180deg,#E6F4FC,#F1F9FD)}
.cxa .nam{color:#2E86C1;font-size:clamp(56px,8vw,120px)}
.doi-nguoi{display:flex;gap:0;margin:40px 0 10px;position:relative}
.doi-nguoi:before{content:'';position:absolute;left:0;right:0;top:22px;height:4px;background:repeating-linear-gradient(90deg,#9CCDE8 0 12px,transparent 12px 20px)}
.doi-nguoi div{flex:1;position:relative;padding-top:56px;text-align:center}
.doi-nguoi div:before{content:attr(data-i);position:absolute;left:50%;top:0;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #4DB6E8;display:grid;place-items:center;font-size:22px}
.doi-nguoi b{display:block;font:700 18px 'Baloo 2';color:#1E5B82}.doi-nguoi span{font-size:14px;color:#4A6A80}
.bd svg{width:100%;max-width:400px;display:block;margin:auto}
.tp{display:grid;gap:10px;margin-top:24px}.tp div{display:flex;justify-content:space-between;background:#fff;border-radius:16px;padding:12px 18px;font-weight:600}.tp b{font:800 24px 'Baloo 2'}
/* gala */
.cgala{background:linear-gradient(180deg,#FFF3D6,#FFE8C2)}
.cgala .nam{color:#C0392B}
.gala-anh{border-radius:28px;min-height:480px;background:url(ngay-tro-ve.jpg) center 30%/cover;position:relative;box-shadow:0 30px 50px -30px rgba(150,80,0,.55)}
.gala-anh .tem{position:absolute;right:-14px;bottom:30px;background:#C0392B;color:#fff;padding:12px 20px;border-radius:14px;font:800 20px 'Baloo 2';transform:rotate(4deg);box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.so-g{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
.so-g div{background:#fff;border-radius:18px;padding:12px 18px}.so-g b{font:800 32px 'Baloo 2';color:#C0392B;display:block;line-height:1.1}.so-g span{font-size:14px;color:#7A5A3E;font-weight:600}
.n{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:16px;font-weight:700;font-size:16px}
.n.xanh{background:var(--la);color:#fff;box-shadow:0 5px 0 #1E6A37}.n.vang{background:var(--nang);color:#5A4300;box-shadow:0 5px 0 #D9A91F}
.n.do{background:#C0392B;color:#fff;box-shadow:0 5px 0 #8E2318}.n.trang{background:#fff;color:var(--la);box-shadow:0 5px 0 #CFE6D3}
.nuts{display:flex;gap:12px;flex-wrap:wrap}
/* bây giờ */
.cnay{background:var(--dat)}
.cnay .nam{color:var(--la);font-size:clamp(56px,8vw,120px)}
.dem{display:flex;gap:10px;margin:22px 0}
.dem div{background:#fff;border-radius:18px;padding:12px 16px;text-align:center;min-width:84px;box-shadow:0 5px 0 #D7EDD2}
.dem b{display:block;font:800 36px 'Baloo 2';color:var(--la);line-height:1.1}.dem span{font-size:13px;color:var(--phu);font-weight:600}
.vuon{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:40px}
.lopb{background:#fff;border-radius:22px;padding:14px 14px 8px;border-top:6px solid var(--c);box-shadow:0 6px 0 #DDEFD9}
.lopb .tl{display:flex;justify-content:space-between;align-items:baseline}.lopb b{font-family:'Baloo 2';font-size:24px;color:#17462E}.lopb .tl span{font-weight:700;color:var(--phu);font-size:14px}
.lopb svg{width:100%;height:auto;display:block;margin-top:4px}
.bon{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.bon div{border-radius:24px;padding:22px}.bon i{font-size:32px;font-style:normal}.bon h3{font-size:22px;line-height:1.15;margin:8px 0 6px}.bon p{font-size:15px;color:#3D5A4C}
.bon a{display:inline-block;margin-top:12px;background:#fff;padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px}
/* 2028 */
.c2028{background:linear-gradient(180deg,#E9F7E4,#F6FBF2)}
.c2028 .nam{color:var(--la)}
.c2028 .tranh{border-radius:28px;min-height:460px;background:url(san-truong.jpg) left bottom/cover;box-shadow:0 30px 50px -30px rgba(30,90,40,.5)}
.lich{background:#fff;border-radius:22px;padding:6px 20px;margin-top:22px;box-shadow:0 6px 0 #D7EDD2}
.lich div{display:flex;gap:16px;padding:12px 0;border-bottom:1px dashed #CFE3CB}.lich div:last-child{border:0}
.lich b{font:800 18px 'Baloo 2';color:var(--la);min-width:64px}
/* sau nữa */
.csau{background:linear-gradient(180deg,#F1ECFB,#FFF4F6);text-align:center}
.csau .nam{color:var(--tim)}
.moc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:46px auto 0;max-width:960px}
.moc div{background:#fff;border-radius:26px;padding:30px 20px;box-shadow:0 8px 0 #E3DAF5}
.moc b{display:block;font:800 52px 'Baloo 2';line-height:1;color:var(--tim)}.moc strong{display:block;font:700 20px 'Baloo 2';margin:6px 0}.moc p{font-size:15px;color:#6A5A80}
.moc div:nth-child(2){opacity:.8}.moc div:nth-child(3){opacity:.6}
.ket{padding:110px 0 80px;text-align:center;background:linear-gradient(180deg,#FFF4F6,#FFFDF7)}
.ket h2{font-size:clamp(44px,6vw,84px);font-weight:800;color:#17462E;line-height:1}
.ket .viet{color:var(--do);margin:16px 0 26px}
.bll{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.bll div{background:#fff;border-radius:18px;padding:12px 18px;font-weight:600}.bll small{display:block;color:var(--phu);font-weight:500}
@media(max-width:820px){
 .w{padding:0 18px}.ch{padding:72px 0}
 .mo0 .w,.hai{grid-template-columns:1fr;gap:30px}
 .chong{height:340px}.mo0{padding-top:96px;min-height:0}.mo0 h1{font-size:42px}
 .nho3,.so4{grid-template-columns:1fr 1fr 1fr;gap:8px}.nho3{grid-template-columns:1fr}
 .so4 b{font-size:30px}
 .doi-nguoi{flex-wrap:wrap;row-gap:24px}.doi-nguoi div{flex:0 0 50%}.doi-nguoi:before{display:none}
 .vuon{grid-template-columns:repeat(2,1fr)}.bon{grid-template-columns:1fr 1fr}.moc{grid-template-columns:1fr}
 .c2003 .tranh,.c2028 .tranh{min-height:260px}.gala-anh{min-height:300px}
 .dem div{min-width:0;flex:1}
 .hai.dao>:first-child{order:2}
}
</style></head><body><div id="app"></div>

 var vn='M150 18 L178 30 L196 58 L214 72 L236 92 L222 110 L204 120 L196 146 L208 176 L226 206 L246 232 L262 256 L280 284 L296 316 L304 352 L300 390 L284 418 L258 438 L230 452 L202 472 L176 496 L150 512 L132 500 L146 476 L172 456 L200 436 L230 410 L246 380 L250 346 L240 312 L222 284 L204 258 L184 232 L166 206 L150 176 L138 150 L124 124 L104 100 L80 82 L66 60 L92 46 L122 36Z';
