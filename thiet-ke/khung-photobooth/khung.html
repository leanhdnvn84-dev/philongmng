<!doctype html><html lang="vi"><head><meta charset="utf-8">
<title>Khung photo booth Gala</title>
<!-- Khung photo booth 4x6 inch (1200x1800 px = 300 dpi), 2 ô ảnh trong suốt, theo mẫu người dùng gửi (mau-xanh.jpg, mau-vang.jpg).
     khung.html?m=xanh|vang   &xem=1 → đặt ảnh mẫu dưới khung để xem trước.   render.js → khung-*.png + xem-truoc-*.jpg -->
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:1800px;overflow:hidden;background:transparent}
.k{position:relative;width:1200px;height:1800px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif}
.ab{position:absolute}
.xem{position:absolute;inset:0;background:center/1200px 1800px no-repeat}
.nen{position:absolute;inset:0}
.vien{position:absolute;border:7px solid #fff;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 6px 18px rgba(40,60,10,.18)}
.chu{position:absolute;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(60,80,10,.35)}
.t1{top:36px;font-size:40px;font-weight:800;letter-spacing:.02em}
.t2{top:88px;font-size:31px;font-weight:500;letter-spacing:.03em}
.ve{top:1514px;font:400 122px/1 'Sriracha',cursive;text-shadow:0 3px 10px rgba(60,80,10,.35)}
.g1{top:1664px;font-size:37px;font-weight:700;letter-spacing:.02em}
.g2{top:1712px;font-size:33px;font-weight:500}
svg{position:absolute;overflow:visible}
</style></head><body><div class="k" id="k"></div>
<script>
const Q=new URLSearchParams(location.search),M=Q.get('m')||'xanh',XEM=Q.get('xem');
const W1={x:66,y:140,w:1078,h:664},W2={x:66,y:836,w:1078,h:664},R=14;
const MAU={
 xanh:{nen:'linear-gradient(165deg,#E6EC7A 0%,#B9D84C 30%,#8DC63F 58%,#A6D046 80%,#D3E35E 100%)',
  loang:['rgba(255,250,170,.75)','rgba(255,255,255,.35)','rgba(120,180,40,.45)'],bong:'rgba(60,90,10,.35)'},
 vang:{nen:'linear-gradient(165deg,#FFE97A 0%,#FFDB3A 35%,#FFD21A 65%,#FFE04A 100%)',
  loang:['rgba(255,255,255,.7)','rgba(255,250,215,.6)','rgba(255,196,0,.35)'],bong:'rgba(150,110,0,.35)'}
}[M];
/* ô trong suốt: path evenodd với góc bo */
const oPath=o=>{const {x,y,w,h}=o;return 'M'+(x+R)+' '+y+'H'+(x+w-R)+'A'+R+' '+R+' 0 0 1 '+(x+w)+' '+(y+R)+'V'+(y+h-R)+'A'+R+' '+R+' 0 0 1 '+(x+w-R)+' '+(y+h)+'H'+(x+R)+'A'+R+' '+R+' 0 0 1 '+x+' '+(y+h-R)+'V'+(y+R)+'A'+R+' '+R+' 0 0 1 '+(x+R)+' '+y+'Z'};
const CLIP="path(evenodd,'M0 0H1200V1800H0Z "+oPath(W1)+' '+oPath(W2)+"')";
/* lá xanh mờ (bokeh) */
const la=(x,y,s,r,b,mau,op)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(120*s)+'px;height:'+(60*s)+'px;transform:rotate('+r+'deg);filter:blur('+b+'px);opacity:'+op+'" viewBox="0 0 120 60"><path d="M2 30C30 0 90 -4 118 30C90 64 30 60 2 30Z" fill="'+mau+'"/><path d="M6 30H112" stroke="rgba(255,255,255,.35)" stroke-width="2"/></svg>';
const LA=[[-60,-30,2.2,30,10,'#5FA62C',.85],[40,-50,1.6,-20,14,'#7CC242',.7],[930,-40,2.4,150,12,'#6DB536',.8],[1050,60,1.5,110,8,'#9ED45A',.75],
 [-80,1580,2.6,-30,12,'#5FA62C',.85],[60,1700,1.8,10,16,'#7CC242',.7],[1000,1560,2.4,200,10,'#5FA62C',.85],[880,1700,2,-160,14,'#8CCB4A',.75],
 [-90,700,1.8,70,16,'#6DB536',.6],[1090,820,1.9,-60,16,'#6DB536',.6],[1110,1180,1.5,40,12,'#9ED45A',.6],[-70,1200,1.5,-110,14,'#7CC242',.55]];
/* loang màu nước */
const loang=(x,y,w,h,c,b)=>'<div class="ab" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;border-radius:50%;background:radial-gradient(closest-side,'+c+',transparent);filter:blur('+b+'px)"></div>';
/* hoa cúc */
const cuc=(x,y,s,r)=>{let p='';for(let i=0;i<20;i++)p+='<ellipse cx="0" cy="-27" rx="7.5" ry="24" fill="url(#ca)" stroke="#D9DCD2" stroke-width=".8" transform="rotate('+(i*18+(i%2)*4)+')"/>';
 return '<svg style="left:'+(x-60*s)+'px;top:'+(y-60*s)+'px;width:'+(120*s)+'px;height:'+(120*s)+'px;transform:rotate('+r+'deg)" viewBox="-60 -60 120 120"><defs><radialGradient id="ca" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#E9ECE2"/><stop offset=".4" stop-color="#fff"/></radialGradient><radialGradient id="cn"><stop offset="0" stop-color="#FFE14A"/><stop offset=".7" stop-color="#F5B91A"/><stop offset="1" stop-color="#D99210"/></radialGradient></defs>'+p+'<circle r="15" fill="url(#cn)"/><circle r="15" fill="none" stroke="#C98410" stroke-width="1" stroke-dasharray="1.5 2.5"/></svg>'};
const laCuc=(x,y,s,r)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(90*s)+'px;height:'+(36*s)+'px;transform:rotate('+r+'deg)" viewBox="0 0 90 36"><path d="M2 18C20 2 66 0 88 18C66 34 20 34 2 18Z" fill="#5E9E2F"/><path d="M6 18H84" stroke="#86C24C" stroke-width="1.5"/></svg>';
/* máy bay giấy + tim nét đứt + sách */
const mayBay=(x,y,s)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(150*s)+'px;height:'+(110*s)+'px" viewBox="0 0 150 110"><path d="M10 52L140 8L60 70Z" fill="#fff"/><path d="M60 70L140 8L74 98Z" fill="#E8EEF2"/><path d="M60 70L66 88L74 98" fill="#C9D3DA"/><path d="M10 52L60 70L140 8" fill="none" stroke="#B9C6CF" stroke-width="1.5"/></svg>';
const tim=(x,y,s)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(170*s)+'px;height:'+(120*s)+'px" viewBox="0 0 170 120"><path d="M160 6C120 30 70 30 70 62C70 84 96 92 104 74C112 56 86 46 70 66C56 84 40 100 10 112" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round"/></svg>';
const timNho=(x,y,s)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(70*s)+'px;height:'+(60*s)+'px" viewBox="0 0 70 60"><path d="M35 54C10 38 4 26 6 16C9 4 26 2 35 16C44 2 61 4 64 16C66 26 60 38 35 54Z" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/></svg>';
const sach=(x,y,s,r)=>'<svg style="left:'+x+'px;top:'+y+'px;width:'+(200*s)+'px;height:'+(130*s)+'px;transform:rotate('+r+'deg);filter:drop-shadow(0 6px 8px '+MAU.bong+')" viewBox="0 0 200 130"><path d="M100 30C70 10 30 8 6 18V112C30 102 70 104 100 124Z" fill="#B23A2E"/><path d="M100 30C130 10 170 8 194 18V112C170 102 130 104 100 124Z" fill="#B23A2E"/><path d="M100 24C72 4 34 2 12 12V104C34 94 72 96 100 116Z" fill="#fff"/><path d="M100 24C128 4 166 2 188 12V104C166 94 128 96 100 116Z" fill="#F4F1EA"/><path d="M100 24V116" stroke="#D8D2C6" stroke-width="2"/><g fill="none" stroke="#E3DED4" stroke-width="1.5"><path d="M24 30C48 24 72 28 90 38M24 46C48 40 72 44 90 54M24 62C48 56 72 60 90 70M110 38C128 28 152 24 176 30M110 54C128 44 152 40 176 46M110 70C128 60 152 56 176 62"/></g></svg>';

let h='';
if(XEM)h+='<div class="xem" style="background-image:url(mau-'+M+'.jpg)"></div>';
h+='<div class="nen" style="clip-path:'+CLIP+'"><div class="ab" style="inset:0;background:'+MAU.nen+'"></div>'+
 loang(700,-200,800,600,MAU.loang[0],30)+loang(-200,500,700,500,MAU.loang[1],40)+loang(500,1350,900,500,MAU.loang[0],40)+loang(-300,1500,800,500,MAU.loang[2],40)+loang(800,600,700,600,MAU.loang[1],50)+
 LA.map(a=>la.apply(null,a)).join('')+'</div>';
h+='<div class="vien" style="left:'+(W1.x-4)+'px;top:'+(W1.y-4)+'px;width:'+(W1.w+8)+'px;height:'+(W1.h+8)+'px"></div>';
h+='<div class="vien" style="left:'+(W2.x-4)+'px;top:'+(W2.y-4)+'px;width:'+(W2.w+8)+'px;height:'+(W2.h+8)+'px"></div>';
h+='<div class="chu t1">TRƯỜNG THPT NGUYỄN HIỀN</div><div class="chu t2">ĐÀ NẴNG - THỨ 7 - 14.11.2026</div>';
/* hoa cúc ở góc dưới phải ô 1 và góc dưới trái ô 2 */
h+=laCuc(1020,742,1.3,-35)+laCuc(1080,690,1.1,-80)+cuc(1100,720,1.05,10)+cuc(1052,778,.85,-15)+cuc(1150,790,.7,25)+
   laCuc(10,1440,1.3,200)+laCuc(70,1470,1.1,160)+cuc(70,1415,1.05,-8)+cuc(130,1478,.85,12)+cuc(32,1490,.7,-20);
/* chân: sách + máy bay giấy + tim */
h+=sach(34,1610,.86,-12)+mayBay(980,1520,1.05)+tim(930,1610,1.2)+timNho(1100,1735,.9);
h+='<div class="chu ve">Về Đi bạn ơi!</div><div class="chu g1">GALA GẶP MẶT CỰU HỌC SINH</div><div class="chu g2">( Niên Khóa 2000 - 2003 )</div>';
document.getElementById('k').innerHTML=h;
</script></body></html>
