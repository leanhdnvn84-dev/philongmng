<!doctype html><html lang="vi"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Patrick+Hand&family=Sriracha&family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}

<script>

const op=([x,y,w,h])=>{const R=t.r;if(!R)return 'M'+x+' '+y+'H'+(x+w)+'V'+(y+h)+'H'+x+'Z';
 return 'M'+(x+R)+' '+y+'H'+(x+w-R)+'A'+R+' '+R+' 0 0 1 '+(x+w)+' '+(y+R)+'V'+(y+h-R)+'A'+R+' '+R+' 0 0 1 '+(x+w-R)+' '+(y+h)+'H'+(x+R)+'A'+R+' '+R+' 0 0 1 '+x+' '+(y+h-R)+'V'+(y+R)+'A'+R+' '+R+' 0 0 1 '+(x+R)+' '+y+'Z'};
const CLIP="path(evenodd,'M0 0H"+W+'V'+H+'H0Z '+O.map(op).join(' ')+"')";
/* trang trí */
const cuc=(x,y,s,r)=>{let p='';for(let i=0;i<20;i++)p+='<ellipse cx="0" cy="-27" rx="7.5" ry="24" fill="#fff" stroke="#D9DCD2" stroke-width=".8" transform="rotate('+(i*18+(i%2)*4)+')"/>';

   '<div class="canh" style="left:'+(l[0]+l[2]-(B===3?110:210)*sc)+'px;top:'+(l[1]+l[3]-120*sc)+'px;width:'+(330*sc)+'px;height:'+(220*sc)+'px;transform:scale(-1,-1) rotate(8deg)"></div>';
 if(k==='cuc'){const a=f[0]+f[2],b=f[1]+f[3],c=l[0],d=l[1]+l[3];
   tr+=laCuc(a-120,b-60,1.3,-35)+laCuc(a-60,b-110,1.1,-80)+cuc(a-30,b-50,1.05*sc,10)+cuc(a-90,b+10,.85*sc,-15)+cuc(a+18,b+18,.7*sc,25)+
       laCuc(c-50,d-30,1.3,200)+laCuc(c+10,d,1.1,160)+cuc(c,d-60,1.05*sc,-8)+cuc(c+70,d+4,.85*sc,12)+cuc(c-30,d+16,.7*sc,-20)}
 if(k==='bang')O.forEach(([x,y,w,h],i)=>{tr+='<div class="bang" style="left:'+(x-55)+'px;top:'+(y-4)+'px;transform:rotate(-38deg)"></div><div class="bang" style="left:'+(x+w-95)+'px;top:'+(y-4)+'px;transform:rotate(38deg)"></div>'});
 if(k==='goc'){const g=(x,y,sx,sy)=>'<svg style="left:'+x+'px;top:'+y+'px;width:90px;height:90px;transform:scale('+sx+','+sy+')" viewBox="0 0 90 90"><path d="M4 86V4H86" fill="none" stroke="#E8C26A" stroke-width="4"/><path d="M16 86V16H86" fill="none" stroke="#E8C26A" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="#E8C26A"/></svg>';
   tr+=g(18,18,1,1)+g(W-108,18,-1,1)+g(18,H-108,1,-1)+g(W-108,H-108,-1,-1)}
 if(k==='may')[[W*.08,O[0][1]+O[0][3]*.3,260],[W*.78,O[0][1]+40,300],[W*.85,H*.55,240],[W*.02,H*.62,220]].forEach(([x,y,w])=>{tr=('<div class="ab" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+(w*.4)+'px;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));filter:blur(4px)"></div>')+tr});
 if(k==='phan'){const s=(x,y,z)=>'<div class="ab" style="left:'+x+'px;top:'+y+'px;font:400 '+z+'px \'Patrick Hand\';color:rgba(255,255,255,.75)">✦</div>';
   tr+=s(60,40,40)+s(W-100,60,30)+s(40,H-200,34)+s(W-90,H-260,44)}
});

if(B===1){
 chan='<div class="ab" style="left:120px;right:120px;top:1030px;height:150px;display:flex;align-items:center;justify-content:space-between">'+
  '<div style="display:flex;align-items:center">'+logo(118)+'<div style="margin-left:24px;color:'+t.nh+';font:700 28px \'Noto Serif\';letter-spacing:.08em;line-height:1.4;'+bo+'">THPT NGUYỄN HIỀN<span style="display:block;color:'+t.ch+';font-size:24px;font-weight:600;letter-spacing:.04em">Niên khoá 2000 – 2003</span></div></div>'+

}else{

  '<div class="ab c" style="left:0;right:0;top:'+y0+'px;font:'+t.ft+';font-size:'+z+'px;line-height:1.15;color:'+t.tm+';'+bo+'">'+t.td+'</div>'+

  '<div class="ab c" style="left:0;right:0;top:'+(y0+z*1.24+(B===2?68:54))+'px;color:'+t.nh+';font:700 '+(B===2?31:28)+'px \'Noto Serif\';letter-spacing:.1em;'+bo+'">GALA GẶP MẶT <b style="color:'+t.vach+';font-weight:400;margin:0 12px">✦</b> 14 . 11 . 2026</div>';

let h=(XEM?O.map(([x,y,w,hh],i)=>'<div class="xem" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+hh+'px;background-image:url('+XA[i]+')"></div>').join(''):'')+

 tr+chan;
