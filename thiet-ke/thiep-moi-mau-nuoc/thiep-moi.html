<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Thiệp mời Ngày trở về – Gala Nguyễn Hiền 2000 – 2003</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@700&family=Playfair+Display:wght@600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Thiệp A5 dọc trên nền tranh màu nước "Ngày trở về" (người dùng gửi); thông tin đặt vào vùng giấy trống bên phải. 2 trang: mời bạn · mời Thầy/Cô */
@page{size:148mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d8d2c6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
@media print{body{padding:0;gap:0;background:none}}
:root{--do:#A3281F;--do2:#C0392B;--chu:#3B3330;--xam:#6D625C;--vang:#B9893B}
.tr{position:relative;width:148mm;height:210mm;overflow:hidden;background:#FAF3E7 url(nen-2x.jpg) center/100% 100% no-repeat;color:var(--chu);font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums;break-after:page}
.tr:last-child{break-after:auto}
/* khối thông tin theo mẫu người dùng duyệt (17/10): căn giữa ở x≈97mm, từ y≈103mm; chữ Noto Serif */
.kh{position:absolute;left:63.5mm;width:67mm;top:103.5mm;text-align:center;font-family:'Noto Serif',serif;color:#3B3330}
.kh .tieu{font-weight:700;font-size:3.1mm;letter-spacing:.15mm;color:var(--do)}
.kh .dong{margin-top:1.2mm;font-size:2.75mm}
.kh .dong span{display:inline-block;width:36mm;border-bottom:.3mm dotted #3B3330;height:3mm;vertical-align:baseline}
.kh .dong span.ngan{width:9mm}
.kh .loi{margin-top:1.6mm;font-size:2.68mm;line-height:1.36;font-style:normal;font-family:'Noto Serif',serif;color:#3B3330}
.kh .ke{height:.22mm;background:var(--do2);opacity:.85;margin:1.8mm 0 0}
.kh .gio{margin-top:1.6mm;font-weight:700;font-size:3.85mm;color:var(--do);letter-spacing:.05mm}
.kh .dd{margin-top:1.2mm;font-size:2.8mm;color:#3B3330}
.kh .dd span{display:inline-block;width:40mm;border-bottom:.3mm dotted #3B3330;height:3mm;vertical-align:baseline}
.kh .vd{margin-top:1.6mm;font-style:italic;font-size:2.68mm;line-height:1.5}
.kh .dg{margin-top:1.4mm;font-size:2.55mm;line-height:1.55}
.kh .dg b{font-weight:700;font-size:2.95mm}
.kh .dg em{display:block}
.kh .bll{margin-top:1.6mm;font-size:2.45mm;line-height:1.62}
.kh .bll b{display:block;font-weight:700;font-size:2.45mm;letter-spacing:.1mm}
</style></head>
<body>
<section class="tr" id="ban"></section>
<section class="tr" id="thay"></section>
<script>
const BLL=[['Lê Trung Hiếu','0905 394 493'],['Hoàng Diệu Thúy','0905 865 867'],['Nguyễn Thị Tuyết Mai','0905 516 896']];
/* Nhà hàng chưa chốt → dòng chấm ghi tay; có tên thì điền NHA_HANG rồi xuất lại */
const NHA_HANG='';
const LOI_BAN='Qua tháng năm, mỗi người một hành trình,<br>nhưng vẫn chung một miền ký ức Nguyễn Hiền.<br>Mời bạn trở về, gặp lại Thầy Cô, bạn cũ,<br>kể nhau nghe những câu chuyện đã qua<br>và nối dài tình bạn từ mái trường thân yêu.';
const LOI_THAY='Dẫu đã rời xa mái trường Nguyễn Hiền,<br>những bài học và tình thương của Thầy Cô<br>vẫn theo chúng em trên mỗi chặng đường.<br>Kính mời Thầy/Cô về dự đêm Gala để chúng em<br>được sum vầy, tri ân và ôn lại kỷ niệm xưa.';
function trang(ban){return `<div class="kh">
 <div class="tieu">${ban?'THÂN MỜI BẠN VỀ DỰ':'TRÂN TRỌNG KÍNH MỜI'}</div>
 <div class="dong">${ban?'Bạn:':'Thầy/Cô:'} <span></span></div>
 ${ban?'<div class="dong">Lớp 12/<span class="ngan"></span></div>':''}
 <p class="loi">${ban?LOI_BAN:LOI_THAY}</p>
 <div class="ke"></div>
 <div class="gio">17:00 · THỨ BẢY · 14.11.2026</div>
 <div class="dd">Địa điểm: ${NHA_HANG?`<b>${NHA_HANG}</b>`:'<span></span>'}</div>
 ${ban?'<div class="dg"><b>Đóng góp: 700.000đ/người</b><br>(Áo kỷ niệm, suất tiệc, hoa và quà tri ân Thầy Cô)<em>Xác nhận trước ngày 25/10/2026</em></div>'
 :'<div class="vd">Sự hiện diện của Thầy/Cô là niềm vinh dự<br>và món quà quý giá đối với chúng em.</div>'}
 <div class="ke"></div>
 <div class="bll"><b>BAN LIÊN LẠC NIÊN KHÓA 2000 - 2003</b>${BLL.map(x=>`${x[0]}: ${x[1]}`).join('<br>')}</div>
</div>`}
document.getElementById('ban').innerHTML=trang(true);document.getElementById('thay').innerHTML=trang(false);
</script>
</body></html>
