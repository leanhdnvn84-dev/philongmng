<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Backdrop Gala Nguyễn Hiền 2000 – 2003</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Dancing+Script:wght@700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Mọi kích thước theo vw (1vw = 1% bề ngang phông) → in khổ nào cũng giữ đúng tỉ lệ 2:1 */
@page{size:300cm 150cm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:50vw;overflow:hidden;background:#3AB37E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#bd{position:relative;width:100vw;height:50vw;overflow:hidden;color:#FFF5E1;font-family:'Be Vietnam Pro',sans-serif;
 background:radial-gradient(ellipse 62% 72% at 50% 40%,#6DCF9C 0%,#53BD8B 50%,#3AB37E 100%)}
/* tia sáng mờ sau tiêu đề */
#bd .tia{position:absolute;left:50%;top:40%;width:120vw;height:120vw;transform:translate(-50%,-50%);
 background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.07) 0deg 4deg,transparent 4deg 12deg);
 -webkit-mask:radial-gradient(circle,#000 0%,#000 25%,transparent 60%);mask:radial-gradient(circle,#000 0%,#000 25%,transparent 60%)}
/* khung viền vàng đôi */
#bd .vien{position:absolute;inset:1.4vw;border:.22vw solid #E8B04A;border-radius:1vw}
#bd .vien2{position:absolute;inset:2vw;border:.08vw solid rgba(232,176,74,.7);border-radius:.7vw}
#bd svg.hoa{position:absolute;overflow:visible}
#bd .nd{position:absolute;left:0;right:0;top:3.4vw;text-align:center;display:flex;flex-direction:column;align-items:center}
#bd .logo{width:7.2vw;height:7.2vw;border-radius:50%;background:#FFF8EC;padding:.5vw;box-shadow:0 0 0 .22vw #E8B04A,0 .6vw 1.6vw rgba(0,0,0,.35)}
#bd .logo img{width:100%;height:100%;display:block}
#bd .truong{margin-top:1.1vw;font-weight:800;font-size:1.45vw;letter-spacing:.42vw;color:#0A4A35}
#bd h1{font-family:'Dancing Script',cursive;font-weight:700;font-size:8.8vw;line-height:1;margin-top:.4vw;color:#FFF1D6;
 text-shadow:0 .35vw 0 #0A4A35,0 .7vw 1.6vw rgba(0,0,0,.45)}
#bd .gala{font-family:'Playfair Display',serif;font-weight:900;font-size:3.7vw;letter-spacing:.32vw;margin-top:.8vw;
 color:#F2C86B;text-shadow:0 .25vw 0 #0A4A35,0 .5vw 1.2vw rgba(0,0,0,.35)}
#bd .nk{display:flex;align-items:center;gap:1.4vw;margin-top:1vw}
#bd .nk i{display:block;width:9vw;height:.14vw;background:linear-gradient(90deg,transparent,#E8B04A)}
#bd .nk i+b+i{background:linear-gradient(270deg,transparent,#E8B04A)}
#bd .nk b{font-weight:800;font-size:2.1vw;letter-spacing:.3vw;color:#0A4A35;background:linear-gradient(180deg,#FFE7A8,#E8B04A);padding:.45vw 2.2vw;border-radius:5vw;box-shadow:0 .3vw .8vw rgba(0,0,0,.3)}
#bd .cau{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:2vw;margin-top:1.1vw;color:#0A4A35}
#bd .ngay{margin-top:1.3vw;font-weight:700;font-size:1.7vw;letter-spacing:.25vw;color:#0A4A35}
#bd .ngay span{color:#B94C32;margin:0 .8vw}
#bd .lop{position:absolute;left:0;right:0;bottom:2.9vw;display:flex;justify-content:center;gap:.8vw}
#bd .lop span{width:4.1vw;height:4.1vw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25vw;color:#FFF1D6;
 border:.14vw solid #E8B04A;background:rgba(10,74,53,.6)}
</style></head>
<body><div id="bd">
 <div class="tia"></div><div class="vien"></div><div class="vien2"></div>
 <div id="hoaLop"></div>
 <div class="nd">
  <div class="logo"><img src="logo-1600.png" alt=""></div>
  <div class="truong">TRƯỜNG THPT NGUYỄN HIỀN · ĐÀ NẴNG</div>
  <h1>Về đi bạn ơi!</h1>
  <div class="gala">GALA GẶP MẶT CỰU HỌC SINH</div>
  <div class="nk"><i></i><b>NIÊN KHOÁ 2000 – 2003</b><i></i></div>
  <div class="cau">“Hai mươi ba năm – Một mái trường – Một đại gia đình”</div>
  <div class="ngay">THỨ BẢY<span>✦</span>14 . 11 . 2026<span>✦</span>ĐÀ NẴNG</div>
 </div>
 <div class="lop"></div>
</div>
<script>
// 12 lớp ở chân phông
document.querySelector('.lop').innerHTML=Array.from({length:12},(_,i)=>'<span>12/'+(i+1)+'</span>').join('');
// Chùm hoa phượng vẽ bằng SVG (vector, in to không vỡ)
const NS='http://www.w3.org/2000/svg';
function hoa(x,y,k,r,mau){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${k})">`+[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-15" rx="9" ry="15" fill="${a===0?'#F2C86B':mau}" transform="rotate(${a})"/>`).join('')+`<circle r="4.5" fill="#FFE29A"/>`+[0,40,80,120,160,200,240,280,320].map(a=>`<line x1="0" y1="0" x2="0" y2="-11" stroke="#FFD27A" stroke-width="1" transform="rotate(${a})"/>`).join('')+'</g>'}
function la(x,y,r,k){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${k})"><path d="M0 0 Q 40 -6 90 0" stroke="#8CC97A" stroke-width="2.5" fill="none"/>`+Array.from({length:9},(_,i)=>`<ellipse cx="${10+i*9}" cy="-5" rx="3.6" ry="7" fill="#A6D98F" transform="rotate(-25 ${10+i*9} -5)"/><ellipse cx="${10+i*9}" cy="5" rx="3.6" ry="7" fill="#7DBF68" transform="rotate(25 ${10+i*9} 5)"/>`).join('')+'</g>'}

let s=1;const rd=()=>{s=(s*16807)%2147483647;return s/2147483647};
function chum(cx,cy,n,goc){let g='';for(let i=0;i<6;i++)g+=la(cx,cy,goc+i*28-60,1.1+rd()*.5);for(let i=0;i<n;i++){const a=rd()*Math.PI*2,d=rd()*70;g+=hoa(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,.7+rd()*.6,rd()*360,['#E0412F','#D63A2A','#F0562F','#C8372D'][i%4])}return g}
function canh(){let g='';for(let i=0;i<26;i++){const x=rd()*1000,y=rd()*500;if(x>300&&x<700&&y<330)continue;g+=`<ellipse cx="${x}" cy="${y}" rx="${3+rd()*3}" ry="${6+rd()*4}" fill="${rd()>.3?'#E0412F':'#F2C86B'}" opacity="${.55+rd()*.4}" transform="rotate(${rd()*360} ${x} ${y})"/>`}return g}
const svg=`<svg class="hoa" viewBox="0 0 1000 500" style="left:0;top:0;width:100vw;height:50vw" preserveAspectRatio="none">
${canh()}${chum(40,40,14,20)}${chum(115,25,9,0)}${chum(25,120,8,60)}${chum(960,40,14,160)}${chum(885,25,9,180)}${chum(975,120,8,120)}
${chum(30,470,10,-40)}${chum(970,470,10,220)}</svg>`;
document.getElementById('hoaLop').innerHTML=svg;
</script>
</body></html>
