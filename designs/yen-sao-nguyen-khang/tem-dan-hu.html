<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tem dán hũ – Yến Sào Nguyên Khang</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@700&family=Oswald:wght@600&family=Be+Vietnam+Pro:wght@600;800&display=block" rel="stylesheet">
<style>
  @page { size: 60mm 115mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 60mm; height: 115mm; }
  .serif { font-family: 'Playfair Display', serif; }
  .script { font-family: 'Dancing Script', cursive; }
  .cond { font-family: 'Oswald', sans-serif; }
  .sans { font-family: 'Be Vietnam Pro', sans-serif; }
  /* chữ trên nền xanh: viền xanh đậm + bóng đổ cho rõ nét */
  .lit { paint-order: stroke; stroke: #0a2a80; stroke-width: 2.5px; stroke-linejoin: round; filter: url(#shadow); }
  .lit-thin { paint-order: stroke; stroke: #0a2a80; stroke-width: 1.2px; stroke-linejoin: round; filter: url(#shadow); }
</style>
</head>
<body>
<!-- Kích thước in: phần tròn Ø60mm, tổng chiều cao 115mm (1 đơn vị = 0,1mm) -->
<svg id="tem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1150">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d79a2b"/>
      <stop offset=".25" stop-color="#f6dc8c"/>
      <stop offset=".5" stop-color="#f2c14e"/>
      <stop offset=".75" stop-color="#fbe7a6"/>
      <stop offset="1" stop-color="#d9a034"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".45" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f0b43c"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".5" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffc928"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#04154a" flood-opacity=".65"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset=".3" stop-color="#fff3b0"/>
      <stop offset=".6" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5bd3a"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset=".7" stop-color="#1f56e0"/>
      <stop offset="1" stop-color="#1546c4"/>
    </radialGradient>
    <linearGradient id="bgTail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f56e0"/>
      <stop offset=".5" stop-color="#3a74fa"/>
      <stop offset="1" stop-color="#1f56e0"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="300" cy="300" r="238"/></clipPath>
    <path id="arcTop" d="M 112,300 A 188 188 0 0 1 488,300"/>
  </defs>

  <!-- ĐUÔI TEM -->
  <path d="M 212,520 H 388 V 1080 A 40 40 0 0 1 348,1120 H 252 A 40 40 0 0 1 212,1080 Z" fill="url(#gold)"/>
  <path d="M 222,520 H 378 V 1076 A 34 34 0 0 1 344,1110 H 256 A 34 34 0 0 1 222,1076 Z" fill="url(#bgTail)"/>
  <path d="M 230,520 H 370 V 1072 A 28 28 0 0 1 342,1100 H 258 A 28 28 0 0 1 230,1072 Z" fill="none" stroke="url(#goldV)" stroke-width="1.5"/>

  <g text-anchor="middle" fill="url(#goldText)">
    <text class="script lit-thin" x="300" y="636" font-size="34">Bảo quản</text>
    <text class="script lit-thin" x="300" y="678" font-size="34">ngăn mát</text>
    <text class="script lit-thin" x="300" y="720" font-size="34">tủ lạnh từ</text>
    <text class="script lit-thin" x="300" y="762" font-size="31">5 – 7 ngày.</text>
    <path d="M 255,792 H 345" stroke="url(#goldV)" stroke-width="1.5"/>
    <text x="300" y="799" font-size="14" fill="#ffd76a">✦</text>
    <text class="sans lit-thin" x="300" y="840" font-size="17" font-weight="800" fill="#ffffff">NSX: ............</text>
    <text class="sans lit-thin" x="300" y="878" font-size="17" font-weight="800" fill="#ffffff">HSD: ............</text>
    <text class="serif lit" x="300" y="975" font-size="56" font-weight="900">100%</text>
  </g>
  <path d="M 230,1000 H 370 V 1072 A 28 28 0 0 1 342,1100 H 258 A 28 28 0 0 1 230,1072 Z" fill="url(#band)"/>
  <text class="sans" x="300" y="1047" font-size="17" font-weight="800" text-anchor="middle" fill="#0a2a80" letter-spacing=".5">NGUYÊN CHẤT</text>

  <!-- PHẦN TRÒN -->
  <circle cx="300" cy="300" r="292" fill="url(#gold)"/>
  <circle cx="300" cy="300" r="282" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="276" fill="none" stroke="url(#goldV)" stroke-width="1.5"/>
  <g id="meander" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="miter"></g>
  <circle cx="300" cy="300" r="240" fill="none" stroke="url(#goldV)" stroke-width="2"/>

  <!-- Chữ cong -->
  <text class="serif lit" font-size="29" font-weight="900" fill="#ffffff" letter-spacing="3">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">TỔ YẾN CHƯNG SẴN</textPath>
  </text>

  <!-- Logo NK -->
  <g id="logo" transform="translate(300,232)" filter="url(#shadow)">
    <path d="M 38,-78 A 82 82 0 1 0 38,78 A 70 74 0 1 1 38,-78 Z" fill="url(#gold)" transform="translate(-20,0)"/>
    <text class="serif" x="-12" y="34" font-size="98" font-weight="700" text-anchor="middle" fill="url(#goldV)">N</text>
    <!-- chim yến -->
    <path d="M 18,12 L 46,-2 L 22,-26 C 44,-16 58,-10 72,-10 C 86,-34 104,-52 132,-66 C 118,-46 108,-30 102,-14 C 110,-17 116,-22 124,-22 L 134,-21 L 124,-15 C 110,0 86,6 62,4 Z" fill="url(#gold)"/>
    <circle cx="94" cy="-38" r="0"/>
    <!-- sóng tổ yến -->
    <path d="M -30,54 C 10,74 70,62 112,24" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -24,68 C 18,88 76,76 116,40" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -16,81 C 24,98 78,90 114,58" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Tên thương hiệu -->
  <text class="script lit" x="300" y="360" font-size="44" text-anchor="middle" fill="#ffffff">Yến sào</text>
  <text class="serif lit" x="300" y="412" font-size="47" font-weight="900" text-anchor="middle" fill="url(#goldText)" letter-spacing=".5">NGUYÊN KHANG</text>

  <!-- Ngôi sao 2 bên -->
  <g fill="url(#goldV)" font-size="18" text-anchor="middle">
    <text x="104" y="268">✦</text><text x="96" y="304">✦</text><text x="104" y="340">✦</text>
    <text x="496" y="268">✦</text><text x="504" y="304">✦</text><text x="496" y="340">✦</text>
  </g>

  <!-- Dải vàng số điện thoại -->
  <g clip-path="url(#inner)">
    <rect x="0" y="428" width="600" height="92" fill="url(#band)"/>
    <rect x="0" y="428" width="600" height="2" fill="#fff4cc"/>
  </g>
  <g transform="translate(150,454)" fill="#0d2f8f">
    <!-- icon điện thoại -->
    <rect x="0" y="0" width="34" height="34" rx="9"/>
    <path d="M10,7 c2-1 4,0 5,2 l2,4 c1,2 0,3-1,4 l-2,1 c1,3 3,5 6,6 l1-2 c1-1 2-2 4-1 l4,2 c2,1 3,3 2,5 c-1,3-4,4-7,3 c-8-2-14-8-16-16 c-1-3 0-6 2-8z" fill="#f6dc8c"/>
  </g>
  <text class="cond" x="322" y="486" font-size="44" font-weight="600" text-anchor="middle" fill="#0a2a80" letter-spacing="1">0935 961 481</text>
  <text class="sans" x="300" y="510" font-size="15" font-weight="800" text-anchor="middle" fill="#0a2a80" letter-spacing="3">TINH HOA YẾN VIỆT</text>
</svg>
<script>
  // Viền hoa văn chữ Vạn (Greek key) chạy quanh vòng tròn
  const g = document.getElementById('meander');
  const N = 44, rOut = 272, rIn = 246, cx = 300, cy = 300;
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * 2 * Math.PI, a1 = ((i + 1) / N) * 2 * Math.PI;
    const P = (t, r) => { const a = a0 + (a1 - a0) * t; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
    const h = rOut - rIn;
    const pts = [P(0, rIn), P(0, rOut), P(.78, rOut), P(.78, rIn + h * .25), P(.3, rIn + h * .25), P(.3, rIn + h * .62), P(.55, rIn + h * .62)];
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M' + pts.map(q => q.map(v => v.toFixed(2)).join(',')).join(' L'));
    g.appendChild(p);
    const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const b0 = P(0, rIn), b1 = P(1, rIn);
    base.setAttribute('d', `M${b0} A ${rIn} ${rIn} 0 0 1 ${b1}`);
    g.appendChild(base);
  }
</script>
</body>
</html>
