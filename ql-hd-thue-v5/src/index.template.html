<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QL-HD-THUE v5 — Tính lại và đối chiếu</title>
<style>
:root{--bg:#f5f6f8;--fg:#1d2330;--muted:#667085;--line:#dfe3ea;--card:#fff;--brand:#b20f1a;--ok:#11865b;--warn:#b56a00;--bad:#c63d4f;--mid:#2e5aac;--low:#667085}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101722;--fg:#e8eef7;--muted:#aab7c7;--line:#2e3c50;--card:#1a2432;--brand:#e0505c;--ok:#55d6a1;--warn:#f2bd68;--bad:#ff8797;--mid:#8db3ff;--low:#aab7c7}}
:root[data-theme="dark"]{--bg:#101722;--fg:#e8eef7;--muted:#aab7c7;--line:#2e3c50;--card:#1a2432;--brand:#e0505c;--ok:#55d6a1;--warn:#f2bd68;--bad:#ff8797;--mid:#8db3ff;--low:#aab7c7}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Roboto,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .sub{opacity:.85;font-size:12px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
nav.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:14px 16px 40px;max-width:1280px;margin:0 auto}
h2{font-size:17px;margin:10px 0}h3{font-size:14px;margin:18px 0 6px;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .v{font-size:19px;font-weight:700}.card .l{color:var(--muted);font-size:12px;margin-top:4px}
.card.ok .v{color:var(--ok)}.card.warn .v{color:var(--warn)}.card.bad .v{color:var(--bad)}.card.info .v{color:var(--mid)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:var(--bg);color:var(--muted);font-weight:600;position:sticky;top:0}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(127,127,127,.08)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--line);color:var(--fg);white-space:nowrap}
.tag.ok{background:rgba(17,134,91,.15);color:var(--ok)}.tag.warn{background:rgba(181,106,0,.15);color:var(--warn)}
.tag.bad{background:rgba(198,61,79,.15);color:var(--bad)}.tag.mid{background:rgba(46,90,172,.15);color:var(--mid)}.tag.low,.tag.info{color:var(--low)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.alert{padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin:10px 0}.alert.bad{border-color:var(--bad)}
.filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
select,button.back,.filter button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.back{margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Cần bật JavaScript để chạy ứng dụng.</noscript>

</body>
</html>
