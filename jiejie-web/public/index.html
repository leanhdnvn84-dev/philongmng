<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JieJie's Kitchen · Just like mom's food!</title>
<meta name="description" content="JieJie's Kitchen, Phnom Penh: natural seasoning powders, stock cubes and snacks made with Cambodian ingredients. Order online, pay on delivery.">
<meta name="theme-color" content="#117A37">
<meta property="og:title" content="JieJie's Kitchen">
<meta property="og:description" content="Just like mom's food! Natural seasonings made with Cambodian ingredients.">
<meta property="og:image" content="/img/chicken-shiitake.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23117A37'/%3E%3Cpath d='M12 24c0-6 4-11 12-13-1 8-5 13-12 13z' fill='%23FFD84D'/%3E%3Ccircle cx='27' cy='25' r='4' fill='%23FF7A1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one long scrolling story. Each chapter is a full-width colour band; a journey spine with numbered stops runs down the left on wide screens; progress bar + chapter label in the sticky header. */
:root{
  --green:#117A37; --green-d:#0B6B2D; --green-l:#D6F5DC;
  --yellow:#FFB800; --sun:#FFD84D; --sun-l:#FFE27A; --orange:#FF7A1A;
  --peach:#FFD0B0; --pink:#FFC2D4;
  --bg:#FFF9EC; --card:#FFFFFF; --ink:#1B2A1E; --muted:#5A6A5C; --line:#EDE2C8;
  --on-color:#1B2A1E; --on-color-muted:#3F4A3F; --on-green:#FFFFFF; --chip:#FFF1C9;
  --band-l:#D6F5DC; --band-s:#FFE27A; --band-p:#FFD0B0;
  --shadow:0 12px 32px -16px rgba(60,50,10,.4);
  --font:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1811; --card:#16231A; --ink:#F2EFE3; --muted:#A8B7AA; --line:#26372B;
  --green-l:#173A22; --chip:#2B2A14; --shadow:0 12px 32px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1811; --card:#16231A; --ink:#F2EFE3; --muted:#A8B7AA; --line:#26372B;
  --green-l:#173A22; --chip:#2B2A14; --shadow:0 12px 32px -16px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}

/* demo bar */
.demobar{background:var(--ink);color:var(--bg);font-size:.85rem}
.demobar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px}
.demobar button{background:none;border:0;cursor:pointer;opacity:.8;padding:4px 8px;color:inherit}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.1rem;white-space:nowrap;min-width:0}
.logo svg{flex:none}
.now{margin-left:auto;min-width:0;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:999px}
.now:hover{background:var(--green-l)}
.now b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--sun);color:var(--on-color)}
.cartbtn{border:0;background:var(--green);color:var(--on-green);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.cartbtn .n{background:var(--sun);color:var(--on-color);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 6px}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--orange);width:0;transition:width .1s linear}
.toc{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:10px;width:min(320px,calc(100vw - 32px));border:1px solid var(--line)}
.toc a{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none}
.toc a:hover{background:var(--green-l)}
.toc a span{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.toc a.on span{background:var(--green);color:var(--on-green)}
@media (max-width:760px){.cartbtn .lbl{display:none}.logo .nm{display:none}}
@media (max-width:420px){.now .lbl2{display:none}.lang button{padding:5px 8px}.cartbtn{padding:8px 10px}header.top .wrap{gap:8px}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:600;border-radius:999px;padding:13px 22px;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--green);color:var(--on-green);box-shadow:0 5px 0 var(--green-d)}
.btn.sun{background:var(--sun);color:var(--on-color);box-shadow:0 5px 0 var(--yellow)}
.btn.ghost{background:transparent;border:2px solid currentColor}
.btn.sm{padding:9px 16px;font-size:.92rem}

/* opening */
.open{background:var(--green);color:var(--on-green);position:relative;overflow:hidden}
.open .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:64px 80px;position:relative}
.kicker{font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.open .kicker{color:var(--sun)}
.open h1{font-size:clamp(2.3rem,5.6vw,4rem);font-weight:700;margin-top:14px;letter-spacing:-.01em}
.open h1 em{font-style:normal;color:var(--sun)}
.open .lead{font-size:1.15rem;opacity:.92;margin-top:18px;max-width:36ch}
.open .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;align-items:center}
.open .cta .btn.ghost{color:var(--on-green)}
.cue{display:inline-flex;align-items:center;gap:10px;margin-top:40px;font-size:.92rem;opacity:.85;text-decoration:none}
.cue i{width:26px;height:40px;border:2px solid currentColor;border-radius:14px;position:relative}
.cue i::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;border-radius:2px;background:currentColor;transform:translateX(-50%);animation:cue 1.8s ease infinite}
@keyframes cue{50%{transform:translate(-50%,10px)}}
.open-art{position:relative;min-height:330px;display:grid;place-items:center}
.open-art .sunball{position:absolute;width:min(360px,80%);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--sun)}
.open-art .jars{position:relative;display:flex;align-items:flex-end;gap:4px}
.open-art svg{filter:drop-shadow(0 18px 20px rgba(0,0,0,.25))}
.leafdeco{position:absolute;opacity:.16;pointer-events:none}
@media (max-width:820px){.open .wrap{grid-template-columns:1fr;padding-block:44px 56px}.open-art{min-height:240px}}

/* chapters + spine */
.chapter{position:relative;scroll-margin-top:64px}
.chapter > .wrap{position:relative;padding-block:88px;padding-left:max(96px,env(safe-area-inset-left,0px))}
.chapter > .wrap::before{content:"";position:absolute;left:max(39px,calc(env(safe-area-inset-left,0px) + 23px));top:0;bottom:0;border-left:3px dashed var(--spine,var(--green));opacity:.35}
.stop{position:absolute;left:max(18px,calc(env(safe-area-inset-left,0px) + 2px));top:84px;width:48px;height:48px;border-radius:50%;background:var(--stop-bg,var(--green));color:var(--stop-fg,var(--on-green));display:grid;place-items:center;font-weight:700;font-size:1.1rem;box-shadow:0 0 0 6px var(--band,var(--bg));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.chapter.in .stop{transform:scale(1.12)}
.ch-head{max-width:720px}
.ch-head .kicker{color:var(--kick,var(--green))}
.ch-head h2{font-size:clamp(1.9rem,4.4vw,3rem);margin-top:10px;letter-spacing:-.01em}
.ch-head p.lede{font-size:1.12rem;margin-top:16px;max-width:58ch}
.ch-body{margin-top:40px}
@media (max-width:640px){
  .chapter > .wrap{padding-block:64px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .chapter > .wrap::before{display:none}
  .stop{position:static;margin-bottom:18px;width:44px;height:44px;box-shadow:none}
}

/* band colours */
.b-land{--band:var(--band-l);background:var(--band);color:var(--on-color);--muted:var(--on-color-muted);--kick:var(--green)}
.b-farm{--band:var(--orange);background:var(--band);color:var(--on-color);--muted:var(--on-color-muted);--kick:var(--on-color);--stop-bg:var(--on-color);--spine:var(--on-color)}
.b-kitch{--band:var(--bg)}
.b-ingr{--band:var(--band-s);background:var(--band);color:var(--on-color);--muted:var(--on-color-muted);--kick:#7A5A00;--stop-bg:var(--orange);--spine:var(--orange)}
.b-jars{--band:var(--bg)}
.b-check{--band:var(--green);background:var(--band);color:var(--on-green);--muted:rgba(255,255,255,.82);--kick:var(--sun);--stop-bg:var(--sun);--stop-fg:var(--on-color);--spine:var(--sun)}
.b-recipe{--band:var(--band-p);background:var(--band);color:var(--on-color);--muted:var(--on-color-muted);--kick:#8A3A00;--stop-bg:var(--orange);--spine:var(--orange)}
.b-order{--band:var(--bg)}
.b-visit{--band:var(--sun);background:var(--band);color:var(--on-color);--muted:var(--on-color-muted);--kick:var(--green)}

/* ch1 land */
.land{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.mapcard{background:var(--card);color:var(--ink);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.mapcard svg{width:100%;height:auto;display:block}
.places{display:grid;gap:14px}
.place{background:rgba(255,255,255,.65);border-radius:var(--r-md);padding:20px 22px}
.place h3{font-size:1.25rem}
.place p{margin-top:6px}
@media (max-width:820px){.land{grid-template-columns:1fr}}

/* ch2 farmers */
.farm-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:stretch}
.quote{background:var(--bg);color:var(--ink);border-radius:var(--r-lg);padding:32px;position:relative;--muted:#5A6A5C}
.quote p.q{font-size:clamp(1.15rem,2.2vw,1.45rem);line-height:1.55;font-weight:500}
.quote .by{display:flex;gap:12px;align-items:center;margin-top:20px;color:var(--muted);font-size:.92rem}
.quote .av{width:48px;height:48px;border-radius:50%;background:var(--green-l);display:grid;place-items:center;flex:none}
.bigfact{background:var(--on-color);color:var(--sun);border-radius:var(--r-lg);padding:32px;display:flex;flex-direction:column;justify-content:center}
.bigfact b{font-size:clamp(3rem,8vw,5rem);line-height:1;font-weight:700}
.bigfact p{color:#FFF9EC;margin-top:12px}
@media (max-width:820px){.farm-grid{grid-template-columns:1fr}}

/* ch3 kitchen journey */
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.journey::before{content:"";position:absolute;left:8%;right:8%;top:36px;border-top:3px dashed var(--line)}
.jstep{position:relative;text-align:center;padding:0 6px}
.jstep .ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);position:relative}
.jstep .ic small{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--on-color);font-weight:700;font-size:.75rem;display:grid;place-items:center}
.jstep h3{font-size:1.15rem}
.jstep p{color:var(--muted);margin-top:6px;font-size:.95rem}
@media (max-width:820px){.journey{grid-template-columns:1fr 1fr;row-gap:32px}.journey::before{display:none}}
@media (max-width:420px){.journey{grid-template-columns:1fr}}

/* ch4 ingredients */
.ingr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.ingr div{background:rgba(255,255,255,.7);border-radius:var(--r-md);padding:16px 10px;text-align:center;font-size:.9rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--on-color)}
.ingr i{width:38px;height:38px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.ingr small{color:var(--on-color-muted);font-weight:400;font-size:.76rem;line-height:1.3}
@media (max-width:900px){.ingr{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.ingr{grid-template-columns:repeat(3,1fr)}}
.seg-switch{display:inline-flex;background:rgba(255,255,255,.6);border-radius:999px;padding:4px;margin-bottom:20px;flex-wrap:wrap}
.seg-switch button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--on-color)}
.seg-switch button.on{background:var(--on-color);color:var(--sun)}

/* ch5 jars */
.jar{display:grid;grid-template-columns:.9fr 1.1fr;border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.jar + .jar{margin-top:24px}
.jar .pic{display:grid;place-items:center;padding:32px;min-height:300px;position:relative}
.jar .pic .size{position:absolute;left:18px;top:18px;background:#FFF9EC;color:#1B2A1E;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600}
.jar .info{padding:32px;display:flex;flex-direction:column;gap:12px;min-width:0}
.jar .tagline{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.jar h3{font-size:clamp(1.5rem,3vw,2rem)}
.jar .pills{display:flex;flex-wrap:wrap;gap:6px}
.jar .pills span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.84rem}
.jar .use{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:.95rem}
.jar .use b{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
.buy{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.qty button{border:0;background:none;width:40px;height:40px;font-size:1.25rem;cursor:pointer;border-radius:50%}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.jar.flip{grid-template-columns:1.1fr .9fr}
.jar.flip .pic{order:2}
@media (max-width:760px){.jar,.jar.flip{grid-template-columns:1fr}.jar.flip .pic{order:0}.jar .pic{min-height:220px}.jar .info{padding:24px}}

/* photos */
.open-art .heroimg{position:relative;width:min(330px,82%);transform:rotate(-3deg)}
.open-art .heroimg img{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 24px 40px -18px rgba(0,0,0,.45)}
.open-art .carrot{position:absolute;left:-46px;bottom:28px;transform:rotate(-12deg);z-index:2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.open-art .tagpill{position:absolute;right:-12px;top:22px;background:var(--orange);color:#fff;font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px;transform:rotate(6deg);box-shadow:0 6px 14px rgba(0,0,0,.2)}
.jar .pic img{display:block;max-width:100%;height:auto;border-radius:20px;box-shadow:0 18px 30px -16px rgba(0,0,0,.4)}
.oline .sw{overflow:hidden}
.oline .sw img{width:100%;height:100%;object-fit:cover}
.moreT{font-size:1.5rem;margin-top:56px}
.more{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:20px}
@media (max-width:1000px){.more{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.more{grid-template-columns:minmax(0,1fr)}}
.mcard{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mpic{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;padding:14px}
.mpic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px}
.mpic .size{position:absolute;left:12px;top:12px;background:#FFF9EC;color:#1B2A1E;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600}
.mbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.mbody h3{font-size:1.05rem}
.mbody p{font-size:.9rem}
.mbody .ingline{font-size:.8rem;color:var(--muted);line-height:1.45}
.mbody .buy{gap:10px}
.mbody .price{font-size:1.3rem}
.mbody .qty button{width:34px;height:34px}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;width:max-content}
.vstack{display:grid;gap:24px;min-width:0}
.vcard.bake .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vcard.bake .pills span{background:var(--pink);color:#1B2A1E;border-radius:999px;padding:6px 14px;font-weight:600}

/* ch6 check */
.check{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.seal{width:180px;height:180px;border-radius:50%;background:var(--sun);color:var(--on-color);display:grid;place-items:center;text-align:center;font-weight:700;padding:24px;line-height:1.25;box-shadow:0 0 0 10px rgba(255,216,77,.25);font-size:.95rem}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checklist div{background:rgba(255,255,255,.1);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:10px}
.checklist div::before{content:"✓";color:var(--sun);font-weight:700}
@media (max-width:720px){.check{grid-template-columns:1fr}.seal{width:150px;height:150px}.checklist{grid-template-columns:1fr}}

/* ch7 recipes */
.recipes{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:700px){.recipes{grid-template-columns:1fr}}
.rcard{background:var(--bg);color:var(--ink);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:10px;--muted:#5A6A5C}
:root[data-theme="dark"] .rcard{--muted:#A8B7AA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rcard{--muted:#A8B7AA}}
.rcard .facts{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem}
.rcard .facts span{background:var(--card);border-radius:999px;padding:3px 10px}
.rcard h3{font-size:1.2rem}
.rcard ol{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}
.rcard .toggle{align-self:flex-start;background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:0;margin-top:auto}
:root[data-theme="dark"] .rcard .toggle{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rcard .toggle{color:var(--sun)}}
.rcard .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:6px}

/* ch8 order */
.formwrap{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:start}
@media (max-width:900px){.formwrap{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow)}

.panel + .panel{margin-top:18px}
.oline{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.oline:last-child{border-bottom:0}
.oline .sw{width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.oline .nm{font-weight:600;min-width:0}
.oline .nm small{display:block;color:var(--muted);font-weight:400}
.oline .qty button{width:34px;height:34px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
label.f input,label.f textarea,label.f select{border:2px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-weight:400;font-size:1rem;width:100%}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:none;border-color:var(--green)}
label.f.err input,label.f.err textarea{border-color:#D93A2B}
label.f .msg{color:#D93A2B;font-weight:500;font-size:.82rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.seg label{border:2px solid var(--line);border-radius:var(--r-md);padding:14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--bg)}
.seg label:has(input:checked){border-color:var(--green);background:var(--green-l)}
.seg input{accent-color:var(--green);margin-top:5px}
.seg small{display:block;color:var(--muted)}
@media (max-width:420px){.seg{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}
.senderr{color:#D93A2B;font-weight:600;font-size:.9rem;margin-top:14px}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.sum{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-weight:700;font-size:1.25rem;border-top:2px solid var(--line);padding-top:10px;margin-top:4px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.ok{text-align:center;padding:40px 24px;max-width:560px;margin:0 auto}
.ok .tick{width:76px;height:76px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;margin:0 auto 18px}
.ok code{display:inline-block;background:var(--sun-l);color:var(--on-color);padding:6px 14px;border-radius:10px;font-size:1.15rem;font-weight:700;margin:10px 0;letter-spacing:.04em}

/* epilogue */
.visit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.citem span.muted{overflow-wrap:anywhere}
@media (max-width:820px){.visit{grid-template-columns:minmax(0,1fr)}}
.vcard{background:var(--bg);color:var(--ink);border-radius:var(--r-lg);padding:26px;--muted:#5A6A5C}
:root[data-theme="dark"] .vcard{--muted:#A8B7AA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vcard{--muted:#A8B7AA}}
.vcard h3{font-size:1.2rem;margin-bottom:6px}
.citem{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.citem:last-of-type{border-bottom:0}
.citem .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--green-l)}
.citem div{min-width:0}
.citem b{display:block}
.citem .act{margin-left:auto;flex:none}
.copy{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.85rem;text-decoration:none}
.streetmap{border-radius:var(--r-md);overflow:hidden;margin:6px 0 14px;background:var(--green-l)}
.streetmap svg{display:block;width:100%;height:auto}

/* drawer + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:80;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) 20px;box-shadow:-20px 0 40px rgba(0,0,0,.2);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer h2{font-size:1.3rem}
.drawer .list{flex:1;overflow:auto}
.x{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;z-index:90;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

footer.ft{background:var(--green-d);color:#EAF6EC}
footer.ft .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;padding-block:28px;font-size:.88rem}
footer.ft span{opacity:.8}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

function t(k){return (T[S.lang]&&T[S.lang][k])||T.en[k]||k}
function L(o){return o[S.lang]||o.en}
function P(id){return C.products.find(function(p){return p.id===id})}
function money(n){return C.currency+n.toFixed(2)}
function count(){return Object.keys(S.cart).reduce(function(a,k){return a+S.cart[k]},0)}
function sub(){return Object.keys(S.cart).reduce(function(a,k){var p=P(k);return a+(p?p.price*S.cart[k]:0)},0)}
function save(){store("jj_cart",S.cart);document.getElementById("cartN").textContent=count()}
function setQ(id,q){if(q<=0)delete S.cart[id];else S.cart[id]=Math.min(q,99);save()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(n){return S.lang==="kh"?String(n).replace(/\d/g,function(d){return"០១២៣៤៥៦៧៨៩"[d]}):String(n)}

  '<div class="fields">'+fld("name",t("name"),"text",false,"Sokha")+fld("phone",t("phone"),"tel",false,"012 345 678")+(S.mode==="deliv"?fld("addr",t("addr"),"textarea",true,"#12, St. 155, Toul Tompoung"):"")+fld("note",t("note"),"text",true,"")+
  '<input class="hp" tabindex="-1" autocomplete="off" id="o-website" aria-hidden="true"></div></div></div>'+
  '<aside class="panel" style="position:sticky;top:90px"><h3>'+t("summary")+'</h3>'+summaryHTML()+(S.err&&S.err.send?'<p class="senderr" role="alert">'+S.err.send+' · '+C.hotline+'</p>':'')+'<button class="btn pri" type="submit" style="width:100%;justify-content:center;margin-top:20px"'+(S.sending?' disabled':'')+'>'+(S.sending?t("sending"):t("send"))+'</button><p class="muted" style="font-size:.85rem;margin-top:12px;text-align:center">'+t("cod")+' · Hotline '+C.hotline+'</p></aside></form>'}
function chVisit(){
  var map='<svg viewBox="0 0 400 200" aria-hidden="true"><rect width="400" height="200" fill="var(--green-l)"/><g stroke="var(--card)" stroke-width="14"><path d="M0 80H400"/><path d="M0 160H400"/><path d="M150 0V200"/><path d="M290 0V200"/></g>'+
  '<g fill="var(--bg)" opacity=".75"><rect x="20" y="14" width="110" height="50" rx="8"/><rect x="168" y="14" width="104" height="50" rx="8"/><rect x="20" y="98" width="110" height="46" rx="8"/><rect x="308" y="98" width="80" height="46" rx="8"/></g>'+
  '<text x="160" y="76" font-size="11" fill="var(--muted)" font-family="Kantumruy Pro,system-ui">St. 155</text><text x="296" y="155" font-size="11" fill="var(--muted)" font-family="Kantumruy Pro,system-ui">St. 472</text>'+
  '<rect x="306" y="20" width="72" height="24" rx="6" fill="#FF7A1A"/><text x="342" y="36" text-anchor="middle" font-size="10" fill="#fff" font-family="Kantumruy Pro,system-ui">Carl\'s Jr.</text>'+
  '<g transform="translate(252 40)"><path d="M0 0c-14 0-24 10-24 24 0 19 24 40 24 40s24-21 24-40C24 10 14 0 0 0z" fill="#117A37"/><circle cx="0" cy="24" r="8" fill="#FFD84D"/></g></svg>';
  var ws=S.wsDone?'<p style="background:var(--green-l);border-radius:12px;padding:14px;font-weight:600;margin-top:12px">'+t("wsOk")+'</p>':
   '<form id="wsForm" class="fields" novalidate style="margin-top:12px"><label class="f full" for="w-biz">'+t("biz")+'<input id="w-biz" placeholder="Lucky Market"></label>'+
   '<label class="f" for="w-type">'+t("bizType")+'<select id="w-type"><option>'+t("tMarket")+'</option><option>'+t("tShop")+'</option><option>'+t("tResto")+'</option><option>'+t("tDist")+'</option></select></label>'+
   '<label class="f" for="w-phone">'+t("phone")+'<input id="w-phone" type="tel"></label><input class="hp" tabindex="-1" autocomplete="off" id="w-website" aria-hidden="true">'+(S.wsErr?'<p class="senderr full" role="alert">'+S.wsErr+'</p>':'')+'<div class="full"><button class="btn pri sm" type="submit"'+(S.wsSending?' disabled':'')+'>'+(S.wsSending?t("sending"):t("askQuote"))+'</button></div></form>';
  return '<div class="ch-body visit" id="visitBox"><div class="vcard"><h3>'+t("shopT")+'</h3><div class="streetmap">'+map+'</div>'+
  '<div class="citem"><span class="ic">'+ICON.pin+'</span><div><b>'+t("address")+'</b><span class="muted">'+t("addressV")+'</span></div></div>'+
  '<div class="citem"><span class="ic">'+ICON.clock+'</span><div><b>'+t("hoursL")+'</b><span class="muted">'+t("hoursV")+'</span></div></div>'+
  '<div class="citem"><span class="ic">'+ICON.phone+'</span><div><b>'+t("phoneL")+'</b><span class="muted" id="ph">'+C.phone+'</span></div><button class="copy act" data-copy="'+C.phone+'">'+t("copy")+'</button></div>'+
  '<div class="citem"><span class="ic">'+ICON.phone+'</span><div><b>Hotline</b><span class="muted" id="hl">'+C.hotline+'</span></div><button class="copy act" data-copy="'+C.hotline+'">'+t("copy")+'</button></div>'+
  '<div class="citem"><span class="ic">'+ICON.tg+'</span><div><b>Telegram</b><span class="muted">'+C.telegram+'</span></div><a class="copy act" href="https://t.me/'+C.telegram.replace("@","")+'" target="_blank" rel="noopener">↗</a></div>'+
  '<div class="citem"><span class="ic">'+ICON.fb+'</span><div><b>Facebook</b><span class="muted">'+C.facebook+'</span></div><a class="copy act" href="https://'+C.facebook+'" target="_blank" rel="noopener">↗</a></div>'+
  '<a class="btn sun sm" style="margin-top:14px" href="https://www.google.com/maps/search/?api=1&query=Street+155+Street+472+Toul+Tompoung+Phnom+Penh" target="_blank" rel="noopener">'+t("openMap")+' ↗</a></div>'+
  '<div class="vstack"><div class="vcard bake"><h3>'+t("bakeT")+'</h3><p class="muted">'+t("bakeL")+'</p><div class="pills">'+C.bakery.map(function(b){return '<span>'+esc(L(b))+'</span>'}).join("")+'</div></div><div class="vcard"><h3>'+t("wsT")+'</h3><p class="muted">'+t("wsL")+'</p>'+ws+'</div></div></div>'}

var BODY=[chLand,chFarm,chKitchen,chIngr,chJars,chCheck,chRecipes,function(){return '<div class="ch-body" id="orderBox">'+orderBody()+'</div>'},chVisit];

function opening(){
  var leaf='<svg class="leafdeco" style="right:-40px;top:-30px" width="260" height="260" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 90C10 40 40 10 95 5 90 60 60 90 10 90z" fill="#FFD84D"/></svg><svg class="leafdeco" style="left:-60px;bottom:-70px" width="220" height="220" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 90C10 40 40 10 95 5 90 60 60 90 10 90z" fill="#fff"/></svg>';
  return '<section class="open" id="start">'+leaf+'<div class="wrap"><div><p class="kicker">'+t("openKick")+'</p><h1>'+t("openTitle")+'</h1><p class="lead">'+t("openLead")+'</p>'+
  '<div class="cta"><a class="btn sun" href="#land">'+t("begin")+' ↓</a><a class="btn ghost" href="#order">'+t("skip")+'</a></div>'+
  '<a class="cue" href="#land"><i></i>'+t("scroll")+'</a></div>'+
  '<div class="open-art"><div class="sunball"></div><div class="heroimg"><img src="img/chicken-shiitake.jpg" alt="'+esc(L(P("chicken").name))+'"><span class="carrot">'+carrot(64)+'</span><span class="tagpill">'+t("tagline")+'</span></div></div></div></section>'}

/* ---------- RENDER ---------- */
function render(){
  var y=window.scrollY;
  document.documentElement.lang=S.lang==="kh"?"km":"en";
  document.getElementById("lang-kh").className=S.lang==="kh"?"on":"";
  document.getElementById("lang-en").className=S.lang==="en"?"on":"";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.getAttribute("data-t"))});
  document.getElementById("story").innerHTML=opening()+CH.map(function(c,i){return '<section class="chapter '+c.cls+'" id="'+c.id+'"><div class="wrap">'+head(i)+BODY[i]()+'</div></section>'}).join("");
  document.getElementById("footer").innerHTML='<span>'+t("ftNote")+'</span><a href="#start">↑ '+t("toTop")+'</a>';
  save();observe();cur=-2;onScroll();
  window.scrollTo(0,y);
}
function swap(id,html){var el=document.getElementById(id);if(el)el.outerHTML=html}
function refreshOrder(){var b=document.getElementById("orderBox");if(b)b.innerHTML=orderBody()}
function toast(msg){var o=document.createElement("div");o.className="toast";o.textContent=msg;document.body.appendChild(o);setTimeout(function(){o.remove()},1800)}

/* progress + current chapter */
var cur=-2;
function onScroll(){
  var h=document.documentElement,max=h.scrollHeight-h.clientHeight;
  document.getElementById("prog").style.width=(max>0?h.scrollTop/max*100:0)+"%";
  var idx=-1;CH.forEach(function(c,i){var el=document.getElementById(c.id);if(el&&el.getBoundingClientRect().top<window.innerHeight*.4)idx=i});
  if(idx!==cur){cur=idx;
    document.getElementById("nowNum").textContent=idx<0?"·":num(idx+1);
    document.getElementById("nowLbl").textContent=idx<0?t("start"):t("c"+(idx+1));
    if(document.querySelector(".toc"))toc(true);
  }
}
window.addEventListener("scroll",onScroll,{passive:true});
var io;
function observe(){
  if(!("IntersectionObserver" in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle("in",e.isIntersecting)})},{rootMargin:"-30% 0px -50% 0px"});
  document.querySelectorAll(".chapter").forEach(function(s){io.observe(s)});
}
function toc(keep){
  var box=document.getElementById("tocBox"),btn=document.getElementById("nowBtn");
  if(!keep&&box.innerHTML){box.innerHTML="";btn.setAttribute("aria-expanded","false");return}
  box.innerHTML='<nav class="toc" aria-label="Chapters"><a href="#start" class="'+(cur<0?"on":"")+'"><span>·</span>'+t("start")+'</a>'+CH.map(function(c,i){return '<a href="#'+c.id+'" class="'+(cur===i?"on":"")+'"><span>'+num(i+1)+'</span>'+t("c"+(i+1))+'</a>'}).join("")+'</nav>';
  btn.setAttribute("aria-expanded","true");
}

function drawer(){
  var ids=Object.keys(S.cart);
  document.getElementById("overlay").innerHTML='<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="'+t("cartTitle")+'"><header><h2>'+t("cartTitle")+'</h2><button class="x" data-close aria-label="'+t("close")+'">✕</button></header>'+
  '<div class="list">'+(ids.length?ids.map(function(id){var p=P(id);return '<div class="oline"><div class="sw" style="background:'+p.tint+'">'+art(p)+'</div><div class="nm">'+esc(L(p.name))+'<small>'+money(p.price*S.cart[id])+'</small></div><div class="qty"><button data-q="'+id+'" data-d="-1">−</button><span>'+S.cart[id]+'</span><button data-q="'+id+'" data-d="1">+</button></div></div>'}).join(""):'<p class="empty">'+t("emptyCart")+'</p>')+'</div>'+
  summaryHTML()+'<a class="btn pri" href="#order" data-close style="justify-content:center;margin-top:16px">'+t("checkout")+' →</a></aside>';
}
function closeDrawer(){document.getElementById("overlay").innerHTML=""}

/* ---------- EVENTS ---------- */
function grabForm(){if(!document.getElementById("o-name"))return;S.form={};["name","phone","addr","note"].forEach(function(k){var el=document.getElementById("o-"+k);if(el)S.form[k]=el.value})}
document.addEventListener("click",function(e){
  var el=e.target.closest("button,a");
  if(!e.target.closest("#tocBox,#nowBtn")){document.getElementById("tocBox").innerHTML="";document.getElementById("nowBtn").setAttribute("aria-expanded","false")}
  if(!el)return;var d=el.dataset;
  if(d.lang){grabForm();S.lang=d.lang;store("jj_lang",S.lang);render();if(document.querySelector(".drawer"))drawer();return}
  if(d.pq){S.pq[d.pq]=Math.max(1,Math.min(99,S.pq[d.pq]+(+d.d)));document.getElementById("pq-"+d.pq).textContent=S.pq[d.pq];return}
  if(d.add){grabForm();setQ(d.add,(S.cart[d.add]||0)+S.pq[d.add]);refreshOrder();toast(t("added")+" · "+S.pq[d.add]);return}
  if(d.q){e.preventDefault();grabForm();setQ(d.q,(S.cart[d.q]||0)+(+d.d));if(document.querySelector(".drawer"))drawer();refreshOrder();return}
  if(d.mix){S.mix=d.mix;swap("ingrBox",chIngr());return}
  if(d.recipe){S.open[d.recipe]=!S.open[d.recipe];swap("recipeBox",chRecipes());return}
  if(d.copy!==undefined){var v=d.copy;var sel=function(){var r=document.createRange();r.selectNodeContents(document.getElementById("ph"));var s=getSelection();s.removeAllRanges();s.addRange(r)};
    if(navigator.clipboard)navigator.clipboard.writeText(v).then(function(){toast(t("copied"))},sel);else sel();return}
  if(d.close!==undefined){closeDrawer();return}
  if(el.id==="nowBtn"){toc();return}
  if(el.id==="cartBtn"){drawer();return}
  if(el.id==="newOrder"){S.done=null;S.form={};S.err=null;refreshOrder();return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();document.getElementById("tocBox").innerHTML=""}});
document.addEventListener("change",function(e){if(e.target.name==="mode"){grabForm();S.mode=e.target.value;refreshOrder()}});
function code(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return"JJ"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}
function post(url,data){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
   .then(function(r){
     if(r.status===404||r.status===405)return {ok:true,code:code(),demo:true}; /* chạy ngoài Cloudflare: chế độ thử */
     return r.json().catch(function(){return {ok:false}});
   })
   .catch(function(){return {ok:false}});
}
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="orderForm"){
    if(S.sending)return;
    grabForm();var f=S.form,err={};
    var hp=document.getElementById("o-website").value;
    if(!count())err.cart=t("errEmpty");
    if(!(f.name||"").trim())err.name=t("errName");
    if(((f.phone||"").replace(/\D/g,"")).length<8)err.phone=t("errPhone");
    if(S.mode==="deliv"&&!(f.addr||"").trim())err.addr=t("errAddr");
    S.err=Object.keys(err).length?err:null;
    if(S.err){refreshOrder();document.getElementById("order").scrollIntoView({behavior:"smooth"});return}
    S.sending=true;refreshOrder();
    post("/api/order",{name:f.name,phone:f.phone,addr:S.mode==="deliv"?f.addr:"",note:f.note,mode:S.mode,lang:S.lang,website:hp,
      items:Object.keys(S.cart).map(function(id){return {id:id,qty:S.cart[id]}})}).then(function(r){
      S.sending=false;
      if(r.ok){S.done=r.code;S.cart={};S.err=null;save()}else{S.err={send:t("errSend")}}
      refreshOrder();document.getElementById("order").scrollIntoView({behavior:"smooth"});
    });
  }
  if(e.target.id==="wsForm"){
    if(S.wsSending)return;
    var g=function(id){var el=document.getElementById(id);return el?el.value:""};
    var d={biz:g("w-biz"),type:g("w-type"),phone:g("w-phone"),website:g("w-website"),lang:S.lang};
    if(!d.biz.trim()||d.phone.replace(/\D/g,"").length<8){S.wsErr=t("errWsPhone");swap("visitBox",chVisit());restoreWs(d);return}
    S.wsSending=true;S.wsErr=null;swap("visitBox",chVisit());restoreWs(d);
    post("/api/wholesale",d).then(function(r){
      S.wsSending=false;
      if(r.ok){S.wsDone=true}else{S.wsErr=t("errSend")+" · "+C.hotline}
      swap("visitBox",chVisit());if(!r.ok)restoreWs(d);
    });
  }
});
function restoreWs(d){var m={"w-biz":d.biz,"w-type":d.type,"w-phone":d.phone};Object.keys(m).forEach(function(k){var el=document.getElementById(k);if(el)el.value=m[k]})}
window.addEventListener("hashchange",function(){closeDrawer();document.getElementById("tocBox").innerHTML=""});
render();
if(location.hash){var tgt=document.getElementById(location.hash.slice(1));if(tgt)tgt.scrollIntoView()}
})();
</script>
</body>
</html>
